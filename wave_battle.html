<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Скверная волна</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: Georgia, serif; }
        canvas { display: block; background: transparent; touch-action: none; position: relative; z-index: 2; }

        #portal-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('assets/assets2/backgrounds/Dark_magical.png') center center / cover no-repeat;
    z-index: 0; pointer-events: none;
}

        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; transform: translate(-50%, -140%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 15px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 13px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }

        #exit-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px; padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer; }

        #battle-controls { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 45; width: 100%; }

        #attack-icon { position: relative; width: 85px; height: 85px; cursor: pointer; pointer-events: auto; border-radius: 50%; border: 3px solid #6b5a3a; background: radial-gradient(circle at center, rgba(200,160,80,0.25), rgba(0,0,0,0.7)); box-shadow: 0 0 20px rgba(139,107,58,0.5); display: flex; align-items: center; justify-content: center; transition: transform 0.1s; margin-bottom: 20px; }
        #attack-icon:active { transform: scale(0.92); }
        #attack-icon img { width: 60px; height: 60px; object-fit: contain; }

        #skills-row { display: none; flex-direction: row; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap; }
        .skill-btn { cursor: pointer; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; width: 85px; height: 85px; object-fit: contain; transition: all 0.2s; display: block; flex-shrink: 0; box-sizing: border-box; }
        .skill-btn:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
        .skill-btn.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }

        #wave-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #c8a050; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000; z-index: 40; letter-spacing: 1px; text-align: center; }

        #arrow-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% - 70px)); color: #e0c080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b5a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; }

        #kill-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% + 70px)); color: #ff8080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b3a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

        @media (max-width: 600px) {
            #exit-btn { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #wave-label { font-size: 12px !important; top: 6px !important; max-width: 90% !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 13px !important; }
            #mob-hp-name { font-size: 12px !important; top: -10px !important; }
            #battle-controls { bottom: 100px; gap: 10px; }
            #attack-icon { width: 70px !important; height: 70px !important; margin-bottom: 10px !important; }
            #attack-icon img { width: 50px !important; height: 50px !important; }
            .skill-btn { width: 70px; height: 70px; }
            #skills-row { gap: 10px; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #arrow-counter { transform: translateX(calc(-50% - 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #kill-counter { transform: translateX(calc(-50% + 55px)); font-size: 13px !important; padding: 3px 10px !important; }
        }
    </style>
</head>
<body>
    <div id="portal-bg"></div>
    <div id="wave-label">Скверная волна</div>

    <div id="arrow-counter"><img src="assets/interface/sherwood_hollow_arrow.png" alt=""><span id="arrow-count-text">0</span></div>
    <div id="kill-counter"><span id="kill-count-text">Убито: 0 / 33</span></div>

    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>

    <div id="blood-overlay"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">MP: 0</span>
    </div>

    <button id="exit-btn" onclick="exitWave();">← Сдаться</button>

    <div id="battle-controls">
        <div id="attack-icon">
            <img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png" alt="">
            <div id="attack-cooldown-overlay">0.0s</div>
        </div>
        <div id="skills-row"></div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <!-- ЕДИНАЯ СИСТЕМА БОЯ -->
    <script src="js/sherwood/battle_visuals.js"></script>

    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var waveId = urlParams.get('wave') || '1';

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(0, 0.55, 3.6);
        camera.rotation.order = 'YXZ';
        camera.lookAt(0, 0.45, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        var keyLight = new THREE.DirectionalLight(0xffe8c0, 1.0);
        keyLight.position.set(2, 4, 3);
        scene.add(keyLight);
        var fillLight = new THREE.HemisphereLight(0x8b6b3a, 0x000000, 0.6);
        scene.add(fillLight);

        var enemySprite = null;
        var enemyTexture = null;

        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var waveMusic = new Audio('assets/assets2/music/dungeon_1.ogg');
        waveMusic.loop = true;
        waveMusic.volume = 0.4;

        function playSound(a) { try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {} }

        setTimeout(function () { try { waveMusic.play().catch(function () {}); } catch (e) {} }, 300);
        window.addEventListener('click', function () { try { waveMusic.play().catch(function () {}); } catch (e) {} });

        var isBattleActive = false;
        var battleTimer = null;

        window.Sherwood = window.Sherwood || {};

        window.Sherwood.BattleVisuals.init({
            THREE: THREE,
            scene: scene,
            group: null,
            loader: new THREE.TextureLoader(),
            camFPS: camera,
            bgPath: 'assets/assets2/Sherwood_Square/ceiling_quest.png',
            camFPSOptions: { y: 0.55, z: 3.6, lookY: 0.45 },
            mapSize: 16,
            getPlayer: function () { return parent.Sherwood.getPlayer(); },
            Talents: parent.Sherwood.Talents,
            UI: parent.UI,
            getMobName: function (img) {
                if (!img) return 'Враг';
                var f = img.split('/').pop().replace('.png', '');
                return f;
            },
            playSoundHit: function () { playSound(soundHit); },
            playSoundAltar: function () { playSound(soundAltar); },
            onCenterText: function (text, color) {
                if (parent.UI && parent.UI._showToast) parent.UI._showToast(text);
            },
            onHpChanged: function () { if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay(); },
            onCameraEnter: function () { },
            onCameraExit: function () { },
            onBattleStop: function () { },
            onEnemyKilled: function (enemyObj) {
                // Когда враг убит, вызываем логику волны
                if (parent.Sherwood && parent.Sherwood.Wave) {
                    parent.Sherwood.Wave.onEnemyKilled();
                }
            },
            onDeath: function (reason) {
                // Если игрок умер — выходим
                exitWave();
            }
        });

        setTimeout(function () {
            window.Sherwood.BattleVisuals.loadArrowsFromBag();
            window.Sherwood.BattleVisuals.renderLearnedTalents();
        }, 700);

        // Загружаем первого врага
        function loadNextEnemy() {
            if (!parent.Sherwood || !parent.Sherwood.Wave) return;
            var enemyData = parent.Sherwood.Wave.getCurrentEnemy();
            if (!enemyData) return;

            // Обновляем UI
            document.getElementById('mob-hp-name').textContent = enemyData.name;
            document.getElementById('kill-count-text').textContent = 
                'Убито: ' + parent.Sherwood.Wave.getKillCount() + ' / ' + parent.Sherwood.Wave.getTotalEnemies();
            
            // Создаём спрайт
            if (enemySprite) {
                scene.remove(enemySprite);
                enemySprite = null;
            }
            var loader = new THREE.TextureLoader();
            loader.load(enemyData.imagePath, function(tex) {
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: tex, transparent: true, alphaTest: 0.05
                }));
                window.Sherwood.BattleVisuals.setupEnemySprite(enemySprite, enemyData.isBoss);
                scene.add(enemySprite);
                
                window.Sherwood.BattleVisuals.start({
                    hp: enemyData.hp, maxHp: enemyData.hp,
                    atk: enemyData.atk, def: enemyData.def,
                    isBoss: enemyData.isBoss, img: enemyData.imagePath,
                    x: 0, y: 0, mesh: enemySprite
                });
                
                document.getElementById('battle-controls').style.display = 'flex';
                document.getElementById('skills-row').style.display = 'flex';
                document.getElementById('mob-hp').style.display = 'block';
                isBattleActive = true;
            });
        }

        function attackEnemy() {
            if (!isBattleActive) return;
            window.Sherwood.BattleVisuals.attack();
        }

        function exitWave() {
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            try { waveMusic.pause(); waveMusic.currentTime = 0; } catch(e) {}
            try {
                if (parent.UI) {
                    parent.UI._lastWave = null;
                    parent.UI.camp();
                }
            } catch(e) {}
        }
        window.exitWave = exitWave;

        document.getElementById('attack-icon').addEventListener('click', function (e) { e.stopPropagation(); attackEnemy(); });
        document.getElementById('attack-icon').addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); attackEnemy(); });
        document.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key.toLowerCase() === 'enter') { e.preventDefault(); attackEnemy(); } });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            var dt = Math.min(clock.getDelta(), 0.05);

            window.Sherwood.BattleVisuals.update(dt);

            if (enemySprite) {
                var t = clock.elapsedTime;
                if (!enemySprite.userData || !enemySprite.userData._kb) {
                    enemySprite.position.y = -0.4 + Math.sin(t * 2.5) * 0.02;
                }
            }

            renderer.render(scene, camera);

            if (isBattleActive && enemySprite) {
                window.Sherwood.BattleVisuals.updateMobHpBar();
            }
        }

        loadNextEnemy();
        animate();

        // Слушаем колбэк от Wave, чтобы загрузить нового врага
        setInterval(function() {
            if (!isBattleActive && parent.Sherwood.Wave && parent.Sherwood.Wave._isActive) {
                // Если волна активна, но бой не идёт — загружаем следующего
                loadNextEnemy();
            }
        }, 500);

        addEventListener('resize', function () {
            camera.aspect = innerWidth / innerHeight;
            camera.lookAt(0, 0.45, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
