<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Портал</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: Georgia, serif; }
        canvas { display: block; background: transparent; touch-action: none; position: relative; z-index: 2; cursor: pointer; }

        #portal-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('assets/assets2/Sherwood_Square/ceiling_quest.png') center center / cover no-repeat; z-index: 0; pointer-events: none; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; left: 50%; top: 30%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 16px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }

        #exit-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px; padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer; }

        #skills-left, #skills-right { position: absolute; bottom: 130px; width: 110px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 45; }
        #skills-left { left: 10px; }
        #skills-right { right: 10px; }
        #skills-left img, #skills-right img { width: 44px; height: 44px; object-fit: contain; cursor: pointer; border-radius: 6px; transition: all 0.2s; border: 2px solid rgba(200, 160, 80, 0.7); background: rgba(0, 0, 0, 0.5); padding: 2px; }
        #skills-left img:hover, #skills-right img:hover { filter: drop-shadow(0 0 10px #ffd700); transform: scale(1.1); }
        #skills-left img.on-cooldown, #skills-right img.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        #attack-icon { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: 84px; height: 84px; z-index: 40; cursor: pointer; pointer-events: auto; border-radius: 50%; border: 3px solid #6b5a3a; background: radial-gradient(circle at center, rgba(200,160,80,0.25), rgba(0,0,0,0.7)); box-shadow: 0 0 20px rgba(139,107,58,0.5); display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
        #attack-icon:active { transform: translateX(-50%) scale(0.92); }
        #attack-icon img { width: 60px; height: 60px; object-fit: contain; }
        #attack-cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: none; align-items: center; justify-content: center; color: #ff5555; font-weight: bold; font-size: 20px; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }

        #loot-fly-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }

        #wave-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #c8a050; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000; z-index: 40; letter-spacing: 1px; text-align: center; }

        #arrow-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% - 70px)); color: #e0c080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b5a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
        #arrow-counter img { width: 22px; height: 22px; object-fit: contain; }
        #arrow-counter.low { color: #ff5555; border-color: #ff5555; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%,100% { box-shadow: 0 0 4px #ff5555; } 50% { box-shadow: 0 0 16px #ff5555; } }

        @media (max-width: 600px) {
            #exit-btn { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #wave-label { font-size: 12px !important; top: 6px !important; max-width: 90% !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #mob-hp-name { font-size: 13px !important; top: -12px !important; }
            #attack-icon { width: 70px !important; height: 70px !important; bottom: 40px !important; }
            #attack-icon img { width: 50px !important; height: 50px !important; }
            #skills-left, #skills-right { bottom: 110px !important; width: 80px !important; }
            #skills-left img, #skills-right img { width: 38px !important; height: 38px !important; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #hit-effect-img { width: 130px !important; height: 130px !important; }
            #arrow-counter { transform: translateX(calc(-50% - 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #arrow-counter img { width: 18px !important; height: 18px !important; }
        }
    </style>
</head>
<body>
    <div id="portal-bg"></div>

    <div id="wave-label"></div>
    <div id="arrow-counter"><img src="assets/interface/sherwood_hollow_arrow.png" alt=""><span id="arrow-count-text">25</span></div>

    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>

    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>
    <div id="loot-fly-layer"></div>
    <div id="blood-overlay"></div>

    <div id="skills-left"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>

    <div id="skills-right"></div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">MP: 0</span>
    </div>

    <button id="exit-btn" onclick="exitPortal();">← Выйти</button>

    <div id="attack-icon">
        <img src="assets/assets2/talents/simple_attack.png" alt="">
        <div id="attack-cooldown-overlay">0.0s</div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <!-- ЕДИНЫЙ МОДУЛЬ БОЯ (для стрел, скиллов, кулдауна, урона) -->
    <script src="js/sherwood/battle_visuals.js"></script>

    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var portalId = parseInt(urlParams.get('portal') || '1');

        // === СЛОВАРЬ ИМЁН (восстановлен) ===
        var MOB_NAMES = {
            'plague_crow.png': 'Чумной Ворон', 'bone_vulture.png': 'Костяной Стервятник', 'executioner_crow.png': 'Ворон-Палач', 'plague_pixie.png': 'Чумная Пикси', 'putrid_sprite.png': 'Гнилостный Спрайт', 'forest_strangler.png': 'Лесной Душегуб', 'warped_imp.png': 'Искажённый Бес', 'bristle_boar.png': 'Шипастый Секач', 'quill_beast.png': 'Кристальный Иглобрюх', 'grave_borer.png': 'Личинка Короеда', 'acid_devourer.png': 'Кислотный Короед-Пожиратель', 'shard_back.png': 'Шервудский Дикобраз', 'bone_borer.png': 'Костяной Короед-Трупоед', 'bark_beetle.png': 'Жук-Короед', 'blight_beetle_warden.png': 'Чумной Короед-Страж', 'armored_beetle.png': 'Бронированный Короед', 'blighted_werewolf.png': 'Осквернённый Оборотень', 'blight_lord_beetle.png': 'Повелитель Гнили', 'blight_alpha.png': 'Альфа-Скверноискатель', 'yew_blight_wolf.png': 'Волк Тисовой Скверны', 'swamp_slugmouth.png': 'Болотный Слизнерот', 'swamp_gorgymouth.png': 'Скверножаб', 'swamp_drowner.png': 'Болотный Утопленник', 'bog_brute.png': 'Торфяной Труп', 'blighted_oak_golem.png': 'Голем Скверного Дуба', 'oak_golem.png': 'Голем Дуба', 'twigtangle.png': 'Хворост', 'woodland_terror.png': 'Древесный Ужас', 'leshy.png': 'Леший', 'root_executioner.png': 'Корневой Палач', 'leshy_servant.png': 'Слуга Лешего', 'spectral_stag.png': 'Призрачный Олень', 'forest_blight_cyclops.png': 'Лесное Лихо', 'blight_troglodyte.png': 'Лихо-Троглодит', 'blight_oozemouth.png': 'Слизнерот-Громила', 'blight_lord_leshy.png': 'Древний Владыка', 'bog_trapper.png': 'Болотный Капкан', 'blight_spitter.png': 'Скверноплюй', 'swamp_spider.png': 'Болотный Паук', 'ocular_arachnid.png': 'Окулярный Арахнид', 'blight_horn_worm.png': 'Болотный Рогохвост', 'searing_arachnid.png': 'Выжигающий Арахнид', 'swamp_centipede.png': 'Болотная Сколопендра', 'water_hag.png': 'Водная Баба', 'marsh_witch.png': 'Болотная Ведунья', 'blight_snail.png': 'Улитка Скверны', 'ancient_blight_snail.png': 'Древняя Улитка Скверны', 'sherwood_lizard.png': 'Шервудский Ящер', 'peat_lord.png': 'Торфяной Владыка', 'lost_maiden.png': 'Заблудшая Дева', 'bog_witch.png': 'Болотная Ведьма', 'swamp_kikimora.png': 'Болотная Кикимора', 'blight_boletus.png': 'Боровик Скверны', 'swamp_vodyanoy.png': 'Водяной Скверны', 'swamp_drake.png': 'Болотный Дракончик', 'blight_cerberus.png': 'Цербер Скверны', 'putrid_wolf.png': 'Гниющий Волк', 'ripper_wolf.png': 'Волк-Потрошитель', 'blight_fox.png': 'Гнилостная Лиса', 'fox_pack_lord.png': 'Повелитель Стаи', 'swamp_viper.png': 'Болотная Гадюка', 'putrid_rat.png': 'Гнилостная Крыса', 'oppressor_firefly.png': 'Светляк-Угнетатель', 'executioner_cricket.png': 'Сверчок-Палач', 'thorn_moth.png': 'Терновый Мотыль', 'plague_bat.png': 'Чумная Летучая Мышь', 'ash_stalker.png': 'Пепельный Охотник', 'ash_assassin.png': 'Пепельный Ассасин', 'bone_keeper.png': 'Хранитель Костей', 'blight_blade.png': 'Клинок Скверны', 'ash_wraith.png': 'Призрак Пепла', 'ash_overlord.png': 'Владыка Пепла', 'basalt_devourer.png': 'Базальтовый Пожиратель', 'grotto_brute.png': 'Громила Грота', 'cave_watcher.png': 'Пещерный Наблюдатель', 'runic_sentinel.png': 'Рунический Страж', 'ancient_watcher.png': 'Древний Наблюдатель', 'lost_treasure_hunter.png': 'Пропавший Кладоискатель', 'blight_moss_ogre.png': 'Огр Скверного Мха', 'warped_worm.png': 'Искажённый Червь', 'grotto_slug.png': 'Гротный Слизень', 'underground_terror.png': 'Подземный Ужас', 'shadow_maiden.png': 'Теневая Дева', 'cursed_priestess.png': 'Проклятая Жрица', 'mistress_of_the_roots.png': 'Повелительница Корней', 'bone_arachnid.png': 'Костяной Арахнид', 'necromantic_arachnid.png': 'Арахнид-Некромант', 'root_daughter.png': 'Дочь Корней', 'animated_yew.png': 'Оживший Тис', 'rusty_servant.png': 'Ржавый Слуга', 'tormentor.png': 'Истязатель', 'grave_archer.png': 'Могильный Лучник', 'rusty_dread.png': 'Ржавый Страх', 'chaos_swordsman.png': 'Мечник Хаоса', 'chaos_knight.png': 'Рыцарь Хаоса', 'chaos_lord.png': 'Лорд Хаоса', 'chaos_harpy.png': 'Гарпия Хаоса', 'blight_kite.png': 'Коршун Скверны', 'harpy_witch.png': 'Гарпия-Ведьма', 'harpy_hatchling.png': 'Птенец Гарпии', 'harpy_chieftain.png': 'Вождь Гарпий', 'lord_of_the_feathered.png': 'Хозяин Пернатых', 'cave_tormentor.png': 'Пещерный Терзатель', 'blight_keeper.png': 'Хранитель Скверны', 'blight_king.png': 'Скверный Король', 'underground_guardian.png': 'Страж Преисподней', 'corruption_raccoon.png': 'Енот Порчи', 'blind_render.png': 'Слепой Терзатель', 'the_cursed_outlaw_king.png': 'Проклятый Король Разбойников', 'ancient_crypt_warden.png': 'Древний Хранитель Склепа', 'echo_of_the_triumvirate.png': 'Эхо Трех Порталов', 'sacred_tree_executioner.png': 'Палач Священного Древа', 'sherwood_abomination.png': 'Шервудское Отродье', 'the_primordial_core.png': 'Изначальный Стержень'
        };
        function getMobName(imgPath) { if (!imgPath) return 'Враг'; var fname = imgPath.split('/').pop(); return MOB_NAMES[fname] || fname; }

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(0, 0.55, 3.6); camera.rotation.order = 'YXZ'; camera.lookAt(0, 0.45, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        var keyLight = new THREE.DirectionalLight(0xffe8c0, 1.0);
        keyLight.position.set(2, 4, 3); scene.add(keyLight);
        var fillLight = new THREE.HemisphereLight(0x8b6b3a, 0x000000, 0.6);
        scene.add(fillLight);

        var enemySprite = null;
        var enemyTexture = null;
        var enemyBaseY = 0.55;

        var BOSS_DIR  = 'assets/assets2/mobs/portal_mobs/';
        var GUARD_DIR = 'assets/all_beasts/';

        function loadEnemyTexture(url, onLoaded) {
            var tex = new THREE.TextureLoader().load(url,
                function(t) { t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; if (onLoaded) onLoaded(t); },
                undefined,
                function() { console.warn('Не нашёл спрайт врага: ' + url); if (onLoaded) onLoaded(null); }
            );
        }

        function createEnemySprite(imageName, isBoss) {
            if (enemySprite) { scene.remove(enemySprite); enemySprite = null; }
            var dir = isBoss ? BOSS_DIR : GUARD_DIR;
            loadEnemyTexture(dir + imageName, function(tex) {
                if (!tex) return;
                enemyTexture = tex;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: enemyTexture, transparent: true, alphaTest: 0.05 }));
                var scale = isBoss ? 3.0 : 2.1;
                window.Sherwood.BattleVisuals.setupEnemySprite(enemySprite, isBoss); // настройка через модуль
                scene.add(enemySprite);
            });
        }

        var battleData = null;
        var isBattleActive = false;
        var playerHitFirst = false;
        var battleTimer = null;
        var enemyKnockback = { active: false, t: 0, duration: 0.25, dx: 0, dz: 0, ox: 0, oz: 0 };
        var cameraShake = 0;

        var activeEffects = [];
        var skillCooldowns = {};
        var playerAttackCooldown = 0, PLAYER_ATTACK_CD = 1.0;

        var bloodSprites = ['assets/assets2/animation/blood_1.png','assets/assets2/animation/blood_2.png','assets/assets2/animation/blood_3.png','assets/assets2/animation/blood_4.png','assets/assets2/animation/blood_5.png'];
        var bloodTextures = bloodSprites.map(function(p) { return new THREE.TextureLoader().load(p); });
        var hitFlashSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: bloodTextures[0], transparent: true, opacity: 0.85, depthTest: false, depthWrite: false }));
        hitFlashSprite.scale.set(0.4, 0.4, 1); hitFlashSprite.visible = false; scene.add(hitFlashSprite);

        var bloodOverlayTextures = ['assets/assets2/animation/Fine_blood_spray_texture.png', 'assets/assets2/animation/Fine_blood_spray_texture (1).png', 'assets/assets2/animation/Fine_blood_spray_texture (2).png'];
        var boT1 = null, boT2 = null;
        function showBloodOverlay() {
            var el = document.getElementById('blood-overlay'); if (!el) return;
            var tex = bloodOverlayTextures[Math.floor(Math.random() * bloodOverlayTextures.length)];
            el.style.backgroundImage = 'url("' + tex + '")'; el.style.transition = 'opacity 0.1s ease-out'; el.style.opacity = '1';
            clearTimeout(boT1); clearTimeout(boT2);
            boT1 = setTimeout(function() { el.style.transition = 'opacity 0.2s ease-out'; el.style.opacity = '0'; }, 200);
            boT2 = setTimeout(function() { el.style.backgroundImage = ''; }, 200);
        }

        var soundHit = new Audio('assets/assets2/tune/hit.wav'); var soundVictory = new Audio('assets/assets2/tune/victory.wav'); var soundDefeat = new Audio('assets/assets2/tune/defeat.wav'); var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var portalMusic = new Audio('assets/assets2/music/dungeon_2.ogg'); portalMusic.loop = true; portalMusic.volume = 0.35;
        function playSound(a) { try { a.currentTime = 0; a.play().catch(function(){}); } catch(e){} }

        setTimeout(function() { try { portalMusic.play().catch(function(){}); } catch(e){} }, 300);
        window.addEventListener('click', function() { try { portalMusic.play().catch(function(){}); } catch(e){} });

        // === ПОДКЛЮЧЕНИЕ МОДУЛЯ БОЯ (СТРЕЛЫ, СКИЛЛЫ, КУЛДАУН) ===
        window.Sherwood = window.Sherwood || {};
        window.Sherwood.BattleVisuals.init({
            THREE: THREE,
            isPortalMode: true,
            scene: scene,
            camFPS: camera,
            loader: new THREE.TextureLoader(),
            bgPath: 'assets/assets2/Sherwood_Square/ceiling_quest.png',
            camFPSOptions: { y: 0.55, z: 3.6, lookY: 0.45 },
            getPlayer: function () { return parent.Sherwood.getPlayer(); },
            Talents: parent.Sherwood.Talents,
            UI: parent.UI,
            getMobName: getMobName,
            playSoundHit: function () { playSound(soundHit); },
            playSoundAltar: function () { playSound(soundAltar); },
            onCenterText: function (text, color) { if (parent.UI && parent.UI._showToast) parent.UI._showToast(text); },
            onHpChanged: function () { if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay(); },
            onCameraEnter: function () {},
            onCameraExit: function () {},
            onBattleStop: function () {},
            onEnemyKilled: function () {},
            onDeath: function () {},
            onAttackButton: function () {}
        });

        setTimeout(function () {
            window.Sherwood.BattleVisuals.loadArrowsFromBag();
            window.Sherwood.BattleVisuals.renderLearnedTalents();
        }, 700);

        function loadBattle() {
            if (!parent.Sherwood || !parent.Sherwood.Portal) return;
            battleData = parent.Sherwood.Portal.getCurrentBattle();
            if (!battleData) return;
            var e = battleData.enemy;
            
            document.getElementById('mob-hp-name').textContent = getMobName(e.image || e.imagePath || '');
            document.getElementById('mob-hp-text').textContent = 'HP: ' + Math.max(0, e.hp) + '/' + e.maxHp;
            updateMobHpBarFill(e.hp, e.maxHp);
            document.getElementById('wave-label').textContent = battleData.portal.name + ' — Волна ' + battleData.level + '/' + battleData.totalLevels;
            
            // Восстанавливаем правильную загрузку: передаём имя файла
            var imgName = e.image || (e.imagePath ? e.imagePath.split('/').pop() : 'plague_crow.png');
            createEnemySprite(imgName, !!e.isBoss);
            
            document.getElementById('mob-hp').style.display = 'block';
            isBattleActive = true;
            playerHitFirst = false;

            if (battleTimer) clearInterval(battleTimer);
            battleTimer = setInterval(function() {
                if (!isBattleActive || !playerHitFirst) return;
                if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
                var p = parent.Sherwood.getPlayer(); if (!p) return;
                if (!battleData || !battleData.enemy) return;
                var edmg = Math.max(1, Math.floor((battleData.enemy.atk || 50) * 0.3));
                if (p.talents) {
                    if (p.talents['blocking']) edmg = Math.floor(edmg * (1 - 0.1 * p.talents['blocking']));
                    if (p.talents['numbness']) edmg = Math.floor(edmg * (1 - 0.08 * p.talents['numbness']));
                }
                p.stats.hp = Math.max(0, p.stats.hp - edmg);
                if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
                updateHeroSpheres(); showBloodOverlay();
                if (p.stats.hp <= 0) {
                    isBattleActive = false;
                    if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
                    document.getElementById('mob-hp').style.display = 'none';
                    var r = parent.Sherwood.Portal.portalAttack();
                    if (r && r.dead && r.resurrected) onPlayerDeath(r);
                    else onPortalFailed({ rewards: {} });
                }
            }, 1500);
        }

        function attackEnemy() {
            if (!isBattleActive || !battleData) return;
            if (playerAttackCooldown > 0) return;
            playerAttackCooldown = PLAYER_ATTACK_CD;
            playerHitFirst = true;
            playSound(soundHit);

            // Стрелы через модуль
            var arrowMult = window.Sherwood.BattleVisuals.spendArrowsForAttack();

            var r = parent.Sherwood.Portal.portalAttack();

            if (enemySprite) {
                enemyKnockback.active = true; enemyKnockback.t = 0; enemyKnockback.ox = enemySprite.position.x; enemyKnockback.oz = enemySprite.position.z; enemyKnockback.dx = 0; enemyKnockback.dz = 0.02;
                hitFlashSprite.material.map = bloodTextures[Math.floor(Math.random() * bloodTextures.length)];
                hitFlashSprite.material.needsUpdate = true; hitFlashSprite.material.rotation = Math.random() * Math.PI * 2;
                var spriteW = enemySprite.scale.x, spriteH = enemySprite.scale.y;
                var ox = (Math.random() - 0.5) * spriteW * 0.7, oy = (Math.random() - 0.5) * spriteH * 0.7;
                hitFlashSprite.position.copy(enemySprite.position); hitFlashSprite.position.x += ox; hitFlashSprite.position.y += oy + (spriteH/2);
                hitFlashSprite.visible = true; setTimeout(function() { hitFlashSprite.visible = false; }, 150);
                cameraShake = 0.06;
            }

            window.Sherwood.BattleVisuals.showHitEffect(enemySprite, camera);

            if (!r) return;
            if (r.portalComplete) { onPortalComplete(r); return; }
            if (r.portalFailed)   { onPortalFailed(r);   return; }
            if (r.dead && r.resurrected) { onPlayerDeath(r); return; }

            if (r.enemyDead) {
                isBattleActive = false;
                if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
                setTimeout(function() {
                    var next = parent.Sherwood.Portal.getCurrentBattle();
                    if (!next) { onPortalComplete(r); return; }
                    battleData = next; loadBattle();
                }, 700);
                return;
            }

            if (r.enemyHp !== undefined) updateMobHpBarFill(r.enemyHp, r.enemyMaxHp);
            if (r.playerHp !== undefined) updateHeroSpheres();
        }

        function useSkill(skillId) {
            if (!isBattleActive || !battleData) return;
            if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer(); if (!p || !p.talents) return;
            var lvl = p.talents[skillId] || 0; if (lvl <= 0) return;
            var manaCosts = { 'poisoning': 10, 'vampirism': 15, 'stunning': 20, 'ricochet': 25, 'riot': 15, 'force_of_elements': 10, 'evil_eye': 20, 'healing': 20, 'healer': 25, 'funnel': 15, 'inspiration': 30, 'knot': 20 };
            var manaCost = (manaCosts[skillId] || 10) * lvl;
            if (!p.stats.mana) p.stats.mana = 0;
            if (p.stats.mana < manaCost) { if (parent.UI && parent.UI._showToast) parent.UI._showToast('Не хватает маны! Нужно ' + manaCost); return; }
            p.stats.mana -= manaCost; updateHeroSpheres();

            var dmg = 0, heal = 0;
            switch (skillId) {
                case 'poisoning': activeEffects.push({ type: 'poison', dmg: 20 * lvl, ticks: 3, endsAt: Date.now() + 3000 }); break;
                case 'vampirism': dmg = 30 * lvl; heal = Math.floor(dmg * 0.5); p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal); updateHeroSpheres(); break;
                case 'stunning': if (Math.random() < 0.2 * lvl) activeEffects.push({ type: 'stun', endsAt: Date.now() + 3000 }); break;
                case 'ricochet': activeEffects.push({ type: 'ricochet', endsAt: Date.now() + 3000, bonus: 0.3 * lvl }); break;
                case 'riot': if (p.stats.hp / p.stats.maxHp < 0.5) activeEffects.push({ type: 'riot', endsAt: Date.now() + 6000, bonus: 0.25 * lvl }); break;
                case 'force_of_elements': dmg = 20 * lvl; break;
                case 'evil_eye': activeEffects.push({ type: 'evil_eye', endsAt: Date.now() + 5000, debuff: 0.15 * lvl }); break;
                case 'healing': heal = 50 * lvl; p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal); updateHeroSpheres(); break;
                case 'healer': activeEffects.push({ type: 'regen', amount: 5 * lvl, ticks: 5, endsAt: Date.now() + 5000 }); break;
                case 'funnel': activeEffects.push({ type: 'funnel', endsAt: Date.now() + 4000, debuff: 0.3 * lvl }); break;
                case 'inspiration': activeEffects.push({ type: 'inspiration', endsAt: Date.now() + 5000, bonus: 0.2 * lvl }); break;
                case 'knot': activeEffects.push({ type: 'knot', endsAt: Date.now() + 3000 * lvl }); break;
            }

            if (dmg > 0) {
                var r = parent.Sherwood.Portal.portalAttack();
                if (r) {
                    if (r.enemyHp !== undefined) updateMobHpBarFill(r.enemyHp, r.enemyMaxHp);
                    if (r.enemyDead) {
                        isBattleActive = false;
                        if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
                        setTimeout(function() {
                            var next = parent.Sherwood.Portal.getCurrentBattle();
                            if (!next) { onPortalComplete(r); return; }
                            battleData = next; loadBattle();
                        }, 700);
                    }
                }
            }

            var cdMap = { 'poisoning': 5000, 'vampirism': 5000, 'stunning': 8000, 'ricochet': 10000, 'riot': 6000, 'evil_eye': 7000, 'healing': 10000, 'healer': 12000, 'funnel': 8000, 'inspiration': 15000, 'knot': 10000 };
            var cd = cdMap[skillId] || 5000; skillCooldowns[skillId] = Date.now() + cd;
            var icon = document.querySelector('img[data-skill-id="' + skillId + '"]');
            if (icon) { icon.classList.add('on-cooldown'); setTimeout(function() { icon.classList.remove('on-cooldown'); }, cd); }
        }

        function updateMobHpBarFill(hp, maxHp) {
            if (!maxHp) maxHp = 1;
            var pct = Math.max(0, Math.min(1, hp / maxHp));
            var fill = document.getElementById('mob-hp-fill'); if (fill) fill.style.clipPath = 'inset(0 ' + (1 - pct) * 100 + '% 0 0)';
            var txt = document.getElementById('mob-hp-text'); if (txt) txt.textContent = 'HP: ' + Math.max(0, hp) + '/' + maxHp;
        }

        function updateHeroSpheres() {
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return;
            var hpPct = Math.max(0, Math.min(1, p.stats.hp / p.stats.maxHp));
            var lifeFill = document.getElementById('life-fill'); if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPct) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text'); if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);
            var mana = p.stats.mana || 0; var maxMana = p.stats.maxMana || 100; var mpPct = Math.max(0, Math.min(1, mana / maxMana));
            var manaFill = document.getElementById('mana-fill'); if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - mpPct) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text'); if (manaText) manaText.textContent = 'MP: ' + Math.floor(mana);
        }
        setTimeout(updateHeroSpheres, 400); setInterval(updateHeroSpheres, 800);

        setInterval(function() {
            if (!isBattleActive || !battleData) return;
            var now = Date.now(); var p = parent.Sherwood && parent.Sherwood.getPlayer && parent.Sherwood.getPlayer();
            for (var i = activeEffects.length - 1; i >= 0; i--) {
                var ef = activeEffects[i];
                if (ef.endsAt < now) { activeEffects.splice(i, 1); continue; }
                if (ef.type === 'poison' && ef.ticks > 0) {
                    if (!ef._lastTick || now - ef._lastTick >= 1000) {
                        ef._lastTick = now; ef.ticks--;
                        if (battleData && battleData.enemy) { battleData.enemy.hp = Math.max(0, battleData.enemy.hp - ef.dmg); updateMobHpBarFill(battleData.enemy.hp, battleData.enemy.maxHp); }
                    }
                }
                if (ef.type === 'regen' && ef.ticks > 0 && p) {
                    if (!ef._lastTick || now - ef._lastTick >= 1000) {
                        ef._lastTick = now; ef.ticks--;
                        p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + ef.amount); updateHeroSpheres();
                    }
                }
            }
        }, 250);

        function onPortalComplete(r) {
            isBattleActive = false; if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            playSound(soundVictory); try { portalMusic.pause(); } catch(e){}
            var rewards = { exp: r.rewards.exp, gold: r.rewards.gold, silver: r.rewards.silver, items: [] };
            if (r.trophy) rewards.items.push({ icon: r.trophyIcon || 'assets/all_trophies/portal_trophies/1_wolf_fang.png', name: r.trophy, quantity: 1 });
            try {
                if (parent.UI && parent.UI._showVictoryScreen) {
                    parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function() { try { parent.Sherwood.Portal.showUI(); } catch(e) { exitPortal(); } };
                    parent.UI._showVictoryScreen(rewards);
                } else { exitPortal(); }
            } catch(e) { exitPortal(); }
        }

        function onPortalFailed(r) {
            isBattleActive = false; if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            playSound(soundDefeat); try { portalMusic.pause(); } catch(e){}
            try {
                if (parent.UI && parent.UI._showDefeatScreen) {
                    parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function() { try { parent.Sherwood.Portal.showUI(); } catch(e) { exitPortal(); } };
                    parent.UI._showDefeatScreen({ exp: 10, silver: 50, gold: 0, items: [] });
                } else { exitPortal(); }
            } catch(e) { exitPortal(); }
        }

        function onPlayerDeath(r) {
            updateHeroSpheres();
            var w = document.getElementById('wave-label');
            if (w) {
                w.textContent = 'Вы воскресли! (-' + r.cost.cost + ' ' + (r.cost.currency === 'gold' ? 'золота' : 'серебра') + ')';
                setTimeout(function() { if (battleData) w.textContent = battleData.portal.name + ' — Волна ' + battleData.level + '/' + battleData.totalLevels; }, 2000);
            }
        }

        function exitPortal() {
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            try { if (parent.Sherwood.Portal) { if (parent.Sherwood.Portal.isInPortal()) parent.Sherwood.Portal.fleePortal(); } } catch(e){}
            try { if (parent.UI) { parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null; } } catch(e){}
            try { if (parent.Sherwood && parent.Sherwood.Portal && parent.Sherwood.Portal.showUI) parent.Sherwood.Portal.showUI(); else if (parent.UI && parent.UI.camp) parent.UI.camp(); } catch(e){}
        }
        window.exitPortal = exitPortal;

        document.getElementById('attack-icon').addEventListener('click', function(e) { e.stopPropagation(); attackEnemy(); });
        document.getElementById('attack-icon').addEventListener('touchstart', function(e) { e.preventDefault(); e.stopPropagation(); attackEnemy(); });
        document.addEventListener('keydown', function(e) { if (e.key === ' ' || e.key.toLowerCase() === 'enter') { e.preventDefault(); attackEnemy(); } });

        function renderTalents() {
            var leftCol = document.getElementById('skills-left');
            var rightCol = document.getElementById('skills-right');
            if (!leftCol || !rightCol) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer(); if (!p || !p.talents) return;
            var talentData = {
                'poisoning': { icon: 'assets/assets2/talents/poisoning.png', side: 'left', name: 'Отравление' },
                'vampirism': { icon: 'assets/assets2/talents/vampirism.png', side: 'left', name: 'Вампиризм' },
                'stunning': { icon: 'assets/assets2/talents/stunning.png', side: 'left', name: 'Оглушение' },
                'ricochet': { icon: 'assets/assets2/talents/Ricochet.png', side: 'left', name: 'Рикошет' },
                'riot': { icon: 'assets/assets2/talents/Riot.png', side: 'left', name: 'Бунт' },
                'evil_eye': { icon: 'assets/assets2/talents/evil_eye.png', side: 'left', name: 'Злой глаз' },
                'healing': { icon: 'assets/assets2/talents/healing.png', side: 'right', name: 'Исцеление' },
                'healer': { icon: 'assets/assets2/talents/Healer.png', side: 'right', name: 'Хилер' },
                'funnel': { icon: 'assets/assets2/talents/funnel.png', side: 'right', name: 'Воронка' },
                'inspiration': { icon: 'assets/assets2/talents/inspiration.png', side: 'right', name: 'Вдохновение' },
                'knot': { icon: 'assets/assets2/talents/knot.png', side: 'right', name: 'Узел' }
            };
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            for (var id in p.talents) {
                var lvl = p.talents[id];
                if (lvl > 0 && talentData[id]) {
                    var img = document.createElement('img');
                    img.src = talentData[id].icon; img.title = talentData[id].name + ' (Ур. ' + lvl + ')';
                    img.dataset.skillId = id; img.style.cursor = 'pointer';
                    img.onclick = (function(sid) { return function() { useSkill(sid); }; })(id);
                    img.addEventListener('touchstart', (function(sid) { return function(e) { e.preventDefault(); e.stopPropagation(); useSkill(sid); }; })(id));
                    (talentData[id].side === 'left' ? leftCol : rightCol).appendChild(img);
                }
            }
        }
        setTimeout(renderTalents, 500);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            var dt = Math.min(clock.getDelta(), 0.05);

            if (playerAttackCooldown > 0) playerAttackCooldown = Math.max(0, playerAttackCooldown - dt);
            var cdOverlay = document.getElementById('attack-cooldown-overlay');
            var attackImg = document.getElementById('attack-icon').querySelector('img');
            if (cdOverlay && attackImg) {
                if (playerAttackCooldown > 0) { cdOverlay.style.display = 'flex'; cdOverlay.textContent = playerAttackCooldown.toFixed(1) + 's'; attackImg.style.opacity = '0.4'; }
                else { cdOverlay.style.display = 'none'; attackImg.style.opacity = '1'; }
            }

            if (enemyKnockback.active && enemySprite) {
                enemyKnockback.t += dt;
                var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1);
                var ease = Math.sin(kk * Math.PI);
                enemySprite.position.x = enemyKnockback.ox + enemyKnockback.dx * ease;
                enemySprite.position.z = enemyKnockback.oz + enemyKnockback.dz * ease;
                if (kk >= 1) { enemySprite.position.x = enemyKnockback.ox; enemySprite.position.z = enemyKnockback.oz; enemyKnockback.active = false; }
            }

            if (cameraShake > 0.001) {
                camera.position.x = (Math.random() - 0.5) * cameraShake;
                camera.position.y = 0.55 + (Math.random() - 0.5) * cameraShake;
                camera.position.z = 3.6 + (Math.random() - 0.5) * cameraShake;
                camera.lookAt(0, 0.45, 0); cameraShake *= 0.85;
            } else if (cameraShake !== 0) {
                camera.position.set(0, 0.55, 3.6); camera.lookAt(0, 0.45, 0); cameraShake = 0;
            }

            // Покачивание как в подземке (без смещения baseY)
            if (enemySprite && !enemyKnockback.active) {
                enemySprite.position.y = enemyBaseY + Math.sin(clock.elapsedTime * 2.5) * 0.02;
            }

            renderer.render(scene, camera);

            if (isBattleActive && enemySprite) {
                var worldPos = enemySprite.position.clone();
                worldPos.y += (enemySprite.scale.y / 2) + 0.1;
                worldPos.project(camera);
                var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
                document.getElementById('mob-hp').style.left = x + 'px';
                document.getElementById('mob-hp').style.top = y + 'px';
            }
        }

        // === ВАЖНО: восстанавливаем enemyBaseY при загрузке через setupEnemySprite ===
        var _origSetup = window.Sherwood.BattleVisuals.setupEnemySprite;
        window.Sherwood.BattleVisuals.setupEnemySprite = function(sprite, isBoss) {
            _origSetup.call(window.Sherwood.BattleVisuals, sprite, isBoss);
            if (sprite) enemyBaseY = sprite.position.y;
        };

        loadBattle();
        animate();

        addEventListener('resize', function() {
            camera.aspect = innerWidth / innerHeight;
            camera.lookAt(0, 0.45, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
