<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="js/sherwood/audio_volume.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Портал</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; font-family: Georgia, serif; }
        canvas { display: block; background: transparent; touch-action: none; position: relative; z-index: 2; }

        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; left: 50%; top: 30%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 16px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }

        #exit-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px; padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer; }

        #battle-controls { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 45; }
        #attack-icon { position: absolute; bottom: 100%; left: 50%; transform: translateX(calc(-50% - 20px)); margin-bottom: 70px; width: 85px; height: 85px; cursor: pointer; pointer-events: auto; padding: 0; border: none; background: none; flex-shrink: 0; display: none; }
        #attack-icon:active { transform: translateX(calc(-50% - 20px)) scale(0.9); }
        #attack-icon img { width: 85px; height: 85px; object-fit: contain; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; transition: all 0.2s; display: block; box-sizing: border-box; }
        #attack-icon img:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
        #attack-cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 8px; display: none; align-items: center; justify-content: center; color: #ff5555; font-weight: bold; font-size: 20px; }
        .skill-btn { cursor: pointer; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; width: 70px; height: 70px; object-fit: contain; transition: all 0.2s; display: block; flex-shrink: 0; box-sizing: border-box; }
        .skill-btn:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
        .skill-btn.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        #skills-row { display: none; flex-direction: row; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }

        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }

        #wave-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #c8a050; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000; z-index: 40; letter-spacing: 1px; text-align: center; }

        #arrow-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% - 70px)); color: #e0c080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b5a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
        #arrow-counter img { width: 22px; height: 22px; object-fit: contain; }
        #arrow-counter.low { color: #ff5555; border-color: #ff5555; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%,100% { box-shadow: 0 0 4px #ff5555; } 50% { box-shadow: 0 0 16px #ff5555; } }

        #kill-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% + 70px)); color: #ff8080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b3a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

        #death-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background: #000; object-fit: cover; display: none; }

        @media (max-width: 600px) {
            #exit-btn { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #wave-label { font-size: 12px !important; top: 6px !important; max-width: 90% !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #mob-hp-name { font-size: 13px !important; top: -12px !important; }
            #battle-controls { bottom: 100px; gap: 10px; }
            #attack-icon { width: 70px; height: 70px; margin-bottom: 50px; }
            #attack-icon img { width: 70px; height: 70px; }
            .skill-btn { width: 60px !important; height: 60px !important; }
            #skills-row { gap: 10px !important; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #hit-effect-img { width: 130px !important; height: 130px !important; }
            #arrow-counter { transform: translateX(calc(-50% - 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #arrow-counter img { width: 18px !important; height: 18px !important; }
            #kill-counter { transform: translateX(calc(-50% + 55px)); font-size: 13px !important; padding: 3px 10px !important; }
        }
    </style>
</head>
<body>

    <div id="wave-label"></div>
    <div id="arrow-counter"><img src="assets/interface/sherwood_hollow_arrow.png" alt=""><span id="arrow-count-text">25</span></div>
    <div id="kill-counter"><span id="kill-count-text">Врагов: 1 / 2</span></div>

    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">0</span>
    </div>

    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>
    <div id="blood-overlay"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">0</span>
    </div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">Скверна: 0%</span>
    </div>

    <button id="exit-btn" onclick="exitPortal();">← Выйти</button>

    <div id="battle-controls">
        <div id="attack-icon">
            <img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png">
            <div id="attack-cooldown-overlay">0.0s</div>
        </div>
        <div id="skills-row"></div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <video id="death-video" src="assets/assets2/animation/background2.webm" muted playsinline></video>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>
    <script src="js/sherwood/battle_visuals.js"></script>
    <script type="module">
        import * as THREE from 'three';

        var portalId = 1;
        try { portalId = parseInt(new URLSearchParams(location.search).get('portal') || '1', 10) || 1; } catch (e) {}

        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0a0805);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.position.set(0, 0.55, 3.6); camera.rotation.order = 'YXZ'; camera.lookAt(0, 0.45, 0);

        const bgTexture = new THREE.TextureLoader().load('assets/assets2/Sherwood_Square/ceiling_quest.png');
        const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.MeshBasicMaterial({ map: bgTexture }));
        bgMesh.position.set(0, 0, -8);
        scene.add(bgMesh);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0a0805, 1);
        document.body.appendChild(renderer.domElement);

        // === КАЧЕСТВО ГРАФИКИ (Настройки → Графика) ===
        function applyGraphicsMode(mode) {
            var pr = mode === 'low' ? 0.75 : (mode === 'medium' ? 1 : Math.min(window.devicePixelRatio || 1, 1.5));
            renderer.setPixelRatio(pr);
        }
        try {
            var gs = localStorage.getItem('sherwood_settings');
            applyGraphicsMode((gs && JSON.parse(gs).graphics) || 'high');
        } catch (e) { applyGraphicsMode('high'); }
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'sherwood_graphics') applyGraphicsMode(e.data.mode);
        });
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var portalMusic = new Audio('assets/assets2/music/dungeon_1.ogg'); portalMusic.loop = true; portalMusic.volume = 0.4;
        function playSound(a) { try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {} }
        setTimeout(function () { try { portalMusic.play().catch(function () {}); } catch (e) {} }, 300);
        window.addEventListener('click', function () { try { portalMusic.play().catch(function () {}); } catch (e) {} });

        function getMobName(imgPath) {
            try {
                var b = parent.Sherwood.Portal.getCurrentBattle();
                if (b && b.enemy && b.enemy.name) return b.enemy.name;
            } catch (e) {}
            return 'Враг';
        }

        function showCenterText(text, color) {
            var el = document.createElement('div');
            el.className = 'bv-center-text';
            el.style.color = color || '#fff';
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1500);
        }

        var enemySprite = null;
        var BOSS_DIR = 'assets/assets2/mobs/portal_mobs/';
        var GUARD_DIR = 'assets/all_beasts/';
        var FALLBACK_IMG = 'assets/interface/labyrinth_of_icons.png';

        window.Sherwood = window.Sherwood || {};
        window.Sherwood.BattleVisuals.init({
            THREE: THREE, scene: scene, camFPS: camera,
            loader: new THREE.TextureLoader(),
            camFPSOptions: { y: 0.55, z: 3.6, lookY: 0.45 },
            getPlayer: function () { return parent.Sherwood.getPlayer(); },
            getMobName: getMobName,
            playSoundHit: function () { playSound(soundHit); },
            playSoundAltar: function () { playSound(soundAltar); },
            onCenterText: function (text, color) { showCenterText(text, color); },
            onHpChanged: function () { try { if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay(); } catch (e) {} },
            onEnemyHpChanged: function (hp) { try { parent.Sherwood.Portal.syncEnemyHp(hp); } catch (e) {} },
            onBattleStart: function () {},
            onEnemyKilled: onEnemyKilled,
            onDeath: onPlayerDeath
        });

        function disposeEnemySprite() {
            if (!enemySprite) return;
            scene.remove(enemySprite);
            if (enemySprite.material) {
                if (enemySprite.material.map) enemySprite.material.map.dispose();
                enemySprite.material.dispose();
            }
            enemySprite = null;
        }

        function createEnemySprite(imgPath, isBoss, callback) {
            disposeEnemySprite();
            var loader = new THREE.TextureLoader();
            loader.load(
                imgPath,
                function (tex) {
                    tex.minFilter = tex.magFilter = THREE.LinearFilter;
                    enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
                    window.Sherwood.BattleVisuals.setupEnemySprite(enemySprite, isBoss);
                    scene.add(enemySprite);
                    if (callback) callback(enemySprite);
                },
                undefined,
                function () {
                    console.warn('Не нашёл текстуру: ' + imgPath);
                    var fallbackTex = new THREE.TextureLoader().load(FALLBACK_IMG);
                    enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: fallbackTex, transparent: true }));
                    window.Sherwood.BattleVisuals.setupEnemySprite(enemySprite, isBoss);
                    scene.add(enemySprite);
                    if (callback) callback(enemySprite);
                }
            );
        }

        function loadBattle() {
            var b = parent.Sherwood.Portal.getCurrentBattle();
            if (!b) { onPortalComplete(null); return; }
            var e = b.enemy;
            var imgPath = (b.isBoss ? BOSS_DIR : GUARD_DIR) + e.image;

            var label = document.getElementById('wave-label');
            if (label) label.textContent = b.portal.name + ' — Волна ' + b.level + '/' + b.totalLevels;
            window.Sherwood.BattleVisuals.updateKillCounter(b.level - 1, b.totalLevels);

            createEnemySprite(imgPath, b.isBoss, function (sprite) {
                window.Sherwood.BattleVisuals.startBattle({
                    hp: e.hp, maxHp: e.maxHp || e.hp,
                    atk: e.attack, def: e.defense,
                    isBoss: b.isBoss, img: imgPath, name: e.name, sprite: sprite
                });
            });
        }

        function onEnemyKilled() {
            playSound(soundVictory);
            disposeEnemySprite();
            var r = null;
            try { r = parent.Sherwood.Portal.portalEnemyDefeated(); } catch (e) {}
            if (!r) return;
            if (r.portalComplete) { onPortalComplete(r); return; }
            setTimeout(loadBattle, 700);
        }

        function onPlayerDeath() {
            var r = null;
            try { r = parent.Sherwood.Portal.portalPlayerDied(); } catch (e) {}
            if (!r) return;
            if (r.portalFailed) { onPortalFailed(r); return; }

            var w = document.getElementById('wave-label');
            if (w) {
                w.textContent = 'Вы воскресли! (-' + r.cost.cost + ' ' + (r.cost.currency === 'gold' ? 'золота' : 'серебра') + ')';
                setTimeout(function () {
                    try {
                        var p = parent.Sherwood.getPlayer();
                        if (p && p.stats) p.stats.hp = p.stats.maxHp;
                    } catch (e) {}
                    loadBattle();
                }, 2000);
            }
        }

        function onPortalComplete(r) {
            window.Sherwood.BattleVisuals.returnArrowsToBag();
            playSound(soundVictory);
            try { portalMusic.pause(); } catch (e) {}
            var rewards = { exp: r && r.rewards ? r.rewards.exp : 0, gold: r && r.rewards ? r.rewards.gold : 0, silver: r && r.rewards ? r.rewards.silver : 0, items: [] };
            if (r && r.trophy) rewards.items.push({ icon: r.trophyIcon || 'assets/all_trophies/portal_trophies/1_wolf_fang.png', name: r.trophy, quantity: 1 });
            try {
                if (parent.UI && parent.UI._showVictoryScreen) {
                    parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function () { try { parent.Sherwood.Portal.showUI(); } catch (e) { exitPortal(); } };
                    parent.UI._showVictoryScreen(rewards);
                } else { exitPortal(); }
            } catch (e) { exitPortal(); }
        }

        function onPortalFailed(r) {
            window.Sherwood.BattleVisuals.returnArrowsToBag();
            playSound(soundDefeat);
            try { portalMusic.pause(); } catch (e) {}
            try {
                if (parent.UI && parent.UI._showDefeatScreen) {
                    parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function () { try { parent.Sherwood.Portal.showUI(); } catch (e) { exitPortal(); } };
                    parent.UI._showDefeatScreen({ exp: 10, silver: 50, gold: 0, items: [] });
                } else { exitPortal(); }
            } catch (e) { exitPortal(); }
        }

        function exitPortal() {
            window.Sherwood.BattleVisuals.stopBattle();
            window.Sherwood.BattleVisuals.returnArrowsToBag();
            try { portalMusic.pause(); portalMusic.currentTime = 0; } catch (e) {}
            try { if (parent.Sherwood.Portal) { if (parent.Sherwood.Portal.isInPortal()) parent.Sherwood.Portal.fleePortal(); } } catch (e) {}
            try { if (parent.UI) { parent.UI._lastPortal = portalId; parent.UI._lastDungeon = null; } } catch (e) {}
            try {
                if (parent.Sherwood && parent.Sherwood.Portal && parent.Sherwood.Portal.showUI) parent.Sherwood.Portal.showUI();
                else if (parent.UI && parent.UI.camp) parent.UI.camp();
            } catch (e) {}
        }
        window.exitPortal = exitPortal;

        function attackEnemy() { window.Sherwood.BattleVisuals.attack(); }
        document.getElementById('attack-icon').addEventListener('click', function (e) { e.stopPropagation(); attackEnemy(); });
        document.getElementById('attack-icon').addEventListener('touchstart', function (e) { e.preventDefault(); e.stopPropagation(); attackEnemy(); });
        document.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key.toLowerCase() === 'enter') { e.preventDefault(); attackEnemy(); } });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            var dt = Math.min(clock.getDelta(), 0.05);

            window.Sherwood.BattleVisuals.update(dt);

            renderer.render(scene, camera);
        }

        addEventListener('resize', function () {
            camera.aspect = innerWidth / innerHeight;
            camera.lookAt(0, 0.45, 0);
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        setTimeout(function () {
            window.Sherwood.BattleVisuals.loadArrowsFromBag();
            window.Sherwood.BattleVisuals.renderLearnedTalents();
            loadBattle();
        }, 700);

        animate();
    </script>
</body>
</html>
