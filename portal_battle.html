<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Портал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background: #000 url('assets/assets2/backgrounds/quest.png') center/cover no-repeat fixed;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: Georgia, serif;
        }

        canvas {
            display: block;
            background: transparent !important;
            touch-action: none;
        }

        #vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
        }
        #scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
        }

        /* === HP врага как в подземке — привязан к спрайту === */
        #mob-hp {
            position: absolute;
            width: 300px;
            height: 200px;
            z-index: 50;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }
        #mob-hp .frame {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill; z-index: 2;
        }
        #mob-hp .fill {
            position: absolute; top: 45%; left: 10%;
            width: 80%; height: 12%;
            object-fit: cover;
            clip-path: inset(0 50% 0 0);
            z-index: 1;
        }
        #mob-hp-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 20px; font-weight: bold;
            z-index: 3;
            text-shadow: 0 0 6px #000, 0 2px 6px #000;
        }

        #exit-btn {
            position: fixed; top: 10px; left: 10px; z-index: 100;
            background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px;
            padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        #skills-left, #skills-right {
            position: absolute; bottom: 130px; width: 110px;
            display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 45;
        }
        #skills-left { left: 10px; }
        #skills-right { right: 10px; }
        #skills-left img, #skills-right img {
            width: 44px; height: 44px; object-fit: contain; cursor: pointer;
            border-radius: 6px; transition: all 0.2s;
            border: 2px solid rgba(200, 160, 80, 0.7); background: rgba(0, 0, 0, 0.5); padding: 2px;
        }
        #skills-left img:hover, #skills-right img:hover { filter: drop-shadow(0 0 10px #ffd700); transform: scale(1.1); }
        #skills-left img.on-cooldown, #skills-right img.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        #attack-icon {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 84px; height: 84px; z-index: 40; cursor: pointer; pointer-events: auto;
            border-radius: 50%;
            border: 3px solid #6b5a3a;
            background: radial-gradient(circle at center, rgba(200,160,80,0.25), rgba(0,0,0,0.7));
            box-shadow: 0 0 20px rgba(139,107,58,0.5);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s;
        }
        #attack-icon:active { transform: translateX(-50%) scale(0.92); }
        #attack-icon img { width: 60px; height: 60px; object-fit: contain; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }

        #loot-fly-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

        #wave-label {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            color: #c8a050; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000;
            z-index: 40; letter-spacing: 1px; text-align: center;
        }
    </style>
</head>
<body>
    <div id="wave-label"></div>

    <div id="mob-hp">
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill-img" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>

    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>
    <div id="loot-fly-layer"></div>

    <div id="skills-left"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>

    <div id="skills-right"></div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">MP: 0</span>
    </div>

    <button id="exit-btn" onclick="exitPortal();">← Выйти</button>

    <div id="attack-icon"><img src="assets/assets2/talents/simple_attack.png" alt=""></div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        //  ПАРАМЕТРЫ
        // ============================================================
        var urlParams = new URLSearchParams(window.location.search);
        var portalId = parseInt(urlParams.get('portal') || '1');

        // ============================================================
        //  СЦЕНА (прозрачный фон, quest.png — это CSS-фон на body)
        // ============================================================
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(0, 0.8, 4.2);
        camera.rotation.order = 'YXZ';
        camera.lookAt(0, 0.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 0);   // прозрачный — видно CSS-фон
        document.body.appendChild(renderer.domElement);

        // Свет
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        var keyLight = new THREE.DirectionalLight(0xffe8c0, 1.0);
        keyLight.position.set(2, 4, 3);
        scene.add(keyLight);
        var fillLight = new THREE.HemisphereLight(0x8b6b3a, 0x000000, 0.6);
        scene.add(fillLight);

        // ============================================================
        //  СПРАЙТ ВРАГА
        // ============================================================
        var enemySprite = null;
        var enemyTexture = null;
        var enemyBaseY = 0.85;
        var enemyOriginalScale = 2.4;

        var BEAST_DIRS = [
            'assets/portal_beasts/visual_portals/',
            'assets/portal_beasts/',
            'assets/all_beasts/'
        ];

        function loadEnemyTexture(imageName, onLoaded) {
            var idx = 0;
            function tryNext() {
                if (idx >= BEAST_DIRS.length) {
                    console.warn('Не нашёл спрайт врага: ' + imageName);
                    if (onLoaded) onLoaded(null);
                    return;
                }
                var url = BEAST_DIRS[idx] + imageName;
                idx++;
                var tex = new THREE.TextureLoader().load(url,
                    function(t) {
                        t.minFilter = THREE.LinearFilter;
                        t.magFilter = THREE.LinearFilter;
                        if (onLoaded) onLoaded(t);
                    },
                    undefined,
                    function() { tryNext(); }
                );
            }
            tryNext();
        }

        function createEnemySprite(imageName, isBoss) {
            if (enemySprite) {
                scene.remove(enemySprite);
                enemySprite = null;
            }
            var scale = isBoss ? enemyOriginalScale * 1.25 : enemyOriginalScale;
            loadEnemyTexture(imageName, function(tex) {
                if (!tex) return;
                enemyTexture = tex;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: enemyTexture, transparent: true, alphaTest: 0.05
                }));
                enemySprite.scale.set(scale, scale, 1);
                enemySprite.position.set(0, enemyBaseY, 0);
                scene.add(enemySprite);
            });
        }

        // ============================================================
        //  ГЛОБАЛЬНЫЕ СОСТОЯНИЯ
        // ============================================================
        var battleData = null;
        var isBattleActive = false;
        var playerHitFirst = false;
        var enemyKnockback = { active: false, t: 0, duration: 0.22, dx: 0, dz: 0, ox: 0, oz: 0 };
        var cameraShake = 0;

        var activeEffects = [];       // эффекты от скиллов
        var skillCooldowns = {};

        var hitFlash = new THREE.Sprite(new THREE.SpriteMaterial({
            transparent: true, opacity: 0.85, depthTest: false, depthWrite: false
        }));
        hitFlash.scale.set(1.1, 1.1, 1);
        hitFlash.visible = false;
        scene.add(hitFlash);

        var bloodTextures = [
            'assets/assets2/animation/blood_1.png',
            'assets/assets2/animation/blood_2.png',
            'assets/assets2/animation/blood_3.png',
            'assets/assets2/animation/blood_4.png',
            'assets/assets2/animation/blood_5.png'
        ].map(function(p) { return new THREE.TextureLoader().load(p); });

        var hitSprites = [
            'strike_claws.png', 'strike_claws_1.png', 'strike_claws_2.png',
            'strike_claws_4.png', 'strike_claws_5.png', 'strike_claws_6.png'
        ];

        // ============================================================
        //  ЗВУКИ
        // ============================================================
        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var portalMusic = new Audio('assets/assets2/music/dungeon_2.ogg');
        portalMusic.loop = true;
        portalMusic.volume = 0.35;

        function playSound(a) { try { a.currentTime = 0; a.play().catch(function(){}); } catch(e){} }

        setTimeout(function() {
            try { portalMusic.play().catch(function(){}); } catch(e){}
        }, 300);
        window.addEventListener('click', function() {
            try { portalMusic.play().catch(function(){}); } catch(e){}
        });

        // ============================================================
        //  ЗАГРУЗКА БОЯ ИЗ РОДИТЕЛЯ
        // ============================================================
        function loadBattle() {
            if (!parent.Sherwood || !parent.Sherwood.Portal) {
                console.warn('Нет parent.Sherwood.Portal');
                return;
            }
            battleData = parent.Sherwood.Portal.getCurrentBattle();
            if (!battleData) {
                console.warn('Нет battleData');
                return;
            }
            var e = battleData.enemy;
            document.getElementById('mob-hp-text').textContent = 'HP: ' + Math.max(0, e.hp) + '/' + e.maxHp;
            updateMobHpBarFill(e.hp, e.maxHp);
            document.getElementById('wave-label').textContent =
                battleData.portal.name + ' — Волна ' + battleData.level + '/' + battleData.totalLevels;

            createEnemySprite(e.image || 'plague_crow.png', !!e.isBoss);
            document.getElementById('mob-hp').style.display = 'block';
            isBattleActive = true;
            playerHitFirst = false;
        }

        // ============================================================
        //  АТАКА ИГРОКА
        // ============================================================
        function attackEnemy() {
            if (!isBattleActive || !battleData) return;
            var r = parent.Sherwood.Portal.portalAttack();
            playSound(soundHit);
            playerHitFirst = true;

            if (enemySprite) {
                knockbackEnemy();
                hitFlash.material.map = bloodTextures[Math.floor(Math.random() * bloodTextures.length)];
                hitFlash.material.needsUpdate = true;
                hitFlash.material.rotation = Math.random() * Math.PI * 2;
                hitFlash.position.copy(enemySprite.position);
                hitFlash.position.y += 0.15;
                hitFlash.visible = true;
                setTimeout(function() { hitFlash.visible = false; }, 150);
                cameraShake = 0.06;
            }

            showHitEffect();

            if (!r) return;

            if (r.portalComplete) { onPortalComplete(r); return; }
            if (r.portalFailed)   { onPortalFailed(r);   return; }
            if (r.dead && r.resurrected) { onPlayerDeath(r); return; }

            if (r.enemyDead) {
                isBattleActive = false;
                setTimeout(function() {
                    var next = parent.Sherwood.Portal.getCurrentBattle();
                    if (!next) { onPortalComplete(r); return; }
                    battleData = next;
                    var e2 = next.enemy;
                    document.getElementById('wave-label').textContent =
                        next.portal.name + ' — Волна ' + next.level + '/' + next.totalLevels;
                    createEnemySprite(e2.image || 'plague_crow.png', !!e2.isBoss);
                    updateMobHpBarFill(e2.hp, e2.maxHp);
                    isBattleActive = true;
                    playerHitFirst = false;
                }, 700);
                return;
            }

            if (r.enemyHp !== undefined) {
                updateMobHpBarFill(r.enemyHp, r.enemyMaxHp);
            }

            if (r.playerHp !== undefined) {
                updateHeroSpheres();
            }
        }

        // ============================================================
        //  СКИЛЛЫ
        // ============================================================
        function useSkill(skillId) {
            if (!isBattleActive || !battleData) return;
            if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;
            var lvl = p.talents[skillId] || 0;
            if (lvl <= 0) return;

            var manaCosts = {
                'poisoning': 10, 'vampirism': 15, 'stunning': 20, 'ricochet': 25, 'riot': 15,
                'force_of_elements': 10, 'evil_eye': 20, 'healing': 20, 'healer': 25,
                'funnel': 15, 'inspiration': 30, 'knot': 20
            };
            var manaCost = (manaCosts[skillId] || 10) * lvl;
            if (!p.stats.mana) p.stats.mana = 0;
            if (p.stats.mana < manaCost) {
                if (parent.UI && parent.UI._showToast) parent.UI._showToast('Не хватает маны! Нужно ' + manaCost);
                return;
            }
            p.stats.mana -= manaCost;
            updateHeroSpheres();

            var dmg = 0, heal = 0;
            switch (skillId) {
                case 'poisoning':
                    activeEffects.push({ type: 'poison', dmg: 20 * lvl, ticks: 3, endsAt: Date.now() + 3000 });
                    break;
                case 'vampirism':
                    dmg = 30 * lvl;
                    heal = Math.floor(dmg * 0.5);
                    p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal);
                    updateHeroSpheres();
                    break;
                case 'stunning':
                    if (Math.random() < 0.2 * lvl) activeEffects.push({ type: 'stun', endsAt: Date.now() + 3000 });
                    break;
                case 'ricochet':
                    activeEffects.push({ type: 'ricochet', endsAt: Date.now() + 3000, bonus: 0.3 * lvl });
                    break;
                case 'riot':
                    if (p.stats.hp / p.stats.maxHp < 0.5) activeEffects.push({ type: 'riot', endsAt: Date.now() + 6000, bonus: 0.25 * lvl });
                    break;
                case 'force_of_elements':
                    dmg = 20 * lvl;
                    break;
                case 'evil_eye':
                    activeEffects.push({ type: 'evil_eye', endsAt: Date.now() + 5000, debuff: 0.15 * lvl });
                    break;
                case 'healing':
                    heal = 50 * lvl;
                    p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal);
                    updateHeroSpheres();
                    break;
                case 'healer':
                    activeEffects.push({ type: 'regen', amount: 5 * lvl, ticks: 5, endsAt: Date.now() + 5000 });
                    break;
                case 'funnel':
                    activeEffects.push({ type: 'funnel', endsAt: Date.now() + 4000, debuff: 0.3 * lvl });
                    break;
                case 'inspiration':
                    activeEffects.push({ type: 'inspiration', endsAt: Date.now() + 5000, bonus: 0.2 * lvl });
                    break;
                case 'knot':
                    activeEffects.push({ type: 'knot', endsAt: Date.now() + 3000 * lvl });
                    break;
            }

            // Урон по врагу через родительский portalAttack
            if (dmg > 0) {
                // временно бустим атаку, чтобы урон прошёл больший — не обязательно, но так честнее
                var r = parent.Sherwood.Portal.portalAttack();
                if (r) {
                    if (r.enemyHp !== undefined) updateMobHpBarFill(r.enemyHp, r.enemyMaxHp);
                    if (r.enemyDead) {
                        // Смерть врага — обрабатывается в attackEnemy через следующий вызов, но здесь
                        // тоже надо переключить на следующего
                        isBattleActive = false;
                        setTimeout(function() {
                            var next = parent.Sherwood.Portal.getCurrentBattle();
                            if (!next) { onPortalComplete(r); return; }
                            battleData = next;
                            var e2 = next.enemy;
                            document.getElementById('wave-label').textContent =
                                next.portal.name + ' — Волна ' + next.level + '/' + next.totalLevels;
                            createEnemySprite(e2.image || 'plague_crow.png', !!e2.isBoss);
                            updateMobHpBarFill(e2.hp, e2.maxHp);
                            isBattleActive = true;
                        }, 700);
                    }
                }
            }

            // Кулдаун
            var cdMap = {
                'poisoning': 5000, 'vampirism': 5000, 'stunning': 8000, 'ricochet': 10000,
                'riot': 6000, 'evil_eye': 7000, 'healing': 10000, 'healer': 12000,
                'funnel': 8000, 'inspiration': 15000, 'knot': 10000
            };
            var cd = cdMap[skillId] || 5000;
            skillCooldowns[skillId] = Date.now() + cd;
            var icon = document.querySelector('img[data-skill-id="' + skillId + '"]');
            if (icon) {
                icon.classList.add('on-cooldown');
                setTimeout(function() { icon.classList.remove('on-cooldown'); }, cd);
            }
        }

        // ============================================================
        //  ЭФФЕКТЫ
        // ============================================================
        function knockbackEnemy() {
            if (!enemySprite) return;
            enemyKnockback.active = true;
            enemyKnockback.t = 0;
            enemyKnockback.ox = enemySprite.position.x;
            enemyKnockback.oz = enemySprite.position.z;
            enemyKnockback.dx = 0;
            enemyKnockback.dz = 0.35;
        }

        function showHitEffect() {
            var hitEffect = document.getElementById('hit-effect');
            var hitEffectImg = document.getElementById('hit-effect-img');
            if (!hitEffect || !hitEffectImg || !enemySprite) return;
            hitEffectImg.src = 'assets/assets2/animation/' +
                hitSprites[Math.floor(Math.random() * hitSprites.length)];
            var worldPos = enemySprite.position.clone();
            worldPos.project(camera);
            var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
            var side = Math.random() < 0.5 ? -1 : 1;
            hitEffect.style.left = (x + side * 120) + 'px';
            hitEffect.style.top  = (y + (Math.random() - 0.5) * 60) + 'px';
            hitEffect.style.display = 'block';
            setTimeout(function() { hitEffect.style.display = 'none'; }, 200);
        }

        // ============================================================
        //  HP-БАР ВРАГА
        // ============================================================
        function updateMobHpBarFill(hp, maxHp) {
            if (!maxHp) maxHp = 1;
            var pct = Math.max(0, Math.min(1, hp / maxHp));
            var fill = document.getElementById('mob-hp-fill-img');
            if (fill) fill.style.clipPath = 'inset(0 ' + ((1 - pct) * 100) + '% 0 0)';
            var txt = document.getElementById('mob-hp-text');
            if (txt) txt.textContent = 'HP: ' + Math.max(0, hp) + '/' + maxHp;
        }

        function updateMobHpBarPosition() {
            if (!battleData || !enemySprite) return;
            var worldPos = enemySprite.position.clone();
            worldPos.y += 0.85;
            worldPos.project(camera);
            var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
            var el = document.getElementById('mob-hp');
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        }

        // ============================================================
        //  HP/MP ИГРОКА
        // ============================================================
        function updateHeroSpheres() {
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            var hpPct = Math.max(0, Math.min(1, p.stats.hp / p.stats.maxHp));
            var lifeFill = document.getElementById('life-fill');
            if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPct) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text');
            if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);

            var mana = p.stats.mana || 0;
            var maxMana = p.stats.maxMana || 100;
            var mpPct = Math.max(0, Math.min(1, mana / maxMana));
            var manaFill = document.getElementById('mana-fill');
            if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - mpPct) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text');
            if (manaText) manaText.textContent = 'MP: ' + Math.floor(mana);
        }
        setTimeout(updateHeroSpheres, 400);
        setInterval(updateHeroSpheres, 800);

        // ============================================================
        //  ЭФФЕКТЫ СКИЛЛОВ — тик
        // ============================================================
        setInterval(function() {
            if (!isBattleActive || !battleData) return;
            var now = Date.now();
            var p = parent.Sherwood && parent.Sherwood.getPlayer && parent.Sherwood.getPlayer();
            for (var i = activeEffects.length - 1; i >= 0; i--) {
                var ef = activeEffects[i];
                if (ef.endsAt < now) { activeEffects.splice(i, 1); continue; }
                if (ef.type === 'poison' && ef.ticks > 0) {
                    if (!ef._lastTick || now - ef._lastTick >= 1000) {
                        ef._lastTick = now;
                        ef.ticks--;
                        // нанести урон
                        if (battleData && battleData.enemy) {
                            battleData.enemy.hp = Math.max(0, battleData.enemy.hp - ef.dmg);
                            updateMobHpBarFill(battleData.enemy.hp, battleData.enemy.maxHp);
                        }
                    }
                }
                if (ef.type === 'regen' && ef.ticks > 0 && p) {
                    if (!ef._lastTick || now - ef._lastTick >= 1000) {
                        ef._lastTick = now;
                        ef.ticks--;
                        p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + ef.amount);
                        updateHeroSpheres();
                    }
                }
            }
        }, 250);

        // ============================================================
        //  ПОБЕДА / ПОРАЖЕНИЕ
        // ============================================================
        function onPortalComplete(r) {
            isBattleActive = false;
            playSound(soundVictory);
            try { portalMusic.pause(); } catch(e){}

            var rewards = {
                exp: r.rewards.exp,
                gold: r.rewards.gold,
                silver: r.rewards.silver,
                items: []
            };
            if (r.trophy) {
                rewards.items.push({
                    icon: r.trophyIcon || 'assets/all_trophies/portal_trophies/1_wolf_fang.png',
                    name: r.trophy, quantity: 1
                });
            }

            try {
                if (parent.UI && parent.UI._showVictoryScreen) {
                    parent.UI._lastPortal = portalId;
                    parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function() {
                        try { parent.Sherwood.Portal.showUI(); } catch(e) { exitPortal(); }
                    };
                    parent.UI._showVictoryScreen(rewards);
                } else {
                    exitPortal();
                }
            } catch(e) { exitPortal(); }
        }

        function onPortalFailed(r) {
            isBattleActive = false;
            playSound(soundDefeat);
            try { portalMusic.pause(); } catch(e){}

            try {
                if (parent.UI && parent.UI._showDefeatScreen) {
                    parent.UI._lastPortal = portalId;
                    parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function() {
                        try { parent.Sherwood.Portal.showUI(); } catch(e) { exitPortal(); }
                    };
                    parent.UI._showDefeatScreen({ exp: 10, silver: 50, gold: 0, items: [] });
                } else {
                    exitPortal();
                }
            } catch(e) { exitPortal(); }
        }

        function onPlayerDeath(r) {
            updateHeroSpheres();
            var w = document.getElementById('wave-label');
            if (w) {
                w.textContent = 'Вы воскресли! (-' + r.cost.cost + ' ' + (r.cost.currency === 'gold' ? 'золота' : 'серебра') + ')';
                setTimeout(function() {
                    if (battleData) {
                        w.textContent = battleData.portal.name + ' — Волна ' +
                            battleData.level + '/' + battleData.totalLevels;
                    }
                }, 2000);
            }
        }

        function exitPortal() {
            try {
                if (parent.Sherwood.Portal) {
                    if (parent.Sherwood.Portal.isInPortal()) parent.Sherwood.Portal.fleePortal();
                }
            } catch(e){}
            try {
                if (parent.UI) {
                    parent.UI._lastPortal = portalId;
                    parent.UI._lastDungeon = null;
                }
            } catch(e){}
            try {
                if (parent.Sherwood && parent.Sherwood.Portal && parent.Sherwood.Portal.showUI) {
                    parent.Sherwood.Portal.showUI();
                } else if (parent.UI && parent.UI.dungeon) {
                    parent.UI.dungeon();
                }
            } catch(e){}
        }
        window.exitPortal = exitPortal;

        // ============================================================
        //  КНОПКИ
        // ============================================================
        document.getElementById('attack-icon').addEventListener('click', function(e) {
            e.stopPropagation();
            attackEnemy();
        });
        document.getElementById('attack-icon').addEventListener('touchstart', function(e) {
            e.preventDefault(); e.stopPropagation();
            attackEnemy();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key.toLowerCase() === 'enter') {
                e.preventDefault();
                attackEnemy();
            }
        });

        // ============================================================
        //  СКИЛЛЫ — рендер иконок с onclick
        // ============================================================
        function renderTalents() {
            var leftCol = document.getElementById('skills-left');
            var rightCol = document.getElementById('skills-right');
            if (!leftCol || !rightCol) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;

            var talentData = {
                'poisoning': { icon: 'assets/assets2/talents/poisoning.png', side: 'left', name: 'Отравление' },
                'vampirism': { icon: 'assets/assets2/talents/vampirism.png', side: 'left', name: 'Вампиризм' },
                'stunning': { icon: 'assets/assets2/talents/stunning.png', side: 'left', name: 'Оглушение' },
                'ricochet': { icon: 'assets/assets2/talents/Ricochet.png', side: 'left', name: 'Рикошет' },
                'riot': { icon: 'assets/assets2/talents/Riot.png', side: 'left', name: 'Бунт' },
                'evil_eye': { icon: 'assets/assets2/talents/evil_eye.png', side: 'left', name: 'Злой глаз' },
                'healing': { icon: 'assets/assets2/talents/healing.png', side: 'right', name: 'Исцеление' },
                'healer': { icon: 'assets/assets2/talents/Healer.png', side: 'right', name: 'Хилер' },
                'funnel': { icon: 'assets/assets2/talents/funnel.png', side: 'right', name: 'Воронка' },
                'inspiration': { icon: 'assets/assets2/talents/inspiration.png', side: 'right', name: 'Вдохновение' },
                'knot': { icon: 'assets/assets2/talents/knot.png', side: 'right', name: 'Узел' }
            };

            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            for (var id in p.talents) {
                var lvl = p.talents[id];
                if (lvl > 0 && talentData[id]) {
                    var img = document.createElement('img');
                    img.src = talentData[id].icon;
                    img.title = talentData[id].name + ' (Ур. ' + lvl + ')';
                    img.dataset.skillId = id;
                    img.style.cursor = 'pointer';
                    img.onclick = (function(sid) {
                        return function() { useSkill(sid); };
                    })(id);
                    img.addEventListener('touchstart', (function(sid) {
                        return function(e) {
                            e.preventDefault(); e.stopPropagation();
                            useSkill(sid);
                        };
                    })(id));
                    (talentData[id].side === 'left' ? leftCol : rightCol).appendChild(img);
                }
            }
        }
        setTimeout(renderTalents, 500);

        // ============================================================
        //  ЦИКЛ
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            var dt = Math.min(clock.getDelta(), 0.05);

            if (enemyKnockback.active && enemySprite) {
                enemyKnockback.t += dt;
                var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1);
                var ease = Math.sin(kk * Math.PI);
                enemySprite.position.x = enemyKnockback.ox + enemyKnockback.dx * ease;
                enemySprite.position.z = enemyKnockback.oz + enemyKnockback.dz * ease;
                enemySprite.material.rotation = Math.sin(kk * Math.PI * 4) * 0.06;
                if (kk >= 1) {
                    enemySprite.position.x = enemyKnockback.ox;
                    enemySprite.position.z = enemyKnockback.oz;
                    enemySprite.material.rotation = 0;
                    enemyKnockback.active = false;
                }
            }

            if (cameraShake > 0.001) {
                camera.position.x = (Math.random() - 0.5) * cameraShake;
                camera.position.y = 0.8 + (Math.random() - 0.5) * cameraShake;
                camera.position.z = 4.2 + (Math.random() - 0.5) * cameraShake;
                camera.lookAt(0, 0.7, 0);
                cameraShake *= 0.85;
            } else if (cameraShake !== 0) {
                camera.position.set(0, 0.8, 4.2);
                camera.lookAt(0, 0.7, 0);
                cameraShake = 0;
            }

            if (enemySprite && !enemyKnockback.active) {
                var t = clock.elapsedTime;
                enemySprite.position.y = enemyBaseY + Math.sin(t * 2.5) * 0.02;
            }

            updateMobHpBarPosition();
            renderer.render(scene, camera);
        }

        // ============================================================
        //  СТАРТ
        // ============================================================
        loadBattle();
        animate();

        addEventListener('resize', function() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
