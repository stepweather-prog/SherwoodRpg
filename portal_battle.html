<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Портал</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; background: #000; touch-action: none; cursor: pointer; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; left: 50%; top: 30%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 16px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }
        
        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }
        
        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #battle-controls { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 45; }
        #attack-icon { position: absolute; bottom: 100%; left: 50%; transform: translateX(calc(-50% - 20px)); margin-bottom: 70px; width: 85px; height: 85px; cursor: pointer; pointer-events: auto; padding: 0; border: none; background: none; flex-shrink: 0; display: none; }
        #attack-icon:active { transform: translateX(calc(-50% - 20px)) scale(0.9); }
        #attack-icon img { width: 85px; height: 85px; object-fit: contain; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; transition: all 0.2s; display: block; box-sizing: border-box; }
        #attack-cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 8px; display: none; align-items: center; justify-content: center; color: #ff5555; font-weight: bold; font-size: 20px; }
        
        #skills-row { display: none; flex-direction: row; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap; }
        .skill-btn { cursor: pointer; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; width: 85px; height: 85px; object-fit: contain; transition: all 0.2s; display: block; flex-shrink: 0; box-sizing: border-box; }
        .skill-btn.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        
        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }
        
        #wave-label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #c8a050; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000; z-index: 40; letter-spacing: 1px; text-align: center; }
        #arrow-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% - 70px)); color: #e0c080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b5a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
        #arrow-counter img { width: 22px; height: 22px; object-fit: contain; }

        @media (max-width: 900px) {
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #mob-hp-name { font-size: 13px !important; top: -12px !important; }
            #battle-controls { bottom: 100px; gap: 10px; }
            #attack-icon { width: 70px; height: 70px; margin-bottom: 50px; }
            #attack-icon img { width: 70px; height: 70px; }
            .skill-btn { width: 70px; height: 70px; }
            #skills-row { gap: 10px; }
            #arrow-counter { transform: translateX(calc(-50% - 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #arrow-counter img { width: 18px !important; height: 18px !important; }
        }
    </style>
</head>
<body>
    <div id="wave-label">Портал</div>
    <div id="arrow-counter"><img src="assets/interface/sherwood_hollow_arrow.png" alt=""><span id="arrow-count-text">25</span></div>

    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>

    <div id="blood-overlay"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>
    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">MP: 0</span>
    </div>

    <button onclick="exitPortal();" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(0,0,0,0.8);border:2px solid #6b5a3a;border-radius:4px;padding:8px 16px;color:#c8a050;font-size:16px;font-weight:bold;cursor:pointer;">← Выйти</button>

    <div id="battle-controls">
        <div id="attack-icon">
            <img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png">
            <div id="attack-cooldown-overlay">0.0s</div>
        </div>
        <div id="skills-row"></div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var portalId = parseInt(urlParams.get('portal') || '1');
        
        function getMobName(imgPath) { if (!imgPath) return 'Враг'; return imgPath.split('/').pop().replace('.png', ''); }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30);
        camera.position.set(0, 0.55, 3.6); camera.rotation.order = 'YXZ'; camera.lookAt(0, 0.45, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        var keyLight = new THREE.DirectionalLight(0xffe8c0, 1.0);
        keyLight.position.set(2, 4, 3); scene.add(keyLight);

        var soundHit = new Audio('assets/assets2/tune/hit.wav'); var soundVictory = new Audio('assets/assets2/tune/victory.wav'); var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var portalMusic = new Audio('assets/assets2/music/dungeon_2.ogg'); portalMusic.loop = true; portalMusic.volume = 0.35;
        function playSound(a) { try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {} }

        setTimeout(function () { try { portalMusic.play().catch(function () {}); } catch (e) {} }, 300);
        window.addEventListener('click', function () { try { portalMusic.play().catch(function () {}); } catch (e) {} });

        // --- ТОЛЬКО СТРЕЛЫ И КРОВЬ ИЗ МОДУЛЯ ---
        window.Sherwood = window.Sherwood || {};
        setTimeout(function() {
            if (window.Sherwood.BattleVisuals) {
                window.Sherwood.BattleVisuals.loadArrowsFromBag();
                window.Sherwood.BattleVisuals.renderLearnedTalents();
            }
        }, 700);

        var isBattleActive = false, currentEnemySprite = null, currentEnemyStats = null, currentEnemyObj = null;
        var battleTimer = null, playerHitFirst = false, playerAttackCooldown = 0, PLAYER_ATTACK_CD = 1.0;

        function updateHeroSpheres() {
            var p = parent.Sherwood.getPlayer(); if (!p || !p.stats) return;
            var hpPercent = p.stats.hp / p.stats.maxHp; var lifeFill = document.getElementById('life-fill'); if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPercent) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text'); if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);
            var mana = p.stats.mana || 0; var maxMana = p.stats.maxMana || 100; var mpPercent = mana / maxMana;
            var manaFill = document.getElementById('mana-fill'); if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - mpPercent) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text'); if (manaText) manaText.textContent = 'MP: ' + Math.floor(mana);
        }
        setTimeout(updateHeroSpheres, 500);
        setInterval(updateHeroSpheres, 800);

        function createEnemySprite(enemyData, callback) {
            if (currentEnemySprite) { scene.remove(currentEnemySprite); currentEnemySprite = null; }
            var loader = new THREE.TextureLoader();
            loader.load(
                enemyData.imagePath,
                function(tex) {
                    tex.minFilter = tex.magFilter = THREE.LinearFilter;
                    currentEnemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
                    var scale = enemyData.isBoss ? 2.3 : 2.0;
                    currentEnemySprite.scale.set(scale, scale, 1);
                    currentEnemySprite.center.set(0.5, 0);
                    currentEnemySprite.position.set(0, -0.4, 0);
                    currentEnemySprite.material.depthTest = false;
                    currentEnemySprite.material.depthWrite = false;
                    currentEnemySprite.renderOrder = 10;
                    scene.add(currentEnemySprite);
                    if (callback) callback();
                },
                undefined,
                function() {
                    console.warn('Не нашёл текстуру: ' + enemyData.imagePath);
                    var fallbackTex = new THREE.TextureLoader().load('assets/interface/labyrinth_of_icons.png');
                    currentEnemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: fallbackTex, transparent: true }));
                    var scale = enemyData.isBoss ? 2.3 : 2.0;
                    currentEnemySprite.scale.set(scale, scale, 1);
                    currentEnemySprite.center.set(0.5, 0);
                    currentEnemySprite.position.set(0, -0.4, 0);
                    scene.add(currentEnemySprite);
                    if (callback) callback();
                }
            );
        }

        function startBattle(obj) {
            if (isBattleActive) return; isBattleActive = true; playerHitFirst = false; currentEnemyObj = obj;
            currentEnemyStats = { hp: obj.hp, maxHp: obj.maxHp, atk: obj.atk, def: obj.def };
            
            document.getElementById('mob-hp').style.display = 'block';
            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            var nameEl = document.getElementById('mob-hp-name'); if (nameEl) nameEl.textContent = getMobName(obj.img);
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 0 0 0)'; playSound(soundHit);
            document.getElementById('battle-controls').style.display = 'flex';
            document.getElementById('attack-icon').style.display = 'block';
            document.getElementById('skills-row').style.display = 'flex';

            if (battleTimer) clearInterval(battleTimer);
            battleTimer = setInterval(function() {
                if (!isBattleActive || !playerHitFirst) return; var p = parent.Sherwood.getPlayer(); if (!p) return;
                var edmg = Math.max(5, Math.floor(currentEnemyStats.atk * 0.5));
                p.stats.hp = Math.max(0, p.stats.hp - edmg); updateHeroSpheres(); showBloodOverlay();
                if (p.stats.hp <= 0) { stopBattle(); onDefeat(); }
            }, 1000);
        }

        function stopBattle() {
            isBattleActive = false; playerHitFirst = false;
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            document.getElementById('mob-hp').style.display = 'none';
        }

        function onEnemyKilled() {
            if (!isBattleActive) return; isBattleActive = false; playerHitFirst = false;
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; } document.getElementById('mob-hp').style.display = 'none';
            playSound(soundVictory);
            
            if (currentEnemySprite) { scene.remove(currentEnemySprite); currentEnemySprite = null; }
            
            if (parent.Sherwood.Portal) {
                var r = parent.Sherwood.Portal.portalAttack();
                if (r) {
                    if (r.portalComplete) { onPortalComplete(r); return; }
                    if (r.portalFailed)   { onPortalFailed(r);   return; }
                    if (r.dead && r.resurrected) { onPlayerDeath(r); return; }
                    if (r.enemyDead) {
                        setTimeout(function() {
                            var next = parent.Sherwood.Portal.getCurrentBattle();
                            if (!next) { onPortalComplete(r); return; }
                            loadNextEnemy(next);
                        }, 700);
                    }
                }
            }
        }

        function loadNextEnemy(battleData) {
            if (!battleData || !battleData.enemy) return;
            var e = battleData.enemy;
            document.getElementById('wave-label').textContent = battleData.portal.name + ' — Волна ' + battleData.level + '/' + battleData.totalLevels;
            
            var enemyData = {
                imagePath: e.imagePath || ('assets/portal_beasts/visual_portals/' + e.image),
                isBoss: !!e.isBoss,
                hp: e.hp, maxHp: e.hp, atk: e.attack || e.atk || 50, def: e.defense || e.def || 10
            };
            
            createEnemySprite(enemyData, function() {
                startBattle({ hp: enemyData.hp, maxHp: enemyData.maxHp, atk: enemyData.atk, def: enemyData.def, mesh: currentEnemySprite, img: enemyData.imagePath });
            });
        }

        function attackEnemy() {
            if (!isBattleActive || !currentEnemyStats || !parent.Sherwood || !parent.Sherwood.getPlayer) return;
            if (playerAttackCooldown > 0) return; playerAttackCooldown = PLAYER_ATTACK_CD; playerHitFirst = true;
            var p = parent.Sherwood.getPlayer(); playSound(soundHit);
            
            var arrowsNeeded = 3; var hasArrows = (playerArrows >= arrowsNeeded);
            if (hasArrows) { useArrow(arrowsNeeded); } else { if (playerArrows > 0) useArrow(playerArrows); showCenterText('НЕТ СТРЕЛ! -50% урона', '#ff5555'); }
            
            var baseDmg = Math.max(50, Math.floor(p.stats.attack * 1.5) - Math.floor(currentEnemyStats.def * 0.5) + Math.floor(Math.random() * 20));
            if (!hasArrows) baseDmg = Math.floor(baseDmg * 0.5);

            currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - baseDmg); if (currentEnemyObj) currentEnemyObj.hp = currentEnemyStats.hp;
            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
            
            // ВИЗУАЛЬНЫЙ УДАР
            if (currentEnemySprite) {
                // Создаём временный спрайт крови прямо в сцене портала
                var bloodTex = new THREE.TextureLoader().load('assets/assets2/animation/blood_1.png');
                var bloodSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: bloodTex, transparent: true, depthTest: false }));
                bloodSpr.scale.set(0.4, 0.4, 1);
                bloodSpr.position.copy(currentEnemySprite.position);
                bloodSpr.position.y += currentEnemySprite.scale.y * 0.5;
                scene.add(bloodSpr);
                setTimeout(function() { scene.remove(bloodSpr); }, 150);
                
                // Тряска камеры
                camera.position.x = (Math.random() - 0.5) * 0.06;
                camera.position.y = 0.55 + (Math.random() - 0.5) * 0.06;
                setTimeout(function() { camera.position.set(0, 0.55, 3.6); }, 100);
            }

            if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
            var edmg = Math.max(5, Math.floor(currentEnemyStats.atk * 0.5));
            p.stats.hp = Math.max(0, p.stats.hp - edmg); updateHeroSpheres(); showBloodOverlay();
            if (p.stats.hp <= 0) { playSound(soundDefeat); stopBattle(); onDefeat(); }
        }

        function updateMobHpBar() {
            if (!isBattleActive || !currentEnemySprite) return;
            var worldPos = currentEnemySprite.position.clone();
            worldPos.y += (currentEnemySprite.scale.y * 0.5) + 0.1; worldPos.project(camera);
            var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth; var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
            var el = document.getElementById('mob-hp'); el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = 'translate(-50%, -140%)';
        }

        function showBloodOverlay() { var el = document.getElementById('blood-overlay'); if (!el) return; var texs = ['assets/assets2/animation/Fine_blood_spray_texture.png', 'assets/assets2/animation/Fine_blood_spray_texture (1).png', 'assets/assets2/animation/Fine_blood_spray_texture (2).png']; el.style.backgroundImage = 'url("' + texs[Math.floor(Math.random() * texs.length)] + '")'; el.style.opacity = '1'; setTimeout(function() { el.style.opacity = '0'; }, 200); }
        function showCenterText(text, color) { var el = document.createElement('div'); el.textContent = text; el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);opacity:0;color:' + (color || '#fff') + ';font-size:36px;font-weight:bold;text-shadow:0 0 12px #000, 0 4px 8px #000;pointer-events:none;z-index:200;transition:all 0.9s cubic-bezier(.2,.7,.3,1);font-family:"Times New Roman",serif;'; document.body.appendChild(el); requestAnimationFrame(function() { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(1.1)'; }); setTimeout(function() { el.style.opacity = '0'; el.style.transform = 'translate(-50%,-120%) scale(0.9)'; }, 900); setTimeout(function() { el.remove(); }, 1900); }

        function exitPortal() {
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            try { portalMusic.pause(); portalMusic.currentTime = 0; } catch(e) {}
            try { if (parent.UI) { parent.UI.camp(); } } catch(e) {}
        }
        window.exitPortal = exitPortal;

        function onDefeat() {
            playSound(soundDefeat);
            try { portalMusic.pause(); } catch(e){}
            var h = '<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff5555;font-family:Georgia,serif;">';
            h += '<div style="font-size:2em;font-weight:bold;margin-bottom:20px;">ПОРАЖЕНИЕ</div>';
            h += '<button onclick="parent.UI.camp()" style="background:#c9a040;border:none;border-radius:8px;padding:10px 30px;color:#000;font-weight:bold;cursor:pointer;font-size:1.2em;">В лагерь</button></div>';
            var el = document.createElement('div'); el.innerHTML = h; document.body.appendChild(el);
        }

        function onPortalComplete(r) {
            playSound(soundVictory);
            try { portalMusic.pause(); } catch(e){}
            var rewards = { exp: r.rewards.exp, gold: r.rewards.gold, silver: r.rewards.silver, items: [] };
            if (r.trophy) rewards.items.push({ icon: r.trophyIcon || 'assets/all_trophies/portal_trophies/1_wolf_fang.png', name: r.trophy, quantity: 1 });
            try {
                if (parent.UI && parent.UI._showVictoryScreen) {
                    parent.UI._lastPortal = portalId;
                    parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function () { try { parent.Sherwood.Portal.showUI(); } catch (e) { exitPortal(); } };
                    parent.UI._showVictoryScreen(rewards);
                } else { exitPortal(); }
            } catch (e) { exitPortal(); }
        }

        function onPortalFailed(r) {
            playSound(soundDefeat);
            try { portalMusic.pause(); } catch(e){}
            try {
                if (parent.UI && parent.UI._showDefeatScreen) {
                    parent.UI._lastPortal = portalId;
                    parent.UI._lastDungeon = null;
                    parent.UI._afterRewardAction = function () { try { parent.Sherwood.Portal.showUI(); } catch (e) { exitPortal(); } };
                    parent.UI._showDefeatScreen({ exp: 10, silver: 50, gold: 0, items: [] });
                } else { exitPortal(); }
            } catch (e) { exitPortal(); }
        }

        function onPlayerDeath(r) {
            var w = document.getElementById('wave-label');
            if (w) {
                w.textContent = 'Вы воскресли! (-' + r.cost.cost + ' ' + (r.cost.currency === 'gold' ? 'золота' : 'серебра') + ')';
                setTimeout(function() {
                    var next = parent.Sherwood.Portal.getCurrentBattle();
                    if (next) { w.textContent = next.portal.name + ' — Волна ' + next.level + '/' + next.totalLevels; }
                }, 2000);
            }
        }

        document.getElementById('attack-icon').addEventListener('click', (e) => { e.stopPropagation(); attackEnemy(); });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (playerAttackCooldown > 0) playerAttackCooldown = Math.max(0, playerAttackCooldown - dt);
            if (isBattleActive) updateMobHpBar();

            // Тряска камеры
            if (cameraShake > 0.001) {
                camera.position.x = (Math.random() - 0.5) * cameraShake;
                camera.position.y = 0.55 + (Math.random() - 0.5) * cameraShake;
                camera.position.z = 3.6 + (Math.random() - 0.5) * cameraShake;
                camera.lookAt(0, 0.45, 0);
                cameraShake *= 0.85;
            } else if (cameraShake !== 0) {
                camera.position.set(0, 0.55, 3.6);
                camera.lookAt(0, 0.45, 0);
                cameraShake = 0;
            }

            if (currentEnemySprite && !isBattleActive) {
                currentEnemySprite.position.y = -0.4 + Math.sin(clock.elapsedTime * 2.5) * 0.02;
            }

            renderer.render(scene, camera);
        }

        var bData = parent.Sherwood.Portal.getCurrentBattle();
        if (bData) {
            var e = bData.enemy;
            document.getElementById('wave-label').textContent = bData.portal.name + ' — Волна ' + bData.level + '/' + bData.totalLevels;
            var enemyData = {
                imagePath: e.imagePath || ('assets/portal_beasts/visual_portals/' + e.image),
                isBoss: !!e.isBoss,
                hp: e.hp, maxHp: e.hp, atk: e.attack || e.atk || 50, def: e.defense || e.def || 10
            };
            createEnemySprite(enemyData, function() {
                startBattle({ hp: enemyData.hp, maxHp: enemyData.maxHp, atk: enemyData.atk, def: enemyData.def, mesh: currentEnemySprite, img: enemyData.imagePath });
            });
        }

        animate();
    </script>
</body>
</html>
