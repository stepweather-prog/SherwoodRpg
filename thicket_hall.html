<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шервудская чащоба</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; background: #000; touch-action: none; cursor: crosshair; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #c8a050; font-size: 22px; pointer-events: none; z-index: 20; text-shadow: 0 0 12px #8b6b3a; opacity: 0.8; display: none; }
        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 16px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }
        
        #hero-life { position: absolute; bottom: 10px; left: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }
        
        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }
        
        #attack-icon { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); width: 65px; height: 65px; z-index: 40; cursor: pointer; display: none; background: rgba(0,0,0,0.6); border-radius: 50%; border: 2px solid #c8a050; padding: 5px; box-shadow: 0 0 15px rgba(200, 160, 80, 0.5); transition: transform 0.1s; }
        #attack-icon:active { transform: translateX(-50%) scale(0.9); }
        #attack-icon img { width: 100%; height: 100%; object-fit: contain; }
        #attack-cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 50%; display: none; align-items: center; justify-content: center; color: #ff5555; font-weight: bold; font-size: 20px; }
        
        #skills-left, #skills-right { pointer-events: auto; position: absolute; bottom: 110px; width: 80px; display: none; flex-direction: column; align-items: center; gap: 6px; z-index: 45; }
        #skills-left { left: 10px; }
        #skills-right { right: 10px; }
        #skills-left img, #skills-right img { cursor: pointer; border-radius: 6px; border: 2px solid rgba(200, 160, 80, 0.7); background: rgba(0, 0, 0, 0.5); padding: 2px; width: 44px; height: 44px; object-fit: contain; }
        #skills-left img.on-cooldown, #skills-right img.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }
        
        #joystick { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; z-index: 55; pointer-events: none; display: none; }
        .arrow-btn { position: absolute; width: 50px; height: 50px; background: rgba(10, 8, 5, 0.85); border: 2px solid #6b5a3a; border-radius: 50%; color: #c8a050; font-size: 20px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px #8b6b3a; box-shadow: 0 0 6px rgba(139, 107, 58, 0.3); }
        .arrow-btn:active { background: rgba(139, 107, 58, 0.6); transform: scale(0.9); }
        #btn-left  { top: 35px; left: 0; }
        #btn-right { top: 35px; left: 70px; }
        
        @media (max-width: 900px) {
            #joystick { display: block; }
            #attack-icon { bottom: 80px; width: 55px; height: 55px; }
            #hero-life, #hero-mana { width: 90px; height: 90px; bottom: 6px; }
            #hero-life { left: 6px; }
            #hero-mana { right: 6px; }
            #hero-life span, #hero-mana span { font-size: 13px; }
            #mob-hp { width: 220px; height: 150px; }
            #mob-hp-text { font-size: 15px; }
            #mob-hp-name { font-size: 13px; top: -12px; }
            #skills-left, #skills-right { bottom: 100px; width: 60px; }
            #skills-left img, #skills-right img { width: 34px; height: 34px; }
            #hit-effect-img { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>
    <div id="crosshair">✚</div>
    <div id="blood-overlay"></div>
    
    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>
    
    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>
    <div id="skills-left"></div>
    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>
    <div id="skills-right"></div>
    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">Скверна: 0%</span>
    </div>
    
    <div id="attack-icon">
        <img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png">
        <div id="attack-cooldown-overlay">0.0s</div>
    </div>
    
    <div id="joystick">
        <div class="arrow-btn" id="btn-left">◀</div>
        <div class="arrow-btn" id="btn-right">▶</div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>
    <button onclick="exitThicket();" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(0,0,0,0.8);border:2px solid #6b5a3a;border-radius:4px;padding:8px 16px;color:#c8a050;font-size:16px;font-weight:bold;cursor:pointer;">←</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var nodeId = parseInt(urlParams.get('node') || '1');
        var diff = parseInt(urlParams.get('diff') || '1');
        var enemyData = null;
        try { enemyData = parent.Sherwood.Thicket.getCurrentEnemy(); } catch(e) {}

        var MOB_NAMES = {
            'plague_crow.png': 'Чумной Ворон', 'bone_vulture.png': 'Костяной Стервятник',
            'executioner_crow.png': 'Ворон-Палач', 'plague_pixie.png': 'Чумная Пикси',
            'putrid_sprite.png': 'Гнилостный Спрайт', 'forest_strangler.png': 'Лесной Душегуб'
        };
        function getMobName(p) { if (!p) return 'Враг'; var f = p.split('/').pop(); return MOB_NAMES[f] || 'Враг'; }

        // СКВЕРНА
        var FILTH_HIT_AMOUNT = 5;
        function getFilth() { 
            var p = parent.Sherwood.getPlayer(); 
            if (!p) return { cur: 0, max: 100 }; 
            if (typeof p.stats.filth === 'undefined') p.stats.filth = 0; 
            if (typeof p.stats.maxFilth === 'undefined') p.stats.maxFilth = 100; 
            return { cur: p.stats.filth, max: p.stats.maxFilth }; 
        }
        function setFilth(v) { 
            var p = parent.Sherwood.getPlayer(); 
            if (!p) return; 
            if (!p.stats.maxFilth) p.stats.maxFilth = 100; 
            p.stats.filth = Math.max(0, Math.min(p.stats.maxFilth, v)); 
            updateHeroSpheres(); 
        }
        function addFilth(a) { var f = getFilth(); setFilth(f.cur + a); }
        function spendFilth(a) { var f = getFilth(); if (f.cur < a) return false; setFilth(f.cur - a); return true; }

        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundChest = new Audio('assets/assets2/tune/chest_open.wav');
        var soundSteps = new Audio('assets/assets2/tune/steps.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var thicketMusic = new Audio('assets/assets2/music/dungeon_3.ogg');
        thicketMusic.loop = true; thicketMusic.volume = 0.4;

        function playSound(a) { try { a.currentTime = 0; a.play().catch(function(){}); } catch(e) {} }
        var stepsPlaying = false;
        function startSteps() { if (stepsPlaying) return; stepsPlaying = true; try { soundSteps.currentTime = 0; soundSteps.play().catch(function(){}); } catch(e){} }
        function stopSteps() { stepsPlaying = false; try { soundSteps.pause(); soundSteps.currentTime = 0; } catch(e){} }

        function stopAllParentMusic() {
            try {
                if (parent) {
                    if (parent.audioPlayer) { try { parent.audioPlayer.pause(); parent.audioPlayer.currentTime = 0; } catch(e){} }
                    if (typeof parent.stopMainMusic === 'function') { try { parent.stopMainMusic(); } catch(e){} }
                    if (parent.UI && parent.UI._currentMusic) { try { parent.UI._currentMusic.pause(); parent.UI._currentMusic.currentTime = 0; } catch(e){} }
                }
            } catch(e){}
        }
        setTimeout(function(){ stopAllParentMusic(); thicketMusic.play().catch(function(){}); }, 300);

        function exitThicket() {
            stopSteps();
            try { thicketMusic.pause(); thicketMusic.currentTime = 0; } catch(e){}
            try { parent.Sherwood.Thicket._flee(); } catch(e) {}
        }
        window.exitThicket = exitThicket;

        function showCenterText(text, color) {
            var el = document.createElement('div');
            var fs = window.innerWidth <= 600 ? '22px' : '36px';
            el.textContent = text;
            el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);opacity:0;color:' + (color || '#fff') + ';font-size:' + fs + ';font-weight:bold;text-shadow:0 0 12px #000, 0 4px 8px #000;pointer-events:none;z-index:200;transition:all 0.9s cubic-bezier(.2,.7,.3,1);font-family:"Times New Roman",serif;letter-spacing:2px;';
            document.body.appendChild(el);
            requestAnimationFrame(function() { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(1.1)'; });
            setTimeout(function() { el.style.opacity = '0'; el.style.transform = 'translate(-50%,-120%) scale(0.9)'; }, 900);
            setTimeout(function() { el.remove(); }, 1900);
        }

        var bloodOverlayTextures = [
            'assets/assets2/animation/Fine_blood_spray_texture.png',
            'assets/assets2/animation/Fine_blood_spray_texture (1).png',
            'assets/assets2/animation/Fine_blood_spray_texture (2).png'
        ];
        var boT1 = null, boT2 = null;
        function showBloodOverlay() {
            var el = document.getElementById('blood-overlay'); if (!el) return;
            var tex = bloodOverlayTextures[Math.floor(Math.random() * bloodOverlayTextures.length)];
            el.style.backgroundImage = 'url("' + tex + '")';
            el.style.transition = 'opacity 0.1s ease-out';
            el.style.opacity = '1';
            clearTimeout(boT1); clearTimeout(boT2);
            boT1 = setTimeout(function() { el.style.transition = 'opacity 0.2s ease-out'; el.style.opacity = '0'; }, 200);
            boT2 = setTimeout(function() { el.style.backgroundImage = ''; }, 200);
        }

        // Сцена (фон не виден, так как всё закрыто текстурами)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a1c10); 
        scene.fog = new THREE.Fog(0x1a1208, 15, 35);

        const camPlatformer = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camPlatformer.position.set(0, 3.0, 8);
        camPlatformer.lookAt(0, 1.0, 0);

        const camFPS = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 40);
        camFPS.rotation.order = 'YXZ';

        let activeCamera = camPlatformer;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffd0a0, 1.5);
        dirLight.position.set(5, 10, 5); scene.add(dirLight);
        const playerLight = new THREE.PointLight(0xffaa55, 2.0, 15);
        playerLight.position.set(0, 2, 2); scene.add(playerLight);

        // Текстуры
        const loader = new THREE.TextureLoader();
        const wallTexture  = loader.load('assets/assets2/Sherwood_Square/walls_quest.png');
        const floorTexture = loader.load('assets/assets2/Sherwood_Square/floors_quest.png');
        const ceilTexture  = loader.load('assets/dungeon_tiles/visual_dungeon/ceiling_dungeon_5.png'); 
        
        wallTexture.wrapS = wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(8, 2);
        floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(8, 2);
        ceilTexture.wrapS = ceilTexture.wrapT = THREE.RepeatWrapping;
        ceilTexture.repeat.set(8, 2);

        const wallMat  = new THREE.MeshLambertMaterial({ map: wallTexture });
        const floorMat = new THREE.MeshLambertMaterial({ map: floorTexture });
        const ceilMat  = new THREE.MeshLambertMaterial({ map: ceilTexture });

        // Коридор
        const platformerGroup = new THREE.Group();
        scene.add(platformerGroup);

        const LEVEL_W = 40; 
        const WALL_H = 6;   
        const CORRIDOR_DEPTH = 4; 

        const ground = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, 1, CORRIDOR_DEPTH), floorMat);
        ground.position.set(LEVEL_W / 2, -0.5, 0); 
        platformerGroup.add(ground);

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, WALL_H, 0.5), wallMat);
        backWall.position.set(LEVEL_W / 2, WALL_H / 2, -CORRIDOR_DEPTH / 2); 
        platformerGroup.add(backWall);

        const ceil = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, 0.5, CORRIDOR_DEPTH), ceilMat);
        ceil.position.set(LEVEL_W / 2, WALL_H, 0); 
        platformerGroup.add(ceil);

        const endWall1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, WALL_H, CORRIDOR_DEPTH), wallMat);
        endWall1.position.set(0, WALL_H / 2, 0);
        platformerGroup.add(endWall1);

        const endWall2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, WALL_H, CORRIDOR_DEPTH), wallMat);
        endWall2.position.set(LEVEL_W, WALL_H / 2, 0);
        platformerGroup.add(endWall2);

        // БОЕВАЯ КОМНАТА (ВИЗУАЛ КАК В ПОДЗЕМКЕ)
        const battleRoom = new THREE.Group();
        battleRoom.visible = false; scene.add(battleRoom);
        
        const bWallMat = new THREE.MeshStandardMaterial({ map: wallTexture, roughness: 0.85 });
        const bFloorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.95 });
        const bCeilMat = new THREE.MeshStandardMaterial({ map: ceilTexture, roughness: 0.95, side: THREE.DoubleSide });
        
        const bRoomLength = 15; 
        const bWallHeight = 3;
        const bCorridorWidth = 4;

        const bFloor = new THREE.Mesh(new THREE.PlaneGeometry(bCorridorWidth, bRoomLength), bFloorMat);
        bFloor.rotation.x = -Math.PI / 2;
        bFloor.position.set(0, 0, -bRoomLength / 2);
        battleRoom.add(bFloor);

        const bCeil = new THREE.Mesh(new THREE.PlaneGeometry(bCorridorWidth, bRoomLength), bCeilMat);
        bCeil.rotation.x = Math.PI / 2;
        bCeil.position.set(0, bWallHeight, -bRoomLength / 2);
        battleRoom.add(bCeil);

        const bWallL = new THREE.Mesh(new THREE.PlaneGeometry(bRoomLength, bWallHeight), bWallMat);
        bWallL.rotation.y = Math.PI / 2;
        bWallL.position.set(-bCorridorWidth / 2, bWallHeight / 2, -bRoomLength / 2);
        battleRoom.add(bWallL);

        const bWallR = new THREE.Mesh(new THREE.PlaneGeometry(bRoomLength, bWallHeight), bWallMat);
        bWallR.rotation.y = -Math.PI / 2;
        bWallR.position.set(bCorridorWidth / 2, bWallHeight / 2, -bRoomLength / 2);
        battleRoom.add(bWallR);

        const bBack = new THREE.Mesh(new THREE.PlaneGeometry(bCorridorWidth, bWallHeight), bWallMat);
        bBack.position.set(0, bWallHeight / 2, 0);
        battleRoom.add(bBack);

        // Игрок
        const player = {
            pos: new THREE.Vector3(2, 0, 0),
            vel: new THREE.Vector3(0, 0, 0),
            onGround: false,
            facing: 1,
            speed: 6.0,
            jumpPower: 10.0,
            gravity: 25.0,
            jumpPressed: false
        };

        const heroGroup = new THREE.Group();
        platformerGroup.add(heroGroup);

        const video = document.createElement('video');
        video.src = 'assets/assets2/animation/Untitled_Archer_Side_Scroller.webm';
        video.loop = true; video.muted = true; video.pause(); video.crossOrigin = 'anonymous';

        const hCanvas = document.createElement('canvas');
        hCanvas.width = 512; hCanvas.height = 512;
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });

        function chromaKeyHero(imgData) {
            var d = imgData.data;
            for (var i = 0; i < d.length; i += 4) {
                var r = d[i], g = d[i+1], b = d[i+2];
                if (g > 80 && g > r * 1.35 && g > b * 1.35) {
                    var greenness = (g - Math.max(r, b)) / g;
                    if (greenness > 0.25) { d[i+3] = 0; }
                    else { d[i+3] = Math.floor(255 * (1 - greenness / 0.25)); }
                }
            }
        }
        function processHeroFrame(flip) {
            if (video.readyState < 2) return;
            try {
                hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
                hCtx.save();
                if (flip) { hCtx.scale(-1, 1); hCtx.translate(-hCanvas.width, 0); }
                hCtx.drawImage(video, 0, 0, hCanvas.width, hCanvas.height);
                hCtx.restore();
                var imgData = hCtx.getImageData(0, 0, hCanvas.width, hCanvas.height);
                chromaKeyHero(imgData);
                hCtx.putImageData(imgData, 0, 0);
                heroTex.needsUpdate = true;
            } catch(e) {}
        }
        const heroTex = new THREE.CanvasTexture(hCanvas);
        heroTex.minFilter = heroTex.magFilter = THREE.LinearFilter;

        const heroSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: heroTex, transparent: true, depthTest: false }));
        heroSprite.center.set(0.5, 0); 
        heroSprite.scale.set(2.2, 2.2, 1); 
        heroSprite.position.set(0, 0, 1.0); 
        heroGroup.add(heroSprite);

        const heroTexStatic = loader.load('assets/assets2/game_details/ezgif-frame-006.png');
        const staticSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: heroTexStatic, transparent: true, depthTest: false }));
        staticSprite.center.set(0.5, 0); 
        staticSprite.scale.set(2.2, 2.2, 1); 
        staticSprite.position.set(0, 0, 1.0);
        heroGroup.add(staticSprite);
        video.addEventListener('play', () => { staticSprite.visible = false; });

        // Враг
        var enemyObj = null;
        var enemySprite = null;
        var enemyX = 25;
        var enemyAlive = true;

        function createEnemy() {
            var path = (enemyData && enemyData.imagePath) ? enemyData.imagePath : 'assets/all_beasts/plague_crow.png';
            var isBoss = (enemyData && enemyData.isBoss) ? true : false;
            var scale = isBoss ? 2.8 : 2.4;
            var mult = 1.0 + (diff - 1) * 0.2;
            var hp = (enemyData && enemyData.hp) ? enemyData.hp : (1000 + Math.floor(Math.random() * 500));
            var atk = (enemyData && enemyData.atk) ? enemyData.atk : (50 + Math.floor(Math.random() * 20));
            var def = (enemyData && enemyData.def) ? enemyData.def : (10 + Math.floor(Math.random() * 10));

            enemyObj = {
                x: enemyX, isBoss: isBoss, img: path,
                hp: Math.floor(hp * mult), maxHp: Math.floor(hp * mult),
                atk: Math.floor(atk * mult), def: Math.floor(def * mult),
                collected: false, mesh: null
            };

            loader.load(path, function(t) {
                t.minFilter = t.magFilter = THREE.LinearFilter;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: true }));
                enemySprite.center.set(0.5, 0); 
                enemySprite.scale.set(scale, scale, 1);
                enemySprite.position.set(enemyX, 0, 0.8); 
                platformerGroup.add(enemySprite);
                enemyObj.mesh = enemySprite;
            });
        }
        createEnemy();

        // Кровь
        var bloodSprites = ['assets/assets2/animation/blood_1.png','assets/assets2/animation/blood_2.png','assets/assets2/animation/blood_3.png','assets/assets2/animation/blood_4.png','assets/assets2/animation/blood_5.png'];
        var bloodTextures = bloodSprites.map(function(p){ return loader.load(p); });
        var hitFlashSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: bloodTextures[0], transparent: true, opacity: 0.85, depthTest: false, depthWrite: false }));
        hitFlashSprite.scale.set(1.0, 1.0, 1); hitFlashSprite.visible = false;
        battleRoom.add(hitFlashSprite);
        var hitSprites = ['strike_claws.png','strike_claws_1.png','strike_claws_2.png','strike_claws_4.png','strike_claws_5.png','strike_claws_6.png'];

        // Сундук и дверь
        var chestSprite = null;
        var exitDoor = null;
        var exitIsOpen = false;

        function spawnChestAndExit() {
            if (!chestSprite) {
                loader.load('assets/assets2/game_details/locked_chest_first_dungeon.png', function(t) {
                    chestSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
                    chestSprite.center.set(0.5, 0);
                    chestSprite.scale.set(2.0, 2.0, 1);
                    chestSprite.position.set(enemyX, 0, 0.8);
                    platformerGroup.add(chestSprite);
                });
            }
            if (!exitDoor) {
                loader.load('assets/assets2/game_details/completion_of_the_second_underground_level1.png', function(t) {
                    exitDoor = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true }));
                    exitDoor.center.set(0.5, 0);
                    exitDoor.scale.set(3, 4, 1);
                    exitDoor.position.set(LEVEL_W - 2, 0, 0.8);
                    platformerGroup.add(exitDoor);
                });
            }
        }

        // Ввод
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyJ'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        const touch = { left: false, right: false };
        function bindTouch(id, prop) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); touch[prop] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); touch[prop] = false; });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); touch[prop] = true; });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); touch[prop] = false; });
            el.addEventListener('mouseleave', () => { touch[prop] = false; });
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        // Логика игрока
        function updatePlayer(dt) {
            const p = player;
            let moveX = 0;
            if (keys['KeyA'] || keys['ArrowLeft'] || touch.left) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight'] || touch.right) moveX += 1;

            p.vel.x = moveX * p.speed;
            if (moveX !== 0) {
                p.facing = moveX;
                if (video.paused) video.play().catch(()=>{});
                if (!stepsPlaying) startSteps();
            } else {
                if (!video.paused) video.pause();
                if (stepsPlaying) stopSteps();
            }

            const jumpDown = keys['KeyW'] || keys['Space'] || keys['ArrowUp'];
            if (jumpDown && !p.jumpPressed && p.onGround) {
                p.vel.y = p.jumpPower;
                p.onGround = false;
            }
            p.jumpPressed = jumpDown;

            p.vel.y -= p.gravity * dt;
            if (p.vel.y < -25) p.vel.y = -25;

            const newX = p.pos.x + p.vel.x * dt;
            p.pos.x = Math.max(1.0, Math.min(LEVEL_W - 2, newX));

            const newY = p.pos.y + p.vel.y * dt;
            if (newY <= 0) { p.pos.y = 0; p.vel.y = 0; p.onGround = true; }
            else { p.pos.y = newY; p.onGround = false; }
        }

        // Состояние боя
        var isBattleActive = false;
        var battleTimer = null;
        var currentEnemyStats = null;
        var currentEnemySprite = null;
        var currentEnemyObj = null;
        var playerAttackCooldown = 0, PLAYER_ATTACK_CD = 1.0;
        var playerStunned = 0, enemyStunned = 0;
        var rageCharges = 0, vampirismBuff = 0, vampirismReady = false;
        var playerHitFirst = false;
        var cameraShake = 0;
        var pushTimer = null;
        var enemyKnockback = { active: false, sprite: null, originalX: 0, originalZ: 0, t: 0, duration: 0.25, dx: 0, dz: 0 };

        function knockbackEnemy(sprite, fromX, fromZ) {
            if (!sprite) return;
            enemyKnockback.active = true; enemyKnockback.sprite = sprite;
            enemyKnockback.originalX = sprite.position.x; enemyKnockback.originalZ = sprite.position.z;
            var dx = sprite.position.x - fromX, dz = sprite.position.z - fromZ;
            var len = Math.hypot(dx, dz) || 1, power = 0.10;
            enemyKnockback.dx = (dx / len) * power; enemyKnockback.dz = (dz / len) * power;
            enemyKnockback.t = 0;
        }

        function updateHeroSpheres() {
            var p = parent.Sherwood.getPlayer(); if (!p || !p.stats) return;
            var hpPct = p.stats.hp / p.stats.maxHp;
            var lf = document.getElementById('life-fill'); if (lf) lf.style.clipPath = 'inset(' + Math.max(0, (1 - hpPct) * 100) + '% 0 0 0)';
            var ht = document.getElementById('hp-text'); if (ht) ht.textContent = 'HP: ' + Math.floor(p.stats.hp);
            
            if (typeof p.stats.filth === 'undefined') p.stats.filth = 0;
            if (typeof p.stats.maxFilth === 'undefined') p.stats.maxFilth = 100;
            var fPct = p.stats.filth / p.stats.maxFilth;
            var mf = document.getElementById('mana-fill'); if (mf) mf.style.clipPath = 'inset(' + Math.max(0, (1 - fPct) * 100) + '% 0 0 0)';
            var mt = document.getElementById('mana-text'); 
            if (mt) { mt.textContent = 'Скверна: ' + Math.floor(p.stats.filth) + '%'; mt.style.color = '#fff'; }
        }
        setTimeout(updateHeroSpheres, 500);

        function updateTimers(dt) {
            if (playerStunned > 0) playerStunned = Math.max(0, playerStunned - dt);
            if (playerAttackCooldown > 0) playerAttackCooldown = Math.max(0, playerAttackCooldown - dt);
            if (enemyStunned > 0) enemyStunned = Math.max(0, enemyStunned - dt);
            if (vampirismBuff > 0) vampirismBuff = Math.max(0, vampirismBuff - dt);
        }

        function onDefeat() {
            playSound(soundDefeat);
            try { parent.Sherwood.Thicket._onDefeat(nodeId); } catch(e){}
        }

        // КАМЕРА БОЯ (ВИД КАК В ПОДЗЕМКЕ)
        function setBattleCamera(on) {
            if (on) {
                battleRoom.visible = true;
                platformerGroup.visible = false;
                activeCamera = camFPS;
                camFPS.position.set(0, 1.2, 0); 
                camFPS.rotation.set(0, 0, 0);
                
                if (currentEnemySprite) {
                    battleRoom.add(currentEnemySprite);
                    var sy = currentEnemySprite.scale.y;
                    currentEnemySprite.center.set(0.5, 0); 
                    currentEnemySprite.position.set(0, 0, -8); 
                }
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('attack-icon').style.display = 'block';
                document.getElementById('skills-left').style.display = 'flex';
                document.getElementById('skills-right').style.display = 'flex';
            } else {
                battleRoom.visible = false;
                platformerGroup.visible = true;
                if (currentEnemyObj && currentEnemyObj.mesh) {
                    platformerGroup.add(currentEnemyObj.mesh);
                    currentEnemyObj.mesh.center.set(0.5, 0);
                    currentEnemyObj.mesh.position.set(currentEnemyObj.x, 0, 0.8);
                }
                activeCamera = camPlatformer;
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('skills-left').style.display = 'none';
                document.getElementById('skills-right').style.display = 'none';
            }
        }

        // Бой
        function startBattle(obj) {
            if (isBattleActive || !obj) return;
            isBattleActive = true;
            playerHitFirst = false;
            currentEnemyObj = obj;
            currentEnemySprite = obj.mesh;
            currentEnemyStats = { hp: obj.hp, maxHp: obj.maxHp, atk: obj.atk, def: obj.def };
            enemyStunned = 0;
            stopSteps();

            vampirismReady = false;
            var p = parent.Sherwood.getPlayer();
            if (p && p.talents && p.talents['vampirism'] > 0) {
                if (Math.random() < 0.30) { vampirismReady = true; vampirismBuff = 20; showCenterText('ВАМПИРИЗМ!', '#a020f0'); }
            }

            setBattleCamera(true);
            document.getElementById('mob-hp').style.display = 'block';
            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            var nameEl = document.getElementById('mob-hp-name'); if (nameEl) nameEl.textContent = getMobName(obj.img);
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 0 0 0)';
            playSound(soundHit);

            if (battleTimer) clearInterval(battleTimer);
            battleTimer = setInterval(function() {
                if (!isBattleActive || !playerHitFirst) return;
                var pp = parent.Sherwood.getPlayer(); if (!pp) return;
                if (enemyStunned > 0 || playerStunned > 0) return;
                var edmg = Math.max(5, Math.floor(currentEnemyStats.atk * 0.5));
                if (pp.talents) {
                    if (pp.talents['blocking']) edmg = Math.floor(edmg * (1 - 0.1 * pp.talents['blocking']));
                    if (pp.talents['numbness']) edmg = Math.floor(edmg * (1 - 0.08 * pp.talents['numbness']));
                }
                if (pp.talents && pp.talents['ricochet'] > 0) {
                    if (Math.random() < 0.45) {
                        currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - edmg);
                        if (currentEnemyObj) currentEnemyObj.hp = currentEnemyStats.hp;
                        document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
                        document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
                        showCenterText('РИКОШЕТ!', '#a020f0');
                        if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
                        return;
                    }
                }
                pp.stats.hp = Math.max(0, pp.stats.hp - edmg);
                addFilth(FILTH_HIT_AMOUNT);
                if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
                updateHeroSpheres();
                showBloodOverlay();
                if (pp.stats.hp <= 0) { stopBattle(); onDefeat(); }
            }, 1000);
        }

        function stopBattle() {
            isBattleActive = false; playerHitFirst = false; enemyStunned = 0; playerAttackCooldown = 0;
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            document.getElementById('mob-hp').style.display = 'none';
            setBattleCamera(false);
            currentEnemySprite = null; currentEnemyStats = null; currentEnemyObj = null;
        }

        function onEnemyKilled() {
            if (!isBattleActive) return;
            isBattleActive = false; playerHitFirst = false; enemyStunned = 0;
            if (battleTimer) { clearInterval(battleTimer); battleTimer = null; }
            document.getElementById('mob-hp').style.display = 'none';

            if (currentEnemyObj) {
                try {
                    if (parent.Sherwood && parent.Sherwood.Bestiary && parent.Sherwood.Bestiary.registerKill) {
                        var imgFile = currentEnemyObj.img.split('/').pop();
                        parent.Sherwood.Bestiary.registerKill(imgFile);
                    }
                } catch(e) {}
                currentEnemyObj.collected = true;
                if (currentEnemyObj.mesh) {
                    if (currentEnemyObj.mesh.parent) currentEnemyObj.mesh.parent.remove(currentEnemyObj.mesh);
                }
                enemyAlive = false;
                enemySprite = null;
            }
            currentEnemySprite = null; currentEnemyStats = null; currentEnemyObj = null;
            setBattleCamera(false);
            playSound(soundVictory);
            spawnChestAndExit();
        }

        function attackEnemy() {
            if (!isBattleActive || !currentEnemyStats) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return;
            if (playerStunned > 0) { showCenterText('ОГЛУШЁН!', '#888'); return; }
            if (playerAttackCooldown > 0) return;
            playerAttackCooldown = PLAYER_ATTACK_CD;
            playerHitFirst = true;
            playSound(soundHit);

            var baseDmg = Math.max(50, Math.floor(p.stats.attack * 1.5) - Math.floor(currentEnemyStats.def * 0.5) + Math.floor(Math.random() * 20));
            if (p.talents && p.talents['ignore']) baseDmg += Math.floor(baseDmg * p.talents['ignore'] * 0.05);
            if (rageCharges > 0) { baseDmg = Math.floor(baseDmg * 1.2); rageCharges--; if (rageCharges <= 0) showCenterText('Ярость кончилась', '#888'); }

            currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - baseDmg);
            if (currentEnemyObj) currentEnemyObj.hp = currentEnemyStats.hp;

            if (vampirismReady && vampirismBuff > 0 && p.talents && p.talents['vampirism'] > 0) {
                var vampPercent = Math.min(50, 5 + (p.talents['vampirism'] - 1) * 5) / 100;
                var heal = Math.floor(baseDmg * vampPercent);
                if (heal > 0) { p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal); updateHeroSpheres(); }
            }

            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';

            if (currentEnemySprite) {
                var spriteW = currentEnemySprite.scale.x, spriteH = currentEnemySprite.scale.y;
                var ox = (Math.random() - 0.5) * spriteW * 0.7;
                var oy = (Math.random() - 0.5) * spriteH * 0.7;
                hitFlashSprite.position.copy(currentEnemySprite.position);
                hitFlashSprite.position.x += ox;
                hitFlashSprite.position.y += oy + (spriteH/2);
                hitFlashSprite.material.map = bloodTextures[Math.floor(Math.random() * bloodTextures.length)];
                hitFlashSprite.material.needsUpdate = true;
                hitFlashSprite.material.rotation = Math.random() * Math.PI * 2;
                hitFlashSprite.visible = true;
                clearTimeout(pushTimer);
                pushTimer = setTimeout(function() { hitFlashSprite.visible = false; }, 150);
                knockbackEnemy(currentEnemySprite, camFPS.position.x, camFPS.position.z);
                cameraShake = 0.06;

                var hitEffect = document.getElementById('hit-effect');
                var hitEffectImg = document.getElementById('hit-effect-img');
                if (hitEffect && hitEffectImg) {
                    hitEffectImg.src = 'assets/assets2/animation/' + hitSprites[Math.floor(Math.random() * hitSprites.length)];
                    var screenPos = currentEnemySprite.position.clone();
                    screenPos.y += 1.0;
                    screenPos.project(activeCamera);
                    var x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                    var y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
                    var side = Math.random() < 0.5 ? -1 : 1;
                    hitEffect.style.left = (x + side * 120) + 'px';
                    hitEffect.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                    hitEffect.style.display = 'block';
                    setTimeout(function() { hitEffect.style.display = 'none'; }, 200);
                }
            }

            if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
            if (enemyStunned > 0) { updateHeroSpheres(); return; }

            var edmg = Math.max(5, Math.floor(currentEnemyStats.atk * 0.5));
            if (p.talents) {
                if (p.talents['blocking']) edmg = Math.floor(edmg * (1 - 0.1 * p.talents['blocking']));
                if (p.talents['numbness']) edmg = Math.floor(edmg * (1 - 0.08 * p.talents['numbness']));
            }
            if (p.talents && p.talents['ricochet'] > 0) {
                if (Math.random() < 0.45) {
                    currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - edmg);
                    if (currentEnemyObj) currentEnemyObj.hp = currentEnemyStats.hp;
                    document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
                    document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
                    showCenterText('РИКОШЕТ!', '#a020f0');
                    if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
                    return;
                }
            }
            p.stats.hp = Math.max(0, p.stats.hp - edmg);
            addFilth(FILTH_HIT_AMOUNT);
            if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
            updateHeroSpheres();
            showBloodOverlay();
            if (p.stats.hp <= 0) { playSound(soundDefeat); stopBattle(); onDefeat(); }
        }

        function updateMobHpBar() {
            if (!isBattleActive || !currentEnemySprite) return;
            var worldPos = currentEnemySprite.position.clone();
            worldPos.y += 3.0; 
            worldPos.project(activeCamera);
            var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
            document.getElementById('mob-hp').style.left = x + 'px';
            document.getElementById('mob-hp').style.top = y + 'px';
        }

        // Скиллы
        var talentData = {
            'stunning': { icon: 'assets/assets2/talents/stunning.png', side: 'left', cooldown: 20000, name: 'Оглушение' },
            'rage':     { icon: 'assets/assets2/talents/Riot.png', side: 'left', cooldown: 25000, name: 'Ярость' },
            'healing':  { icon: 'assets/assets2/talents/healing.png', side: 'right', cooldown: 8000, name: 'Лечение' }
        };
        var skillCooldowns = {};

        function renderLearnedTalents() {
            var leftCol = document.getElementById('skills-left'), rightCol = document.getElementById('skills-right');
            if (!leftCol || !rightCol) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return;
            if (!p.talents) p.talents = {};
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            for (var id in talentData) {
                var img = document.createElement('img');
                img.src = talentData[id].icon;
                img.style.cssText = 'width:44px; height:44px; object-fit:contain;';
                img.dataset.skillId = id;
                img.onclick = (function(sid){ return function(){ useSkill(sid); }; })(id);
                (talentData[id].side === 'left' ? leftCol : rightCol).appendChild(img);
            }
        }
        setTimeout(renderLearnedTalents, 500);

        function useSkill(skillId) {
            if (!isBattleActive || !currentEnemyStats) return;
            if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return;
            var lvl = (p.talents && p.talents[skillId]) ? p.talents[skillId] : 1;
            
            if (skillId === 'stunning') {
                if (!spendFilth(20)) { showCenterText('Мало скверны!', '#ff5555'); return; }
                enemyStunned = 10;
                showCenterText('ОГЛУШЕНИЕ! 10 сек', '#ffd700');
                playSound(soundAltar);
                skillCooldowns[skillId] = Date.now() + 20000;
            } else if (skillId === 'rage') {
                if (!spendFilth(65)) { showCenterText('Мало скверны!', '#ff5555'); return; }
                rageCharges = 3;
                showCenterText('ЯРОСТЬ! 3 удара +20%', '#ff4400');
                playSound(soundHit);
                skillCooldowns[skillId] = Date.now() + 25000;
            } else if (skillId === 'healing') {
                if (!spendFilth(5 * lvl)) { showCenterText('Мало скверны!', '#ff5555'); return; }
                var heal = 10 * lvl;
                p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal);
                showCenterText('+' + heal + ' HP', '#4caf50');
                updateHeroSpheres();
                playSound(soundAltar);
                skillCooldowns[skillId] = Date.now() + 8000;
            }
            var icon = document.querySelector('img[data-skill-id="' + skillId + '"]');
            if (icon) { icon.classList.add('on-cooldown'); setTimeout(function(){ icon.classList.remove('on-cooldown'); }, talentData[skillId].cooldown); }
        }

        // Взаимодействие
        function checkInteraction() {
            var icon = document.getElementById('attack-icon');
            var img = document.getElementById('attack-icon-img');
            var overlay = document.getElementById('attack-cooldown-overlay');

            if (isBattleActive) {
                icon.style.display = 'block';
                icon.dataset.action = 'attack';
                if (playerAttackCooldown > 0) {
                    overlay.style.display = 'flex';
                    overlay.textContent = playerAttackCooldown.toFixed(1) + 's';
                    img.style.opacity = '0.4';
                } else {
                    overlay.style.display = 'none';
                    img.style.opacity = '1';
                }
                return;
            }
            overlay.style.display = 'none'; img.style.opacity = '1';

            if (enemyAlive && enemySprite && Math.abs(player.pos.x - enemyX) < 3.5) {
                icon.style.display = 'block';
                icon.dataset.action = 'startBattle';
                img.src = 'assets/assets2/talents/simple_attack.png';
                return;
            }
            if (!enemyAlive && chestSprite && Math.abs(player.pos.x - chestSprite.position.x) < 3.5) {
                icon.style.display = 'block';
                icon.dataset.action = 'chest';
                img.src = 'assets/assets2/icons/take.png';
                return;
            }
            if (exitIsOpen && exitDoor && Math.abs(player.pos.x - exitDoor.position.x) < 3.5) {
                icon.style.display = 'block';
                icon.dataset.action = 'exit';
                img.src = 'assets/assets2/icons/take.png';
                return;
            }
            icon.style.display = 'none';
            icon.dataset.action = '';
        }

        document.getElementById('attack-icon').addEventListener('click', function(e) {
            e.stopPropagation();
            var action = e.currentTarget.dataset.action;
            if (action === 'attack') { attackEnemy(); return; }
            if (action === 'startBattle') { if (enemyObj) startBattle(enemyObj); return; }
            if (action === 'chest') {
                playSound(soundChest);
                if (chestSprite) { platformerGroup.remove(chestSprite); chestSprite = null; }
                exitIsOpen = true;
                return;
            }
            if (action === 'exit') {
                playSound(soundVictory);
                setTimeout(function(){ try { parent.Sherwood.Thicket._onWin(nodeId, diff); } catch(err){} }, 500);
                return;
            }
        });

        // Цикл
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min((performance.now() - lastTime) / 1000, 0.05);
            lastTime = performance.now();

            if (video.readyState >= 2) processHeroFrame(player.facing < 0);

            if (!isBattleActive) {
                updatePlayer(dt);
                camPlatformer.position.x = player.pos.x;
                camPlatformer.lookAt(camPlatformer.position.x, 1.0, 0);
                heroGroup.position.copy(player.pos);
                heroGroup.position.y = player.pos.y; 
                playerLight.position.set(player.pos.x, player.pos.y + 1, 2);
            } else {
                updateTimers(dt);
            }

            checkInteraction();
            if (isBattleActive) updateMobHpBar();

            if (enemyKnockback.active && enemyKnockback.sprite) {
                enemyKnockback.t += dt;
                var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1);
                var ease = Math.sin(kk * Math.PI);
                var spr = enemyKnockback.sprite;
                spr.position.x = enemyKnockback.originalX + enemyKnockback.dx * ease;
                spr.position.z = enemyKnockback.originalZ + enemyKnockback.dz * ease;
                if (kk >= 1) {
                    spr.position.x = enemyKnockback.originalX;
                    spr.position.z = enemyKnockback.originalZ;
                    enemyKnockback.active = false;
                    enemyKnockback.sprite = null;
                }
            }

            if (isBattleActive) {
                camFPS.position.x = (Math.random() - 0.5) * cameraShake;
                camFPS.position.z = (Math.random() - 0.5) * cameraShake;
                camFPS.position.y = 1.2 + (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.85; if (cameraShake < 0.001) cameraShake = 0;
            }

            renderer.render(scene, activeCamera);
        }
        animate();

        addEventListener('resize', function() {
            var aspect = window.innerWidth / window.innerHeight;
            camPlatformer.aspect = aspect; camPlatformer.updateProjectionMatrix();
            camFPS.aspect = aspect; camFPS.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
