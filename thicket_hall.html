<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Шервудская чащоба</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; background: transparent; touch-action: none; cursor: crosshair; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        /* --- Боевые элементы (1-в-1 как в dungeon.html) --- */
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #c8a050; font-size: 22px; pointer-events: none; z-index: 20; text-shadow: 0 0 12px #8b6b3a; opacity: 0.8; display: none; }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; left: 50%; top: 30%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #mob-hp-name { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); color: #ffd27a; font-size: 16px; font-weight: bold; text-shadow: 0 0 6px #000, 0 2px 4px #000; white-space: nowrap; z-index: 4; pointer-events: none; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }

        #battle-controls { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 45; }
        #attack-icon { position: absolute; bottom: 100%; left: 50%; transform: translateX(calc(-50% - 20px)); margin-bottom: 70px; width: 85px; height: 85px; cursor: pointer; pointer-events: auto; padding: 0; border: none; background: none; flex-shrink: 0; display: none; }
        #attack-icon:active { transform: translateX(calc(-50% - 20px)) scale(0.9); }
        #attack-icon img { width: 85px; height: 85px; object-fit: contain; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; transition: all 0.2s; display: block; box-sizing: border-box; }
        #attack-icon img:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
        #attack-cooldown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 8px; display: none; align-items: center; justify-content: center; color: #ff5555; font-weight: bold; font-size: 20px; }
        .skill-btn { cursor: pointer; border-radius: 8px; border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6); padding: 3px; width: 85px; height: 85px; object-fit: contain; transition: all 0.2s; display: block; flex-shrink: 0; box-sizing: border-box; }
        .skill-btn:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }
        .skill-btn.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        #skills-row { display: none; flex-direction: row; justify-content: center; align-items: center; gap: 15px; flex-wrap: nowrap; }

        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }

        #arrow-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% - 70px)); color: #e0c080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b5a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
        #arrow-counter img { width: 22px; height: 22px; object-fit: contain; }
        #arrow-counter.low { color: #ff5555; border-color: #ff5555; animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%,100% { box-shadow: 0 0 4px #ff5555; } 50% { box-shadow: 0 0 16px #ff5555; } }
        #kill-counter { position: fixed; top: 12px; left: 50%; transform: translateX(calc(-50% + 70px)); color: #ff8080; font-size: 16px; font-weight: bold; text-shadow: 0 0 8px #000; z-index: 35; pointer-events: none; background: rgba(0,0,0,0.55); padding: 4px 14px; border: 2px solid #6b3a3a; border-radius: 6px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        #kill-counter.clear { color: #55ff55; border-color: #55aa55; box-shadow: 0 0 10px #55aa55; }

        @media (max-width: 900px) {
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #mob-hp-name { font-size: 13px !important; top: -12px !important; }
            #hit-effect-img { width: 130px !important; height: 130px !important; }
            #battle-controls { bottom: 100px; gap: 10px; }
            #attack-icon { width: 70px; height: 70px; margin-bottom: 50px; }
            #attack-icon img { width: 70px; height: 70px; }
            .skill-btn { width: 70px; height: 70px; }
            #skills-row { gap: 10px; }
            #arrow-counter { transform: translateX(calc(-50% - 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #kill-counter { transform: translateX(calc(-50% + 55px)); font-size: 13px !important; padding: 3px 10px !important; }
            #arrow-counter img { width: 18px !important; height: 18px !important; }
        }
    </style>
</head>
<body>
    <div id="crosshair">✚</div>
    <div id="blood-overlay"></div>

    <div id="arrow-counter"><img src="assets/interface/sherwood_hollow_arrow.png" alt=""><span id="arrow-count-text">25</span></div>
    <div id="kill-counter"><span id="kill-count-text">Врагов: 0 / 1</span></div>

    <div id="mob-hp">
        <div id="mob-hp-name">Враг</div>
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 0/0</span>
    </div>

    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>

    <div id="battle-controls">
        <div id="attack-icon">
            <img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png">
            <div id="attack-cooldown-overlay">0.0s</div>
        </div>
        <div id="skills-row"></div>
    </div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>
    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">Скверна: 0%</span>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>
    <button onclick="exitThicket();" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(0,0,0,0.8);border:2px solid #6b5a3a;border-radius:4px;padding:8px 16px;color:#c8a050;font-size:16px;font-weight:bold;cursor:pointer;">←</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <!-- ЕДИНАЯ СИСТЕМА БОЯ (как в подземке) -->
    <script src="js/sherwood/battle_visuals.js"></script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        //  ПАРАМЕТРЫ УЗЛА
        // ============================================================
        var urlParams = new URLSearchParams(window.location.search);
        var nodeId = parseInt(urlParams.get('node') || '1');
        var diff = parseInt(urlParams.get('diff') || '1');
        var enemyData = null;
        try { enemyData = parent.Sherwood.Thicket.getCurrentEnemy(); } catch (e) {}

        var MOB_NAMES = {
            'plague_crow.png': 'Чумной Ворон', 'bone_vulture.png': 'Костяной Стервятник',
            'executioner_crow.png': 'Ворон-Палач', 'plague_pixie.png': 'Чумная Пикси',
            'putrid_sprite.png': 'Гнилостный Спрайт', 'forest_strangler.png': 'Лесной Душегуб'
        };
        function getMobName(p) { if (!p) return 'Враг'; var f = p.split('/').pop(); return MOB_NAMES[f] || 'Враг'; }

        // ============================================================
        //  ЗВУКИ
        // ============================================================
        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var thicketMusic = new Audio('assets/assets2/music/dungeon_3.ogg');
        thicketMusic.loop = true; thicketMusic.volume = 0.4;
        function playSound(a) { try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {} }

        function stopAllParentMusic() {
            try {
                if (parent) {
                    if (parent.audioPlayer) { try { parent.audioPlayer.pause(); parent.audioPlayer.currentTime = 0; } catch (e) {} }
                    if (typeof parent.stopMainMusic === 'function') { try { parent.stopMainMusic(); } catch (e) {} }
                }
            } catch (e) {}
        }
        setTimeout(function () { stopAllParentMusic(); thicketMusic.play().catch(function () {}); }, 300);

        function exitThicket() {
            try { thicketMusic.pause(); thicketMusic.currentTime = 0; } catch (e) {}
            try { parent.Sherwood.Thicket._flee(); } catch (e) {}
        }
        window.exitThicket = exitThicket;

        // ============================================================
        //  ЦЕНТРАЛЬНЫЙ ТЕКСТ
        // ============================================================
        function showCenterText(text, color) {
            var el = document.createElement('div');
            var fs = window.innerWidth <= 600 ? '22px' : '36px';
            el.textContent = text;
            el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);opacity:0;color:' + (color || '#fff') + ';font-size:' + fs + ';font-weight:bold;text-shadow:0 0 12px #000,0 4px 8px #000;pointer-events:none;z-index:200;transition:all 0.9s cubic-bezier(.2,.7,.3,1);font-family:"Times New Roman",serif;letter-spacing:2px;';
            document.body.appendChild(el);
            requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(1.1)'; });
            setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translate(-50%,-120%) scale(0.9)'; }, 900);
            setTimeout(function () { el.remove(); }, 1900);
        }

        // ============================================================
        //  СЦЕНА БОЯ
        // ============================================================
        const battleScene = new THREE.Scene();
        battleScene.background = null;

        const battleCamera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 30);
        battleCamera.position.set(0, 0.55, 3.6);
        battleCamera.rotation.order = 'YXZ';
        battleCamera.lookAt(0, 0.45, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0);
        document.body.appendChild(renderer.domElement);

        battleScene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffd0a0, 1.5);
        dirLight.position.set(5, 10, 5); battleScene.add(dirLight);

        const loader = new THREE.TextureLoader();

        const bgTexture = loader.load('assets/assets2/dungeon_details/swamp_tiles_6.png');
        bgTexture.wrapS = THREE.RepeatWrapping;
        bgTexture.wrapT = THREE.RepeatWrapping;
        bgTexture.repeat.set(3, 2);
        const bgGeometry = new THREE.PlaneGeometry(30, 20);
        const bgMaterial = new THREE.MeshBasicMaterial({ map: bgTexture });
        const bgMesh = new THREE.Mesh(bgGeometry, bgMaterial);
        bgMesh.position.set(0, 0, -10);
        battleScene.add(bgMesh);

        // ============================================================
        //  ПОДКЛЮЧЕНИЕ ЕДИНОЙ СИСТЕМЫ БОЯ
        // ============================================================
        window.Sherwood = window.Sherwood || {};

        window.Sherwood.BattleVisuals.init({
            THREE: THREE,
            scene: battleScene,
            group: null,                 // в сюжетке нет карты-группы
            loader: loader,
            camFPS: battleCamera,
            bgPath: 'assets/assets2/dungeon_details/swamp_tiles_6.png',
            camFPSOptions: { y: 0.55, z: 3.6, lookY: 0.45 },
            mapSize: 16,
            getPlayer: function () { return parent.Sherwood.getPlayer(); },
            Talents: parent.Sherwood.Talents,
            UI: parent.UI,
            getMobName: getMobName,
            playSoundHit: function () { playSound(soundHit); },
            playSoundAltar: function () { playSound(soundAltar); },
            onCenterText: showCenterText,
            onHpChanged: function () { if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay(); },

            // В сюжетке группа/камера фиксированные — просто ничего не делаем
            onCameraEnter: function () { },
            onCameraExit: function () { },

            onBattleStop: function () { },

            onEnemyKilled: function (enemyObj) {
                playSound(soundVictory);
                try {
                    if (parent.Sherwood && parent.Sherwood.Bestiary && parent.Sherwood.Bestiary.registerKill) {
                        var imgFile = enemyObj.img.split('/').pop();
                        parent.Sherwood.Bestiary.registerKill(imgFile);
                    }
                } catch (e) {}
                setTimeout(function () {
                    try { parent.Sherwood.Thicket._onWin(nodeId, diff); } catch (err) {}
                }, 1000);
            },

            onDeath: function (reason) {
                playSound(soundDefeat);
                try { parent.Sherwood.Thicket._onDefeat(nodeId); } catch (e) {}
            }
        });

        // ============================================================
        //  СОЗДАНИЕ ВРАГА И СТАРТ БОЯ
        // ============================================================
        var enemyObj = null;
        var enemySprite = null;

        function createEnemyAndStartBattle() {
            var path = (enemyData && enemyData.imagePath) ? enemyData.imagePath : 'assets/all_beasts/plague_crow.png';
            var isBoss = (enemyData && enemyData.isBoss) ? true : false;
            var mult = 1.0 + (diff - 1) * 0.2;
            var hp = (enemyData && enemyData.hp) ? enemyData.hp : (1000 + Math.floor(Math.random() * 500));
            var atk = (enemyData && enemyData.atk) ? enemyData.atk : (50 + Math.floor(Math.random() * 20));
            var def = (enemyData && enemyData.def) ? enemyData.def : (10 + Math.floor(Math.random() * 10));

            enemyObj = {
                x: 0, y: 0,
                isBoss: isBoss,
                img: path,
                hp: Math.floor(hp * mult),
                maxHp: Math.floor(hp * mult),
                atk: Math.floor(atk * mult),
                def: Math.floor(def * mult),
                collected: false,
                mesh: null
            };

            loader.load(path, function (t) {
                t.minFilter = t.magFilter = THREE.LinearFilter;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: 0.05 }));
                // setupEnemySprite сделает модуль внутри start()
                battleScene.add(enemySprite);
                enemyObj.mesh = enemySprite;
                window.Sherwood.BattleVisuals.start(enemyObj);
            });
        }

        // ============================================================
        //  АНИМАЦИЯ
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            // единая система боя: таймеры, скверна, кулдаун, тряска, нокбэк, HP-бар
            window.Sherwood.BattleVisuals.update(dt);

            // лёгкое покачивание врага, когда он не в нокбэке
            if (enemySprite && !window.Sherwood.BattleVisuals.isActive()) { /* бой окончен */ }
            if (enemySprite && window.Sherwood.BattleVisuals.isActive()) {
                var t = clock.elapsedTime;
                // модуль двигает нокбэк сам; покачивание — по y, чтобы не ломать knockback
                if (enemySprite.position.y > -1) {
                    // мягкое дыхание
                    var baseY = -0.4;
                    if (Math.abs(enemySprite.position.y - baseY) < 0.5) {
                        enemySprite.position.y = baseY + Math.sin(t * 2.5) * 0.02;
                    }
                }
            }

            renderer.render(battleScene, battleCamera);
        }

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        createEnemyAndStartBattle();
        animate();

        setTimeout(function () {
            window.Sherwood.BattleVisuals.loadArrowsFromBag();
            window.Sherwood.BattleVisuals.renderLearnedTalents();
        }, 700);

        addEventListener('resize', function () {
            var aspect = window.innerWidth / window.innerHeight;
            battleCamera.aspect = aspect;
            battleCamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
