            for (var i = 0; i < objects.length; i++) { var o = objects[i]; if (o.collected || LOOT_TYPES.indexOf(o.type) === -1) continue; if (Math.abs(cur.gx - o.x) + Math.abs(cur.gy - o.y) <= 1) { nearLoot = true; break; } }
            if (!nearLoot) { for (var b = 0; b < lootBags.length; b++) { var bag = lootBags[b]; if (bag.opened) continue; if (Math.abs(cur.gx - bag.gx) + Math.abs(cur.gy - bag.gy) <= 1) { nearLoot = true; break; } } }
            
            if (!nearLoot && exitIsOpen && Math.abs(cur.gx - exitCell.gx) + Math.abs(cur.gy - exitCell.gy) <= 1) {
                nearLoot = true; 
            }

            if (!isBattleActive) {
                var controls = document.getElementById('battle-controls');
                if (controls) controls.style.display = nearLoot ? 'flex' : 'none';
            }
            iconImg.src = nearLoot ? 'assets/assets2/icons/take.png' : 'assets/assets2/talents/simple_attack.png';
        }

        document.getElementById('attack-icon').addEventListener('click', (e) => {
            e.stopPropagation(); if (isBattleActive) { attackEnemy(); return; }
            var cur = worldToGrid(playerPos.x, playerPos.z);
            for (var i = 0; i < objects.length; i++) { var o = objects[i]; if (o.collected || LOOT_TYPES.indexOf(o.type) === -1) continue; if (Math.abs(cur.gx - o.x) + Math.abs(cur.gy - o.y) <= 1) { applyLootEffect(o); return; } }
            for (var b = 0; b < lootBags.length; b++) { var bag = lootBags[b]; if (bag.opened) continue; if (Math.abs(cur.gx - bag.gx) + Math.abs(cur.gy - bag.gy) <= 1) { openLootBag(bag); return; } }
            if (exitIsOpen && Math.abs(cur.gx - exitCell.gx) + Math.abs(cur.gy - exitCell.gy) <= 1) { winDungeon(); return; }
        });

        var talentData = { 'stunning': { icon: 'assets/assets2/talents/stunning.png', name: 'Оглушение' }, 'rage': { icon: 'assets/assets2/talents/Riot.png', name: 'Ярость' }, 'healing': { icon: 'assets/assets2/talents/healing.png', name: 'Лечение' } };
        var skillCooldowns = {};
        function renderLearnedTalents() {
            var row = document.getElementById('skills-row'); if (!row) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return; if (!p.talents) p.talents = {}; row.innerHTML = '';
            for (var id in talentData) {
                var img = document.createElement('img'); img.src = talentData[id].icon; img.className = 'skill-btn';
                img.onclick = (function(skillId) { return function() { useSkill(skillId); }; })(id);
                row.appendChild(img);
            }
        }
        setTimeout(renderLearnedTalents, 500);

        function useSkill(skillId) {
            if (!isBattleActive || !currentEnemyStats) return; if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            var p = parent.Sherwood.getPlayer(); if (!p) return; var lvl = (p.talents && p.talents[skillId]) ? p.talents[skillId] : 1;
            if (skillId === 'stunning') { if (!spendFilth(20)) { showCenterText('Мало скверны!', '#ff5555'); return; } enemyStunned = 10; showCenterText('ОГЛУШЕНИЕ!', '#ffd700'); playSound(soundAltar); skillCooldowns[skillId] = Date.now() + 20000; }
            else if (skillId === 'rage') { var f = getFilth(); if (f.cur < f.max) { showCenterText('Нужна полная скверна!', '#ff5555'); return; } if (!spendFilth(65)) return; rageCharges = 3; showCenterText('ЯРОСТЬ!', '#ff4400'); playSound(soundHit); skillCooldowns[skillId] = Date.now() + 25000; }
            else if (skillId === 'healing') { if (!spendFilth(5)) return; var heal = 10; p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal); showCenterText('+' + heal + ' HP', '#4caf50'); updateHeroSpheres(); playSound(soundAltar); skillCooldowns[skillId] = Date.now() + 8000; }
            var icon = document.querySelector('img[data-skill-id="' + skillId + '"]'); if (icon) { icon.classList.add('on-cooldown'); setTimeout(function() { icon.classList.remove('on-cooldown'); }, talentData[skillId].cooldown || 10000); }
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);

            if (moving && waypoints.length && !isBattleActive) {
                let budget = MOVE_SPEED * dt;
                while (budget > 0 && waypoints.length) {
                    const tgt = waypoints[0];
                    const dx = tgt.x - playerPos.x; const dz = tgt.z - playerPos.z; const dist = Math.hypot(dx, dz);
                    if (dist <= budget) { playerPos.x = tgt.x; playerPos.z = tgt.z; budget -= dist; waypoints.shift(); }
                    else { const nx = dx / dist, nz = dz / dist; playerPos.x += nx * budget; playerPos.z += nz * budget; budget = 0; }
                }
                if (!waypoints.length) {
                    moving = false; stopSteps(); syncPlayerGrid(); updateFog();
                    if (pendingBattle) {
                        var eObj = pendingBattle; pendingBattle = null;
                        if (eObj && !eObj.collected) startBattle(eObj);
                    }
                    if (pendingLoot) {
                        var L = pendingLoot; pendingLoot = null;
                        var cg = worldToGrid(playerPos.x, playerPos.z);
                        var dd;
                        if (L.type === 'bag') dd = Math.abs(cg.gx - L.bag.gx) + Math.abs(cg.gy - L.bag.gy);
                        else dd = Math.abs(cg.gx - L.x) + Math.abs(cg.gy - L.y);
                        if (dd <= 1) {
                            if (L.type === 'bag') showCenterText('Нажми кнопку сбора', '#ffd700');
                            else showCenterText('Нажми кнопку сбора', '#ffd700');
                        }
                    }
                }
            }

            updateFilth(dt);
            if (isBattleActive) updateMobHpBar();
            updateLootButton();

            if (!isBattleActive) {
                heroSprite.position.set(playerPos.x, 0.6, playerPos.z);
            }

            if (enemyKnockback.active && enemyKnockback.sprite) {
                enemyKnockback.t += dt; var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1); var ease = Math.sin(kk * Math.PI); var spr = enemyKnockback.sprite;
                spr.position.x = enemyKnockback.originalX + enemyKnockback.dx * ease;
                spr.position.z = enemyKnockback.originalZ + enemyKnockback.dz * ease;
                if (kk >= 1) {
                    spr.position.x = enemyKnockback.originalX;
                    spr.position.z = enemyKnockback.originalZ;
                    enemyKnockback.active = false;
                    enemyKnockback.sprite = null;
                }
            }

            if (isBattleActive) {
                camFPS.position.x = (Math.random() - 0.5) * cameraShake;
                camFPS.position.z = (Math.random() - 0.5) * cameraShake;
                camFPS.position.y = 0.55 + (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.85; if (cameraShake < 0.001) cameraShake = 0;
            } else {
                camTop.position.x = playerPos.x; camTop.position.z = playerPos.z; camTop.position.y = 20; camTop.lookAt(playerPos.x, 0, playerPos.z);
            }

            renderer.render(scene, activeCamera);
        }

        function syncPlayerGrid() { const g = worldToGrid(playerPos.x, playerPos.z); playerGX = g.gx; playerGY = g.gy; updateHighlights(); }

        updateHighlights(); updateFog(); animate(); setTimeout(checkObjects, 800);

        addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camTop.left = -viewSize * aspect / 2; camTop.right = viewSize * aspect / 2; camTop.top = viewSize / 2; camTop.bottom = -viewSize / 2;
            camTop.updateProjectionMatrix();
            camFPS.aspect = aspect; camFPS.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function winDungeon() {
            try {
                if (parent.Sherwood && parent.Sherwood.getPlayer) {
                    var pW = parent.Sherwood.getPlayer();
                    if (pW && pW.stats) {
                        pW.stats.hp = pW.stats.maxHp;
                        pW.stats.filth = 0;
                        filthFullSince = 0;
                        filthDamageTimer = 0;
                        if (parent.Sherwood.saveGame) parent.Sherwood.saveGame();
                        if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
                    }
                }
            } catch(e) {}

            stopSteps(); playSound(soundVictory); try { dungeonMusic.pause(); dungeonMusic.currentTime = 0; } catch(e){}
            try { if (parent.UI && parent.UI._grantCup) parent.UI._grantCup(currentDungeon, currentFloor, currentDiff); if (parent.Sherwood && parent.Sherwood.Dungeon && parent.Sherwood.Dungeon.grantCup) parent.Sherwood.Dungeon.grantCup(currentFloor, currentDiff); } catch(e) {}
            if (parent.Sherwood && parent.Sherwood.getPlayer) { var p = parent.Sherwood.getPlayer(); if (p) { if (!p.resources) p.resources = {}; p.resources.arrows = playerArrows; } }
            try { if (parent.Sherwood && parent.Sherwood.Bestiary && parent.Sherwood.Bestiary.registerKill) { parent.Sherwood.Bestiary.registerKill(currentPool.boss); } } catch(e) {}
            var rewards = { cupEarned: true, exp: 500 + currentFloor * 100 + (currentDiff - 1) * 300 + runLoot.exp, gold: 250 + currentFloor * 50 + (currentDiff - 1) * 150 + runLoot.gold, silver: 100 + currentFloor * 20 + (currentDiff - 1) * 60 + runLoot.silver, items: [] };
            try { if (parent.UI && parent.UI._showVictoryScreen) { parent.UI._lastPortal = null; parent.UI._lastDungeon = currentDungeon; parent.UI._afterRewardAction = function() { try { if (parent.UI._dungeonShowFloors) parent.UI._dungeonShowFloors(currentDungeon); else if (parent.UI.dungeon) parent.UI.dungeon(); } catch(e) { exitDungeon(); } }; parent.UI._showVictoryScreen(rewards); } else { exitDungeon(); } } catch(e) { exitDungeon(); }
        }
        window.winDungeon = winDungeon;

        function loseDungeon() {
            try {
                if (parent.Sherwood && parent.Sherwood.getPlayer) {
                    var pL = parent.Sherwood.getPlayer();
                    if (pL && pL.stats) {
                        pL.stats.hp = pL.stats.maxHp;
                        pL.stats.filth = 0;
                        filthFullSince = 0;
                        filthDamageTimer = 0;
                        if (parent.Sherwood.saveGame) parent.Sherwood.saveGame();
                        if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
                    }
                }
            } catch(e) {}

            stopSteps(); playSound(soundDefeat); try { dungeonMusic.pause(); dungeonMusic.currentTime = 0; } catch(e){}
            var rewards = { exp: 50 + runLoot.exp, gold: runLoot.gold, silver: 20 + runLoot.silver, items: [] };
            try { if (parent.UI && parent.UI._showDefeatScreen) { parent.UI._lastPortal = null; parent.UI._lastDungeon = currentDungeon; parent.UI._afterRewardAction = function() { try { if (parent.UI._dungeonShowFloors) parent.UI._dungeonShowFloors(currentDungeon); else if (parent.UI.dungeon) parent.UI.dungeon(); } catch(e) { exitDungeon(); } }; parent.UI._showDefeatScreen(rewards); } else { exitDungeon(); } } catch(e) { exitDungeon(); }
        }
    </script>
</body>
