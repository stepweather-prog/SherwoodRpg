<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Проклятая чаща</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; background: #000; touch-action: none; cursor: crosshair; }
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }
        #minimap { position: fixed; top: 12px; right: 12px; width: 180px; height: 180px; z-index: 30; pointer-events: none; }
        #minimap-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 1; }
        #minimap-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: transparent; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #c8a050; font-size: 22px; pointer-events: none; z-index: 20; text-shadow: 0 0 12px #8b6b3a; opacity: 0.6; }
        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }
        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }
        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }
        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }
        #loot-fly-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
        #joystick { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; z-index: 30; pointer-events: auto; }
        .arrow-btn { position: absolute; width: 38px; height: 38px; background: rgba(10, 8, 5, 0.85); border: 2px solid #6b5a3a; border-radius: 50%; color: #c8a050; font-size: 16px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px #8b6b3a; box-shadow: 0 0 6px rgba(139, 107, 58, 0.3); }
        .arrow-btn:active { background: rgba(139, 107, 58, 0.6); transform: scale(0.9); }
        #btn-forward { top: 0; left: 41px; }
        #btn-left { top: 41px; left: 0; }
        #btn-right { top: 41px; left: 82px; }
        #btn-back { top: 82px; left: 41px; }
        #attack-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; z-index: 40; cursor: pointer; pointer-events: auto; }
        #skills-left, #skills-right { pointer-events: auto; }
        #skills-left img, #skills-right img { cursor: pointer; border-radius: 6px; transition: all 0.2s; border: 2px solid rgba(200, 160, 80, 0.7); background: rgba(0, 0, 0, 0.5); padding: 2px; }
        #skills-left img:hover, #skills-right img:hover { filter: drop-shadow(0 0 10px #ffd700); transform: scale(1.1); }
        #skills-left img.on-cooldown, #skills-right img.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        #blood-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150; pointer-events: none; opacity: 0; background-position: center center; background-repeat: no-repeat; background-size: cover; transition: opacity 0.1s ease-out; }
        @media (max-width: 600px) {
            button[onclick="exitDungeon();"] { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #joystick { bottom: 20px !important; width: 110px !important; height: 110px !important; }
            .arrow-btn { width: 34px !important; height: 34px !important; font-size: 14px !important; }
            #btn-forward { top: 0 !important; left: 38px !important; }
            #btn-left    { top: 38px !important; left: 0 !important; }
            #btn-right   { top: 38px !important; left: 76px !important; }
            #btn-back    { top: 76px !important; left: 38px !important; }
            #attack-icon { width: 34px !important; height: 34px !important; }
            #minimap { width: 130px !important; height: 130px !important; top: 8px !important; right: 8px !important; }
            #minimap-frame, #minimap-canvas { width: 100% !important; height: 100% !important; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life img, #hero-mana img { width: 135% !important; height: 135% !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #skills-left, #skills-right { bottom: 110px !important; width: 80px !important; }
            #skills-left img, #skills-right img { width: 38px !important; height: 38px !important; }
            #hit-effect-img { width: 130px !important; height: 130px !important; }
        }
    </style>
</head>
<body>
    <div id="info">Проклятая чаща</div>
    <div id="crosshair">✚</div>
    <div id="loot-fly-layer"></div>
    <div id="blood-overlay"></div>
    <div id="mob-hp">
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 1000</span>
    </div>
    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>
    <div id="skills-left" style="position:absolute; bottom:130px; left:10px; width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:45;"></div>
    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>
    <div id="skills-right" style="position:absolute; bottom:130px; right:10px; width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:45;"></div>
    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">1000</span>
    </div>
    <div id="joystick">
        <div class="arrow-btn" id="btn-forward">▲</div>
        <div class="arrow-btn" id="btn-left">◀</div>
        <div class="arrow-btn" id="btn-right">▶</div>
        <div class="arrow-btn" id="btn-back">▼</div>
        <div id="attack-icon"><img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png" style="width:100%;height:100%;object-fit:contain;"></div>
    </div>
    <div id="minimap">
        <img id="minimap-frame" src="assets/assets2/game_details/maps_maps.png" alt="">
        <canvas id="minimap-canvas"></canvas>
    </div>
    <div id="vignette"></div>
    <div id="scanlines"></div>
    <button onclick="exitDungeon();" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(0,0,0,0.8);border:2px solid #6b5a3a;border-radius:4px;padding:8px 16px;color:#c8a050;font-size:16px;font-weight:bold;cursor:pointer;">←</button>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>
    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var currentDungeon = parseInt(urlParams.get('dungeon') || '1');
        var currentFloor = parseInt(urlParams.get('floor') || '1');
        var currentDiff = parseInt(urlParams.get('diff') || '1');
        if (currentFloor < 1 || currentFloor > 6) currentFloor = 1;
        if (currentDiff < 1 || currentDiff > 3) currentDiff = 1;

        // ============================================================
        //  СЛОЖНОСТЬ = СУММА ВСЕХ КУБКОВ + 1 (сквозная нумерация заходов)
        // ============================================================
        var totalCups = 0;
        try {
            if (parent.Sherwood && parent.Sherwood.Dungeon && parent.Sherwood.Dungeon.getTotalCups) {
                totalCups = parent.Sherwood.Dungeon.getTotalCups();
            }
        } catch(e) {}
        var difficultyLevel = totalCups + 1;

        var ENEMY_POOLS = {
            1: { normal: ['plague_crow.png','bone_vulture.png','executioner_crow.png','plague_pixie.png','putrid_sprite.png'], boss: 'forest_strangler.png' },
            2: { normal: ['warped_imp.png','bristle_boar.png','quill_beast.png','grave_borer.png','acid_devourer.png'], boss: 'shard_back.png' },
            3: { normal: ['bone_borer.png','bark_beetle.png','blight_beetle_warden.png','armored_beetle.png','blighted_werewolf.png'], boss: 'blight_lord_beetle.png' },
            4: { normal: ['blight_alpha.png','yew_blight_wolf.png','swamp_slugmouth.png','swamp_gorgymouth.png','swamp_drowner.png'], boss: 'bog_brute.png' },
            5: { normal: ['blighted_oak_golem.png','oak_golem.png','twigtangle.png','woodland_terror.png','leshy.png'], boss: 'root_executioner.png' },
            6: { normal: ['leshy_servant.png','spectral_stag.png','forest_blight_cyclops.png','blight_troglodyte.png','blight_oozemouth.png'], boss: 'blight_lord_leshy.png' }
        };
        var currentPool = ENEMY_POOLS[currentFloor] || ENEMY_POOLS[1];

        // +20% HP/ATK/DEF мобов за каждый кубок
        var mult = 1.0 + (difficultyLevel - 1) * 0.2;

        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundSteps = new Audio('assets/assets2/tune/steps.wav');
        var soundChest = new Audio('assets/assets2/tune/chest_open.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var soundCauldron = new Audio('assets/assets2/tune/cauldron.wav');
        var soundLoot = new Audio('assets/assets2/tune/loot_fly.wav');
        var dungeonMusic = new Audio('assets/assets2/music/dungeon_3.ogg');
        dungeonMusic.loop = true;
        dungeonMusic.volume = 0.4;

        function stopAllParentMusic() {
            try {
                if (parent) {
                    if (parent.audioPlayer) { try { parent.audioPlayer.pause(); parent.audioPlayer.currentTime = 0; } catch(e){} }
                    if (typeof parent.stopMainMusic === 'function') { try { parent.stopMainMusic(); } catch(e){} }
                    if (parent.UI) {
                        try { if (parent.UI._currentMusic) { parent.UI._currentMusic.pause(); parent.UI._currentMusic.currentTime = 0; parent.UI._currentMusic = null; } } catch(e){}
                        try { if (parent.UI._sounds) { for (var k in parent.UI._sounds) { try { parent.UI._sounds[k].pause(); parent.UI._sounds[k].currentTime = 0; } catch(e){} } } } catch(e){}
                    }
                    if (parent.AudioManager) {
                        try { if (typeof parent.AudioManager.stopCityTheme === 'function') parent.AudioManager.stopCityTheme(); } catch(e){}
                        try { if (parent.AudioManager.currentMusic) { parent.AudioManager.currentMusic.pause(); parent.AudioManager.currentMusic.currentTime = 0; } } catch(e){}
                    }
                    if (parent.document) { try { parent.document.querySelectorAll('audio').forEach(function(a){ try { a.pause(); a.currentTime = 0; } catch(e){} }); } catch(e){} }
                }
            } catch(e){}
        }
        setTimeout(function(){ stopAllParentMusic(); dungeonMusic.play().catch(function(){}); }, 300);
        window.addEventListener('click', function(){ stopAllParentMusic(); dungeonMusic.play().catch(function(){}); });
        setInterval(stopAllParentMusic, 500);

        function playSound(audio) { try { audio.currentTime = 0; audio.play().catch(function() {}); } catch(e) {} }
        var stepsPlaying = false;
        function startSteps() { if (stepsPlaying) return; stepsPlaying = true; try { soundSteps.currentTime = 0; soundSteps.play().catch(function(){}); } catch(e){} }
        function stopSteps() { stepsPlaying = false; try { soundSteps.pause(); soundSteps.currentTime = 0; } catch(e){} }

        function exitDungeon() {
            stopSteps();
            try { if (dungeonMusic) { dungeonMusic.pause(); dungeonMusic.currentTime = 0; } } catch(e){}
            try { if (parent.UI) { parent.UI._lastPortal = null; parent.UI._lastDungeon = currentDungeon; } } catch(e){}
            try {
                if (parent && parent.UI && parent.UI._dungeonShowFloors) parent.UI._dungeonShowFloors(currentDungeon);
                else if (parent && parent.UI && parent.UI.dungeon) parent.UI.dungeon();
            } catch(e) {}
        }
        window.exitDungeon = exitDungeon;

        function showCenterText(text, color) {
            var el = document.createElement('div');
            var fontSize = window.innerWidth <= 600 ? '22px' : '36px';
            el.textContent = text;
            el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);opacity:0;color:' + (color || '#fff') + ';font-size:' + fontSize + ';font-weight:bold;text-shadow:0 0 12px #000, 0 4px 8px #000;pointer-events:none;z-index:200;transition:all 0.9s cubic-bezier(.2,.7,.3,1);font-family:"Times New Roman",serif;letter-spacing:2px;';
            document.body.appendChild(el);
            requestAnimationFrame(function() { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(1.1)'; });
            setTimeout(function() { el.style.opacity = '0'; el.style.transform = 'translate(-50%,-120%) scale(0.9)'; }, 900);
            setTimeout(function() { el.remove(); }, 1900);
        }

        var bloodOverlayTextures = [
            'assets/assets2/animation/Fine_blood_spray_texture.png',
            'assets/assets2/animation/Fine_blood_spray_texture (1).png',
            'assets/assets2/animation/Fine_blood_spray_texture (2).png'
        ];
        var bloodOverlayTimeout1 = null, bloodOverlayTimeout2 = null;
        function showBloodOverlay() {
            var el = document.getElementById('blood-overlay');
            if (!el) return;
            var tex = bloodOverlayTextures[Math.floor(Math.random() * bloodOverlayTextures.length)];
            el.style.backgroundImage = 'url("' + tex + '")';
            el.style.transition = 'opacity 0.1s ease-out';
            el.style.opacity = '1';
            clearTimeout(bloodOverlayTimeout1); clearTimeout(bloodOverlayTimeout2);
            bloodOverlayTimeout1 = setTimeout(function() { el.style.transition = 'opacity 0.2s ease-out'; el.style.opacity = '0'; }, 200);
            bloodOverlayTimeout2 = setTimeout(function() { el.style.backgroundImage = ''; }, 200);
        }
        window.showBloodOverlay = showBloodOverlay;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0805);
        scene.fog = new THREE.Fog(0x0a0805, 4, 12);
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x0a0805, 1);
        document.body.appendChild(renderer.domElement);
        scene.add(new THREE.AmbientLight(0x554433, 0.9));
        scene.add(new THREE.HemisphereLight(0x3a2a18, 0x000000, 0.4));

        const size = 16;
        const wallHeight = 1.4;
        const cellSize = 1;

        const map = [];
        for (let i = 0; i < size; i++) {
            map[i] = [];
            for (let j = 0; j < size; j++) { map[i][j] = 1; }
        }

        function generateMaze() {
            const stack = [];
            const startX = 1, startY = 1;
            map[startY][startX] = 0;
            stack.push({ x: startX, y: startY });
            const dirs = [{ x: 0, y: -2 }, { x: 0, y: 2 }, { x: -2, y: 0 }, { x: 2, y: 0 }];
            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                const neighbors = [];
                for (const dir of dirs) {
                    const nx = current.x + dir.x;
                    const ny = current.y + dir.y;
                    if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && map[ny][nx] === 1) {
                        neighbors.push({ x: nx, y: ny, dx: dir.x / 2, dy: dir.y / 2 });
                    }
                }
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    map[next.y][next.x] = 0;
                    map[current.y + next.dy][current.x + next.dx] = 0;
                    stack.push({ x: next.x, y: next.y });
                } else { stack.pop(); }
            }
            // map[size - 2][size - 2] = 0; — УДАЛЕНО (клетка вне лабиринта)
        }
        generateMaze();

        // ============================================================
        //  ВЫХОД — САМАЯ ДАЛЬНЯЯ КЛЕТКА ОТ СТАРТА (BFS)
        // ============================================================
        var exitCell = (function findFarthestCell() {
            var startGX = 1, startGY = 1;
            var visited = {};
            var queue = [{ x: startGX, y: startGY, dist: 0 }];
            visited[startGY * size + startGX] = true;
            var farthest = { x: startGX, y: startGY, dist: 0 };
            var dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
            while (queue.length) {
                var cur = queue.shift();
                if (cur.dist > farthest.dist) farthest = cur;
                for (var d = 0; d < dirs.length; d++) {
                    var nx = cur.x + dirs[d].x;
                    var ny = cur.y + dirs[d].y;
                    if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
                    var v = map[ny][nx];
                    if (v !== 0 && v !== 3) continue;
                    var key = ny * size + nx;
                    if (visited[key]) continue;
                    visited[key] = true;
                    queue.push({ x: nx, y: ny, dist: cur.dist + 1 });
                }
            }
            return { gx: farthest.x, gy: farthest.y };
        })();

        function isWallCell(x, y) {
            if (x < 0 || y < 0 || x >= size || y >= size) return true;
            return map[y][x] === 1;
        }
        function placeDoors() {
            const candidates = [];
            for (let y = 1; y < size - 1; y++) {
                for (let x = 1; x < size - 1; x++) {
                    if (map[y][x] !== 0) continue;
                    if (x === 1 && y === 1) continue;
                    if (x === exitCell.gx && y === exitCell.gy) continue;
                    const wL = isWallCell(x - 1, y), wR = isWallCell(x + 1, y);
                    const wU = isWallCell(x, y - 1), wD = isWallCell(x, y + 1);
                    if (wL && wR && !wU && !wD) candidates.push({ x, y });
                    else if (wU && wD && !wL && !wR) candidates.push({ x, y });
                }
            }
            const placed = [];
            for (const c of candidates) {
                let ok = true;
                for (const p of placed) {
                    if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 4) { ok = false; break; }
                }
                if (ok && Math.random() < 0.4) { map[c.y][c.x] = 2; placed.push(c); }
            }
        }
        placeDoors();

        const loader = new THREE.TextureLoader();

        // ============================================================
        //  ТЕКСТУРЫ ПО ПОДЗЕМЕЛЬЯМ (одинаковы для всех 6 этажей внутри)
        // ============================================================
        var wallTexturePath, floorTexturePath, ceilTexturePath;

        if (currentDungeon === 2) {
            floorTexturePath = 'assets/assets2/dungeon_details/swamp_tiles_6.png';
            wallTexturePath  = 'assets/dungeon_tiles/visual_dungeon/swamp_wall_6.png';
            ceilTexturePath  = 'assets/dungeon_tiles/visual_dungeon/grotto_ceiling_dungeon_1.png';
        } else if (currentDungeon === 3) {
            floorTexturePath = 'assets/assets2/Sherwood_Square/ceiling_raid.png';
            wallTexturePath  = 'assets/dungeon_tiles/visual_dungeon/grotto_wall_6.png';
            ceilTexturePath  = 'assets/dungeon_tiles/visual_dungeon/ceiling_dungeon_5.png';
        } else {
            floorTexturePath = 'assets/dungeon_tiles/visual_dungeon/grotto_tiles_1.png';
            wallTexturePath  = 'assets/dungeon_tiles/visual_dungeon/wall_5.png';
            ceilTexturePath  = 'assets/assets2/dungeon_details/swamp_ceiling_dungeon_1.png';
        }

        const wallTexture  = loader.load(wallTexturePath);
        const floorTexture = loader.load(floorTexturePath);
        const ceilTexture  = loader.load(ceilTexturePath);

        const doorTexture  = loader.load('assets/assets2/game_details/labyrinth_asset.png');
        const lootBagTex   = loader.load('assets/assets2/game_details/loot_bag_of_beasts.png');
        const emptyBagTex  = loader.load('assets/assets2/game_details/empty_bag_of_loot_beasts.png');
        const closedLockTex = loader.load('assets/assets2/game_details/closed_level_lock_icon.png');
        const openDoorTex  = loader.load('assets/assets2/game_details/completion_of_the_second_underground_level1.png');

        [lootBagTex, emptyBagTex, closedLockTex, openDoorTex].forEach(function(t) {
            t.minFilter = THREE.LinearFilter;
            t.magFilter = THREE.LinearFilter;
        });

            if (dx !== 0 && dy !== 0) {

        function buildPath(startGX, startGY, goalGX, goalGY) {
            if (!isWalkable(goalGX, goalGY)) return [];
            const key = (x, y) => y * size + x;
            const prev = new Map();
            const q = [{ x: startGX, y: startGY }];
            prev.set(key(startGX, startGY), null);
            const dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
            let found = false;
            while (q.length) {
                const cur = q.shift();
                if (cur.x === goalGX && cur.y === goalGY) { found = true; break; }
                for (const d of dirs) {
                    const nx = cur.x + d.x, ny = cur.y + d.y;
                    if (!canStep(cur.x, cur.y, nx, ny)) continue;
                    const k = key(nx, ny);
                    if (!prev.has(k)) { prev.set(k, key(cur.x, cur.y)); q.push({ x: nx, y: ny }); }

            if (!found) return [];
            const out = [];
            let k = key(goalGX, goalGY);
            while (k !== null) { out.push({ gx: k % size, gy: Math.floor(k / size) }); k = prev.get(k); }

                let delta = targetYaw - startYaw;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;

        renderer.domElement.addEventListener('click', (e) => {
            ndc.x = (e.clientX / window.innerWidth) * 2 - 1;

                    var hits = raycaster.intersectObject(currentEnemySprite, false);

                }

            var candidates = [];

            var exitHits = raycaster.intersectObject(exitDoor, false);
            if (exitHits.length) candidates.push({ dist: exitHits[0].distance, kind: 'exit' });

            var doorHits = raycaster.intersectObjects(doorLeaves.map(d => d.mesh), false);
            if (doorHits.length) candidates.push({ dist: doorHits[0].distance, kind: 'door', obj: doorHits[0].object });

                var spriteHits = raycaster.intersectObjects(spriteMeshes, false);
                if (spriteHits.length) candidates.push({ dist: spriteHits[0].distance, kind: 'sprite', obj: spriteHits[0].object });
            }

            if (candidates.length > 0) {
                candidates.sort(function(a, b) { return a.dist - b.dist; });
                var best = candidates[0];

                    if (best.dist < 8) {

                    }
                } else if (best.kind === 'bag') {
                    if (best.dist < 8) {
                        var ud2 = best.obj.userData;
                        if (ud2 && ud2.objRef) {
                            var cur = worldToGrid(playerPos.x, playerPos.z);
                            var dist = Math.abs(cur.gx - ud2.gx) + Math.abs(cur.gy - ud2.gy);
                            if (dist <= 1) { openLootBag(ud2.objRef); }
                            else {
                                var path = buildPath(cur.gx, cur.gy, ud2.gx, ud2.gy);
                                if (path.length > 0) { waypoints = path; moving = true; startSteps(); }
                            }
                            return;
                        }
                    }
                } else if (best.kind === 'sprite') {
                    if (best.dist < 8) {
                        var ud3 = best.obj.userData;
                        if (ud3) {
                            if (ud3.type === 'enemy') { ud3.objRef.attacking = true; startBattle(ud3.objRef); return; }
                            if (LOOT_TYPES.indexOf(ud3.type) !== -1) {
                                const ccur = worldToGrid(playerPos.x, playerPos.z);
                                const d = Math.abs(ccur.gx - ud3.gridX) + Math.abs(ccur.gy - ud3.gridY);
                                if (d <= 1) { applyLootEffect(ud3.objRef); }
                                else {
                                    const path = buildPath(ccur.gx, ccur.gy, ud3.gridX, ud3.gridY);
                                    if (path.length > 0) { waypoints = path; moving = true; pendingLoot = ud3.objRef; startSteps(); }
                                }
                                return;
                            }
                        }
                    }
                }
            }

            moveForward();
        });

        function updateLootButton() {
            var iconImg = document.getElementById('attack-icon-img');
            if (!iconImg) return;
            if (isBattleActive) { iconImg.src = 'assets/assets2/talents/simple_attack.png'; return; }
            var nearLoot = null;
            for (var i = 0; i < objects.length; i++) {
                var o = objects[i];
                if (o.collected || LOOT_TYPES.indexOf(o.type) === -1) continue;
                if (isLootInFront(o)) { nearLoot = o; break; }
            }
            if (!nearLoot) {
                for (var b = 0; b < lootBags.length; b++) {
                    var bag = lootBags[b];
                    if (bag.opened) continue;
                    if (isBagInFront(bag)) { nearLoot = { type: 'bag', bag: bag }; break; }
                }
            }
            if (nearLoot) iconImg.src = 'assets/assets2/icons/take.png';
            else iconImg.src = 'assets/assets2/talents/simple_attack.png';
        }

                var o = objects[i];
                if (o.collected || LOOT_TYPES.indexOf(o.type) === -1) continue;
                if (isLootInFront(o)) { applyLootEffect(o); return; }
            }
            for (var b = 0; b < lootBags.length; b++) {

        var enemyKnockback = { active: false, sprite: null, originalX: 0, originalZ: 0, t: 0, duration: 0.25, dx: 0, dz: 0 };

        function knockbackEnemy(sprite, fromX, fromZ) {
            if (!sprite) return;
            enemyKnockback.active = true;
            enemyKnockback.sprite = sprite;
            enemyKnockback.originalX = sprite.position.x;
            enemyKnockback.originalZ = sprite.position.z;
            var dx = sprite.position.x - fromX;
            var dz = sprite.position.z - fromZ;
            var len = Math.hypot(dx, dz) || 1;
            var power = 0.10;
            enemyKnockback.dx = (dx / len) * power;
            enemyKnockback.dz = (dz / len) * power;
            enemyKnockback.t = 0;
        }

        function updateHeroSpheres() {
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            var hpPercent = p.stats.hp / p.stats.maxHp;
            var lifeFill = document.getElementById('life-fill');
            if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPercent) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text');
            if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);
            var mana = p.stats.mana || 0;
            var maxMana = p.stats.maxMana || 100;
            var manaPercent = mana / maxMana;
            var manaFill = document.getElementById('mana-fill');
            if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - manaPercent) * 100) + '% 0 0 0)';

        }

        function checkObjects() { checkExitDoor(); }

        function applyLootEffect(obj) {
            if (!obj) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            if (obj.type === 'potion_hp') {
                var curHp = Math.floor(p.stats.hp);
                var maxHp = Math.floor(p.stats.maxHp);
                if (curHp >= maxHp) { showCenterText('Запас полный', '#4caf50'); return; }
                var addHp = Math.min(50, maxHp - curHp);
                p.stats.hp = curHp + addHp;
                showCenterText('+' + addHp + ' HP', '#4caf50');
                obj.collected = true;
                group.remove(obj.mesh);
            } else if (obj.type === 'potion_mana') {
                var curMp = Math.floor(p.stats.mana || 0);
                var maxMp = Math.floor(p.stats.maxMana || 100);
                if (curMp >= maxMp) { showCenterText('Запас полный', '#4caf50'); return; }
                var addMp = Math.min(50, maxMp - curMp);
                p.stats.mana = curMp + addMp;
                showCenterText('+' + addMp + ' MP', '#4caf50');
                obj.collected = true;
                group.remove(obj.mesh);
            } else if (obj.type === 'cauldron') {
                if (obj.used) { if (parent.UI && parent.UI._showToast) parent.UI._showToast('Котёл уже использован'); return; }
                obj.used = true;
                var curHp2 = Math.floor(p.stats.hp); var maxHp2 = Math.floor(p.stats.maxHp);
                var curMp2 = Math.floor(p.stats.mana || 0); var maxMp2 = Math.floor(p.stats.maxMana || 100);
                var addHp2 = Math.min(25, maxHp2 - curHp2); var addMp2 = Math.min(25, maxMp2 - curMp2);
                p.stats.hp = curHp2 + addHp2; p.stats.mana = curMp2 + addMp2;
                showCenterText('+' + addHp2 + ' HP, +' + addMp2 + ' MP', '#4caf50');
                playSound(soundCauldron);
                if (obj.mesh) obj.mesh.material.color = new THREE.Color(0x555555);
            } else if (obj.type === 'altar') {
                if (obj.used) { if (parent.UI && parent.UI._showToast) parent.UI._showToast('Алтарь уже использован'); return; }
                obj.used = true;
                p.stats.hp = p.stats.maxHp;
                p.stats.mana = p.stats.maxMana || 100;
                showCenterText('Запас полный', '#4caf50');
                playSound(soundAltar);
                if (obj.mesh) obj.mesh.material.color = new THREE.Color(0x555555);
            }
            updateHeroSpheres();
            if (parent.Sherwood.saveGame) parent.Sherwood.saveGame();
            if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
            updateLootButton();
            checkObjects();
        }

        function startBattle(obj) {
            if (isBattleActive) return;
            isBattleActive = true;
            playerHitFirst = false;
            currentEnemySprite = obj.mesh;
            currentEnemyObj = obj;
            currentEnemyStats = { hp: obj.hp, maxHp: obj.maxHp, atk: obj.atk, def: obj.def };
            waypoints = []; moving = false; stopSteps();
            document.getElementById('mob-hp').style.display = 'block';
            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 0 0 0)';
            playSound(soundHit);
            if (battleTimer) clearInterval(battleTimer);
            battleTimer = setInterval(function() {
                if (!isBattleActive) return;
                if (!playerHitFirst) return;
                if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
                var p = parent.Sherwood.getPlayer();
                if (!p) return;
                var edmg = Math.max(1, Math.floor(currentEnemyStats.atk * 0.3));
                if (p.talents) {
                    if (p.talents['blocking']) edmg = Math.floor(edmg * (1 - 0.1 * p.talents['blocking']));
                    if (p.talents['numbness']) edmg = Math.floor(edmg * (1 - 0.08 * p.talents['numbness']));
                }
                p.stats.hp = Math.max(0, p.stats.hp - edmg);
                if (parent.UI.updateDisplay) parent.UI.updateDisplay();
                updateHeroSpheres();
                showBloodOverlay();
                if (p.stats.hp <= 0) { stopBattle(); loseDungeon(); }
            }, 1500);
        }

        function stopBattle() {
            isBattleActive = false;

            currentEnemyStats = null;

        function onEnemyKilled() {

        function attackEnemy() {
            if (!isBattleActive || !currentEnemyStats) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            playerHitFirst = true;
            var p = parent.Sherwood.getPlayer();
            playSound(soundHit);
            var baseDmg = Math.max(50, Math.floor(p.stats.attack * 1.5) - Math.floor(currentEnemyStats.def * 0.5) + Math.floor(Math.random() * 20));
            if (p.talents && p.talents['ignore']) baseDmg += Math.floor(baseDmg * p.talents['ignore'] * 0.05);
            var now = Date.now();
            for (var i = activeEffects.length - 1; i >= 0; i--) {
                var ef = activeEffects[i];
                if (ef.endsAt < now) { activeEffects.splice(i, 1); continue; }
                if (ef.type === 'ricochet' || ef.type === 'riot' || ef.type === 'inspiration') baseDmg = Math.floor(baseDmg * (1 + ef.bonus));
            }
            var dmg = baseDmg;
            if (p.talents && p.talents['vampirism'] && Math.random() < 0.3) {
                p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + 10 * p.talents['vampirism']);
            }
            currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - dmg);
            if (currentEnemyObj) currentEnemyObj.hp = currentEnemyStats.hp;
            document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
            document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
            if (currentEnemySprite) {
                var spriteW = currentEnemySprite.scale.x;
                var spriteH = currentEnemySprite.scale.y;
                var ox = (Math.random() - 0.5) * spriteW * 0.7;
                var oy = (Math.random() - 0.5) * spriteH * 0.7;
                hitFlashSprite.position.copy(currentEnemySprite.position);
                hitFlashSprite.position.x += ox;
                hitFlashSprite.position.y += oy;
                hitFlashSprite.material.map = bloodTextures[Math.floor(Math.random() * bloodTextures.length)];
                hitFlashSprite.material.needsUpdate = true;
                hitFlashSprite.material.rotation = Math.random() * Math.PI * 2;
                hitFlashSprite.visible = true;
                clearTimeout(pushTimer);
                pushTimer = setTimeout(function() { hitFlashSprite.visible = false; }, 150);
                knockbackEnemy(currentEnemySprite, playerPos.x, playerPos.z);
                cameraShake = 0.06;
            }
            var hitEffect = document.getElementById('hit-effect');
            var hitEffectImg = document.getElementById('hit-effect-img');
            if (hitEffect && hitEffectImg && currentEnemySprite) {
                hitEffectImg.src = 'assets/assets2/animation/' + hitSprites[Math.floor(Math.random() * hitSprites.length)];
                var screenPos = currentEnemySprite.position.clone();
                screenPos.y += 0.1;
                screenPos.project(camera);
                var x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                var y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
                var side = Math.random() < 0.5 ? -1 : 1;
                hitEffect.style.left = (x + side * 120) + 'px';
                hitEffect.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                hitEffect.style.display = 'block';
                setTimeout(function() { hitEffect.style.display = 'none'; }, 200);
            }
            if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
            var skipEnemyTurn = false;
            for (var i = activeEffects.length - 1; i >= 0; i--) {
                if (activeEffects[i].type === 'stun' || activeEffects[i].type === 'knot') skipEnemyTurn = true;
            }
            if (skipEnemyTurn) { updateHeroSpheres(); return; }
            if (p.talents) {
                if (p.talents['parry'] && Math.random() < 0.05 * p.talents['parry']) return;
                if (p.talents['silence'] && Math.random() < 0.1 * p.talents['silence']) return;
            }
            var edmg = Math.max(1, Math.floor(currentEnemyStats.atk * 0.3));
            if (p.talents) {
                if (p.talents['blocking']) edmg = Math.floor(edmg * (1 - 0.1 * p.talents['blocking']));
                if (p.talents['numbness']) edmg = Math.floor(edmg * (1 - 0.08 * p.talents['numbness']));
            }
            for (var i = 0; i < activeEffects.length; i++) {
                if (activeEffects[i].type === 'funnel') edmg = Math.floor(edmg * (1 - activeEffects[i].debuff));
            }
            p.stats.hp = Math.max(0, p.stats.hp - edmg);
            if (parent.UI.updateDisplay) parent.UI.updateDisplay();
            updateHeroSpheres();
            showBloodOverlay();
            if (p.stats.hp <= 0) { playSound(soundDefeat); stopBattle(); loseDungeon(); }
        }

        function renderLearnedTalents() {
            var leftCol = document.getElementById('skills-left');
            var rightCol = document.getElementById('skills-right');
            if (!leftCol || !rightCol) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            for (var id in p.talents) {
                var lvl = p.talents[id];
                if (lvl > 0 && talentData[id]) {
                    var img = document.createElement('img');
                    img.src = talentData[id].icon;
                    img.style.cssText = 'width:44px; height:44px; object-fit:contain;';
                    img.title = talentData[id].name + ' (Ур. ' + lvl + ')';
                    img.dataset.skillId = id;
                    img.onclick = (function(skillId) { return function() { useSkill(skillId); }; })(id);
                    (talentData[id].side === 'left' ? leftCol : rightCol).appendChild(img);
                }
            }
        }

        function useSkill(skillId) {
            if (!isBattleActive || !currentEnemyStats) return;
            if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;
            var lvl = p.talents[skillId] || 0;
            if (lvl <= 0) return;
            var manaCosts = {
                'poisoning': 10, 'vampirism': 15, 'stunning': 20, 'ricochet': 25, 'riot': 15,
                'force_of_elements': 10, 'evil_eye': 20, 'healing': 20, 'healer': 25,
                'funnel': 15, 'inspiration': 30, 'knot': 20
            };
            var manaCost = (manaCosts[skillId] || 10) * lvl;
            if (!p.stats.mana) p.stats.mana = 0;
            if (p.stats.mana < manaCost) {
                if (parent.UI && parent.UI._showToast) parent.UI._showToast('Не хватает маны! Нужно ' + manaCost);
                return;
            }
            p.stats.mana -= manaCost;
            updateHeroSpheres();
            var dmg = 0, heal = 0;
            switch (skillId) {
                case 'poisoning':
                    if (poisonTimer) clearInterval(poisonTimer);
                    var poisonDmg = 20 * lvl;
                    var poisonTicks = 3;
                    poisonTimer = setInterval(function() {
                        if (!isBattleActive) { clearInterval(poisonTimer); return; }
                        currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - poisonDmg);
                        document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
                        document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
                        if (currentEnemyStats.hp <= 0) { clearInterval(poisonTimer); onEnemyKilled(); }
                        poisonTicks--;
                        if (poisonTicks <= 0) clearInterval(poisonTimer);
                    }, 1000);
                    break;
                case 'vampirism':
                    dmg = 30 * lvl;
                    currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - dmg);
                    heal = Math.floor(dmg * 0.5);
                    p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal);
                    updateHeroSpheres();
                    break;
                case 'stunning':
                    if (Math.random() < 0.2 * lvl) activeEffects.push({ type: 'stun', endsAt: Date.now() + 3000 });
                    break;
                case 'ricochet':
                    activeEffects.push({ type: 'ricochet', endsAt: Date.now() + 3000, bonus: 0.3 * lvl, crit: 0.5 });
                    break;
                case 'riot':
                    if (p.stats.hp / p.stats.maxHp < 0.5) activeEffects.push({ type: 'riot', endsAt: Date.now() + 6000, bonus: 0.25 * lvl });
                    break;
                case 'force_of_elements':
                    dmg = 20 * lvl;
                    currentEnemyStats.hp = Math.max(0, currentEnemyStats.hp - dmg);
                    break;
                case 'evil_eye':
                    activeEffects.push({ type: 'evil_eye', endsAt: Date.now() + 5000, debuff: 0.15 * lvl });
                    break;
                case 'healing':
                    heal = 50 * lvl;
                    p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + heal);
                    updateHeroSpheres();
                    break;
                case 'healer':
                    if (healerTimer) clearInterval(healerTimer);
                    var healerAmount = 5 * lvl;
                    var healerTicks = 5;
                    healerTimer = setInterval(function() {
                        if (!isBattleActive) { clearInterval(healerTimer); return; }
                        p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + healerAmount);
                        updateHeroSpheres();
                        healerTicks--;
                        if (healerTicks <= 0) clearInterval(healerTimer);
                    }, 1000);
                    break;
                case 'funnel':
                    activeEffects.push({ type: 'funnel', endsAt: Date.now() + 4000, debuff: 0.3 * lvl });
                    break;
                case 'inspiration':
                    activeEffects.push({ type: 'inspiration', endsAt: Date.now() + 5000, bonus: 0.2 * lvl });
                    break;
                case 'knot':
                    activeEffects.push({ type: 'knot', endsAt: Date.now() + 3000 * lvl });
                    break;
            }
            if (dmg > 0) {
                document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemyStats.hp + '/' + currentEnemyStats.maxHp;
                document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - (currentEnemyStats.hp / currentEnemyStats.maxHp * 100)) + '% 0 0)';
                if (currentEnemyStats.hp <= 0) { onEnemyKilled(); return; }
            }
            var cd = talentData[skillId].cooldown || 0;
            if (cd > 0) {
                skillCooldowns[skillId] = Date.now() + cd;
                var icon = document.querySelector('img[data-skill-id="' + skillId + '"]');
                if (icon) { icon.classList.add('on-cooldown'); setTimeout(function() { icon.classList.remove('on-cooldown'); }, cd); }
            }
        }

        const ENEMY_SPEED = 0.55;
        const ENEMY_AGGRO_RANGE = 5.0;
        const ENEMY_STOP_DIST = 1.2;
        const ENEMY_STEP_INTERVAL = 0.5;
        const ENEMY_MAX_AGGRO = 2;

        function updateEnemies(dt) {
            if (isBattleActive) return;
            var alreadyChasing = 0;
            for (var ci = 0; ci < objects.length; ci++) {
                var ce = objects[ci];
                if (ce.type === 'enemy' && !ce.collected && !ce.attacking && ce._chasing) alreadyChasing++;
            }
            objects.forEach(function(obj) {
                if (obj.collected || obj.type !== 'enemy' || !obj.mesh) return;
                if (obj.attacking) return;
                var ex = obj.mesh.position.x, ez = obj.mesh.position.z;
                var dx = playerPos.x - ex, dz = playerPos.z - ez;
                var dist = Math.hypot(dx, dz);
                if (dist > ENEMY_AGGRO_RANGE) { obj.stepTimer = 0; obj._chasing = false; return; }
                if (!obj._chasing && alreadyChasing >= ENEMY_MAX_AGGRO) { obj.stepTimer = 0; return; }
                if (!obj._chasing) { obj._chasing = true; alreadyChasing++; }
                if (dist < ENEMY_STOP_DIST) { obj.stepTimer = 0; return; }
                obj.stepTimer = (obj.stepTimer || 0) + dt;
                if (obj.stepTimer < ENEMY_STEP_INTERVAL) return;
                obj.stepTimer = 0;
                var step = ENEMY_SPEED * ENEMY_STEP_INTERVAL;
                var nx = ex + (dx / dist) * step;
                var nz = ez + (dz / dist) * step;
                var g = worldToGrid(nx, nz);
                if (isWalkable(g.gx, g.gy) && !isEnemyAt(g.gx, g.gy)) {
                    obj.mesh.position.x = nx; obj.mesh.position.z = nz;
                    obj.x = g.gx; obj.y = g.gy;
                } else {
                    var gxOnly = worldToGrid(nx, ez);
                    var gzOnly = worldToGrid(ex, nz);
                    if (isWalkable(gxOnly.gx, gxOnly.gy) && !isEnemyAt(gxOnly.gx, gxOnly.gy)) {
                        obj.mesh.position.x = nx; obj.x = gxOnly.gx; obj.y = gxOnly.gy;
                    } else if (isWalkable(gzOnly.gx, gzOnly.gy) && !isEnemyAt(gzOnly.gx, gzOnly.gy)) {
                        obj.mesh.position.z = nz; obj.x = gzOnly.gx; obj.y = gzOnly.gy;
                    }
                }
            });
        }

        const clock = new THREE.Clock();

        function updateCamera() {
            camera.position.x = playerPos.x + (Math.random() - 0.5) * cameraShake;
            camera.position.z = playerPos.z + (Math.random() - 0.5) * cameraShake;
            camera.position.y = 0.75 + Math.sin(clock.elapsedTime * 10) * 0.012 * (moving ? 1 : 0) + (Math.random() - 0.5) * cameraShake;
            camera.rotation.set(0, playerYaw, 0);
            cameraShake *= 0.85;
            if (cameraShake < 0.001) cameraShake = 0;
        }
        function syncPlayerGrid() {
            const g = worldToGrid(playerPos.x, playerPos.z);
            playerGX = g.gx; playerGY = g.gy;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.elapsedTime;
            if (moving && waypoints.length && !isBattleActive) {
                let budget = MOVE_SPEED * dt;
                while (budget > 0 && waypoints.length) {
                    const tgt = waypoints[0];
                    const dx = tgt.x - playerPos.x;
                    const dz = tgt.z - playerPos.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist <= budget) {
                        playerPos.x = tgt.x; playerPos.z = tgt.z;
                        budget -= dist; waypoints.shift();
                    } else {
                        const nx = dx / dist, nz = dz / dist;
                        playerPos.x += nx * budget; playerPos.z += nz * budget;
                        budget = 0;
                    }
                }
                if (!waypoints.length && !isBattleActive) {
                    moving = false;
                    stopSteps();
                    if (pendingLoot) {
                        var pp = pendingLoot;
                        pendingLoot = null;
                        var cg = worldToGrid(playerPos.x, playerPos.z);
                        var dd = Math.abs(cg.gx - pp.x) + Math.abs(cg.gy - pp.y);
                        if (dd <= 1) applyLootEffect(pp);
                    }
                    checkObjects();
                }
            }
            updateEnemies(dt);
            syncPlayerGrid();
            updateLootButton();
            if (enemyKnockback.active && enemyKnockback.sprite) {
                enemyKnockback.t += dt;
                var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1);
                var ease = Math.sin(kk * Math.PI);
                var spr = enemyKnockback.sprite;
                spr.position.x = enemyKnockback.originalX + enemyKnockback.dx * ease;
                spr.position.z = enemyKnockback.originalZ + enemyKnockback.dz * ease;
                if (kk >= 1) {
                    spr.position.x = enemyKnockback.originalX;
                    spr.position.z = enemyKnockback.originalZ;
                    enemyKnockback.active = false;
                    enemyKnockback.sprite = null;
                }
            }
            heroGlow.position.set(playerPos.x, 0.9, playerPos.z);
            heroGlow.intensity = 0.65 + Math.sin(t * 3) * 0.08;
            for (const d of doorLeaves) {
                if (d.open && d.t < 1) {
                    d.t += dt / 0.45;
                    const k = Math.min(d.t, 1);
                    const e = k * k * (3 - 2 * k);
                    d.mesh.position.y = d.closedY + (d.openY - d.closedY) * e;
                    if (k >= 1) d.mesh.visible = false;
                }
            }
            updateCamera();
            renderer.render(scene, camera);
            if (isBattleActive) updateMobHpBar();
            updateExplored();
            drawMinimap();
        }

        function drawMinimap() {
            mmCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    const idx = row * size + col;
                    if (!explored[idx]) continue;
                    let color = null;
                    const v = map[row][col];
                    if (v === 1) color = 'rgba(42,26,10,0.85)';
                    else if (v === 2) color = 'rgba(139,90,43,0.9)';
                    else if (v === 3) color = 'rgba(201,160,64,0.9)';
                    else color = 'rgba(139,115,85,0.75)';
                    mmCtx.fillStyle = color;
                    mmCtx.fillRect(col * minimapCell, row * minimapCell, minimapCell, minimapCell);
                }
            }
            mmCtx.fillStyle = 'rgba(255, 215, 0, 0.55)';
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    if (walked[row * size + col]) {
                        mmCtx.beginPath();
                        mmCtx.arc(col * minimapCell + minimapCell / 2, row * minimapCell + minimapCell / 2, minimapCell * 0.45, 0, Math.PI * 2);
                        mmCtx.fill();
                    }
                }
            }
            var exitKnown = false;
            for (var ddy = -1; ddy <= 1 && !exitKnown; ddy++) {
                for (var ddx = -1; ddx <= 1 && !exitKnown; ddx++) {
                    var gx = exitCell.gx + ddx, gy = exitCell.gy + ddy;
                    if (gx < 0 || gy < 0 || gx >= size || gy >= size) continue;
                    if (explored[gy * size + gx]) exitKnown = true;
                }
            }
            if (exitKnown) {
                mmCtx.fillStyle = exitIsOpen ? '#4caf50' : '#c0392b';
                mmCtx.fillRect(exitCell.gx * minimapCell + 2, exitCell.gy * minimapCell + 2, minimapCell - 4, minimapCell - 4);
                mmCtx.strokeStyle = '#000';
                mmCtx.lineWidth = 1;
                mmCtx.strokeRect(exitCell.gx * minimapCell + 2, exitCell.gy * minimapCell + 2, minimapCell - 4, minimapCell - 4);
            }
            const pg = worldToGrid(playerPos.x, playerPos.z);
            mmCtx.fillStyle = '#ffd700';
            mmCtx.beginPath();
            mmCtx.arc(pg.gx * minimapCell + minimapCell/2, pg.gy * minimapCell + minimapCell/2, minimapCell * 1.2, 0, Math.PI * 2);
            mmCtx.fill();
            const cx = pg.gx * minimapCell + minimapCell/2;
            const cy = pg.gy * minimapCell + minimapCell/2;
            const len = minimapCell * 3;
            const dx = -Math.sin(playerYaw) * len;
            const dy = -Math.cos(playerYaw) * len;
            mmCtx.strokeStyle = '#ffd700';
            mmCtx.lineWidth = 2;
            mmCtx.beginPath();
            mmCtx.moveTo(cx, cy);
            mmCtx.lineTo(cx + dx, cy + dy);
            mmCtx.stroke();
        }

        function updateExplored() {
            const pg = worldToGrid(playerPos.x, playerPos.z);
            const R = 3;
            for (let dy = -R; dy <= R; dy++) {
                for (let dx = -R; dx <= R; dx++) {
                    const gx = pg.gx + dx;
                    const gy = pg.gy + dy;
                    if (gx < 0 || gy < 0 || gx >= size || gy >= size) continue;
                    if (dx*dx + dy*dy > R*R) continue;
                    explored[gy * size + gx] = 1;
                }
            }
            if (pg.gx >= 0 && pg.gy >= 0 && pg.gx < size && pg.gy < size) {
                walked[pg.gy * size + pg.gx] = 1;
            }
        }

        animate();
        setTimeout(checkObjects, 800);
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
