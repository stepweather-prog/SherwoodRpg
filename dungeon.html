<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dungeon — Diablo 1 style</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#000; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { display:block; cursor: crosshair; touch-action:none; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:6; opacity:0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #hud { position:fixed; top:16px; left:50%; transform:translateX(-50%);
    color:#c8a050; font:16px "Times New Roman", serif; letter-spacing:2px;
    background:rgba(0,0,0,0.7); border:1px solid #4a3a2a; padding:6px 18px;
    border-radius:3px; z-index:10; text-shadow:0 0 8px #8b6b3a; pointer-events:none; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    color:#8b6b3a; font:13px "Times New Roman", serif; letter-spacing:1px;
    z-index:10; pointer-events:none; text-shadow:0 0 6px #000; }

  #target { position:fixed; width:34px; height:34px; margin:-17px 0 0 -17px;
    border:2px solid #c8a050; border-radius:50%; pointer-events:none; z-index:8;
    box-shadow:0 0 12px #8b6b3a, inset 0 0 8px #8b6b3a; opacity:0;
    transition: opacity .15s; }
  #target.on { opacity:1; animation: pulse .8s infinite alternate; }
  @keyframes pulse { from { transform:scale(1);} to { transform:scale(1.15);} }

  /* кнопка обычного удара — fallback */
  #attack-icon { position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px;
    z-index: 40; cursor: pointer; pointer-events: auto; }
  #attack-icon img { width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 6px #8b6b3a); }

  /* HP врага */
  #mob-hp { position: fixed; width: 220px; height: 80px; z-index: 50;
    transform: translate(-50%, -100%); display: none; pointer-events: none; }
  #mob-hp .frame { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; z-index:2; }
  #mob-hp .fill { position:absolute; top:40%; left:12%; width:76%; height:14%; object-fit:cover;
    clip-path: inset(0 50% 0 0); z-index:1; }
  #mob-hp-text { position:absolute; top:55%; left:50%; transform:translate(-50%,-50%);
    color:#fff; font-size:14px; font-weight:bold; z-index:3; text-shadow:0 0 6px #000; }
</style>
</head>
<body>
<div id="hud">ПРОКЛЯТЫЙ ЗАЛ</div>
<div id="hint">Клик по полу — идти &nbsp;•&nbsp; клик по двери — открыть &nbsp;•&nbsp; клик по врагу — ударить</div>
<div id="target"></div>

<div id="mob-hp">
  <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
  <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
  <span id="mob-hp-text">HP: 1000/1000</span>
</div>

<div id="attack-icon"><img id="attack-icon-img" src="assets/assets2/talents/simple_attack.png"></div>

<div id="vignette"></div>
<div id="grain"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
//  МУЗЫКА — только dungeon_3.ogg, глушим всё остальное
// ============================================================
var soundHit    = new Audio('assets/assets2/tune/hit.wav');
var soundVictory= new Audio('assets/assets2/tune/victory.wav');
var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
var dungeonMusic= new Audio('assets/assets2/music/dungeon_3.ogg');
dungeonMusic.loop = true;
dungeonMusic.volume = 0.4;

function stopAllMusic(){
  try {
    if (parent) {
      if (parent.AudioManager) {
        try { if (typeof parent.AudioManager.stopCityTheme === 'function') parent.AudioManager.stopCityTheme(); } catch(e){}
        try {
          if (parent.AudioManager.currentMusic) {
            parent.AudioManager.currentMusic.pause();
            parent.AudioManager.currentMusic.currentTime = 0;
            parent.AudioManager.currentMusic = null;
          }
        } catch(e){}
      }
      if (parent.document) {
        try {
          parent.document.querySelectorAll('audio').forEach(function(a){
            try { a.pause(); a.currentTime = 0; } catch(e){}
          });
        } catch(e){}
      }
    }
  } catch(e){}
}
window.stopAllMusic = stopAllMusic;

var musicStarted = false;
function startDungeonMusic(){
  if (musicStarted) return;
  musicStarted = true;
  stopAllMusic();
  dungeonMusic.play().catch(function(){});
}
setTimeout(function(){ stopAllMusic(); dungeonMusic.play().catch(function(){}); }, 200);
window.addEventListener('click', startDungeonMusic);
window.addEventListener('touchstart', startDungeonMusic);
setInterval(stopAllMusic, 500);

function playSound(audio){ try { audio.currentTime = 0; audio.play().catch(function(){}); } catch(e){} }

// ============================================================
//  СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
scene.fog = new THREE.Fog(0x050403, 12, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 80);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setClearColor(0x050403, 1);
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0x2a1e12, 0.6);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x1a1008, 0x000000, 0.3);
scene.add(hemi);

// ============================================================
//  КАРТА
// ============================================================
const size = 33;
const cellSize = 1;
const wallHeight = 1.4;

const map = Array.from({length:size}, ()=>Array(size).fill(1));
const rooms = [];

function carveRoom(x, y, w, h){
  for (let j=y; j<y+h; j++)
    for (let i=x; i<x+w; i++)
      map[j][i] = 0;
  rooms.push({ x, y, w, h, cx: (x + (w>>1)), cy: (y + (h>>1)) });
}
function roomsOverlap(a, b, pad=1){
  return !(a.x + a.w + pad <= b.x || b.x + b.w + pad <= a.x ||
           a.y + a.h + pad <= b.y || b.y + b.h + pad <= a.y);
}
function carveH(x1, x2, y){
  const [a,b] = x1<x2 ? [x1,x2] : [x2,x1];
  for (let x=a; x<=b; x++) if (map[y][x]===1) map[y][x]=0;
}
function carveV(y1, y2, x){
  const [a,b] = y1<y2 ? [y1,y2] : [y2,y1];
  for (let y=a; y<=b; y++) if (map[y][x]===1) map[y][x]=0;
}

function generateRooms(){
  const maxRooms = 14;
  const minR = 5, maxR = 11;
  let attempts = 0;
  while (rooms.length < maxRooms && attempts < 400){
    attempts++;
    const w = minR + Math.floor(Math.random()*(maxR-minR));
    const h = minR + Math.floor(Math.random()*(maxR-minR));
    const x = 1 + Math.floor(Math.random()*(size - w - 2));
    const y = 1 + Math.floor(Math.random()*(size - h - 2));
    const r = { x, y, w, h };
    if (rooms.some(o => roomsOverlap(r, o))) continue;
    carveRoom(x, y, w, h);
  }
  for (let i=1; i<rooms.length; i++){
    const a = rooms[i-1], b = rooms[i];
    const ax = a.cx, ay = a.cy, bx = b.cx, by = b.cy;
    if (Math.random() < 0.5){
      carveH(ax, bx, ay);
      carveV(ay, by, bx);
    } else {
      carveV(ay, by, ax);
      carveH(ax, bx, by);
    }
  }
}
generateRooms();

// ============================================================
//  ДВЕРИ
// ============================================================
function isWallCell(x, y){
  if (x<0||y<0||x>=size||y>=size) return true;
  return map[y][x] === 1;
}
function isFloorCell(x, y){
  if (x<0||y<0||x>=size||y>=size) return false;
  return map[y][x] === 0 || map[y][x] === 2 || map[y][x] === 3;
}
function floorWidthX(x, y){
  let w = 1;
  for (let i=1; i<6; i++){ if (isFloorCell(x-i,y)) w++; else break; }
  for (let i=1; i<6; i++){ if (isFloorCell(x+i,y)) w++; else break; }
  return w;
}
function floorHeightY(x, y){
  let h = 1;
  for (let i=1; i<6; i++){ if (isFloorCell(x,y-i)) h++; else break; }
  for (let i=1; i<6; i++){ if (isFloorCell(x,y+i)) h++; else break; }
  return h;
}
function placeDoors(){
  const candidates = [];
  for (let y=1; y<size-1; y++){
    for (let x=1; x<size-1; x++){
      if (map[y][x] !== 0) continue;
      const wL = isWallCell(x-1,y), wR = isWallCell(x+1,y);
      const wU = isWallCell(x,y-1), wD = isWallCell(x,y+1);
      if (wL && wR && !wU && !wD){
        if (floorWidthX(x, y-1) >= 3 || floorWidthX(x, y+1) >= 3) candidates.push({ x, y, horiz:true });
      } else if (wU && wD && !wL && !wR){
        if (floorHeightY(x-1, y) >= 3 || floorHeightY(x+1, y) >= 3) candidates.push({ x, y, horiz:false });
      }
    }
  }
  const placed = [];
  for (const c of candidates){
    let ok = true;
    for (const p of placed){
      if (Math.abs(p.x - c.x) + Math.abs(p.y - c.y) < 4){ ok = false; break; }
    }
    if (ok && Math.random() < 0.85){
      map[c.y][c.x] = 2;
      placed.push(c);
    }
  }
}
placeDoors();

// ============================================================
//  ТЕКСТУРЫ — ТВОИ
// ============================================================
const loader = new THREE.TextureLoader();

const wallTexture  = loader.load('assets/dungeon_tiles/visual_dungeon/wall_5.png');
const floorTexture = loader.load('assets/dungeon_tiles/visual_dungeon/grotto_tiles_1.png');
// потолок
const ceilTexture  = loader.load('assets/assets2/dungeon_details/swamp_ceiling_dungeon_1.png');
// дверь
const doorTexture  = loader.load('assets/interface/labyrinth_asset.png');

// ============================================================
//  МАТЕРИАЛЫ
// ============================================================
const wallMat  = new THREE.MeshStandardMaterial({ map: wallTexture,  roughness:0.95, color:0x9a8a76 });
const floorMat = new THREE.MeshStandardMaterial({ map: floorTexture, roughness:1.0,  color:0x8a8070 });
const ceilMat  = new THREE.MeshStandardMaterial({ map: ceilTexture,  roughness:1.0,  color:0x6a6258, side: THREE.DoubleSide });
const doorMat  = new THREE.MeshStandardMaterial({ map: doorTexture, transparent:true, alphaTest:0.4, side:THREE.DoubleSide, roughness:0.8, metalness:0.1 });

// ВАЖНО: массив из 6 материалов для BoxGeometry
// порядок граней: +X, -X, +Y, -Y, +Z, -Z
// верхняя (+Y) = потолок, остальные = стена
const wallMatsArray = [wallMat, wallMat, ceilMat, wallMat, wallMat, wallMat];

const group = new THREE.Group();
scene.add(group);

const floorGeo = new THREE.PlaneGeometry(cellSize, cellSize);
const ceilGeo  = new THREE.PlaneGeometry(cellSize, cellSize);
const wallGeo  = new THREE.BoxGeometry(cellSize, wallHeight, cellSize);

const floorMeshes = [];
const wallMeshes  = [];
const doorLeaves  = [];

for (let row=0; row<size; row++){
  for (let col=0; col<size; col++){
    const x = col - Math.floor(size/2);
    const z = row - Math.floor(size/2);

    // ПОЛ — только под проходимыми клетками
    if (map[row][col] !== 1){
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI/2;
      floor.position.set(x, 0, z);
      floor.userData = { gridX: col, gridY: row, walkable: map[row][col] !== 1, isFloor: true };
      group.add(floor);
      floorMeshes.push(floor);
    }

    // СТЕНЫ — кубики, верхняя грань = потолок
    if (map[row][col] === 1){
      const wall = new THREE.Mesh(wallGeo, wallMatsArray);
      wall.position.set(x, wallHeight/2, z);
      wall.userData = { gridX: col, gridY: row, isWall: true };
      group.add(wall);
      wallMeshes.push(wall);
    } else if (map[row][col] === 2){
      // ДВЕРЬ — плоскость на всю клетку
      const horiz = map[row][col-1] === 1 && map[row][col+1] === 1;
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, wallHeight), doorMat);
      if (horiz) leaf.rotation.y = Math.PI/2;
      leaf.position.set(x, wallHeight/2, z);
      leaf.userData = { doorGX: col, doorGY: row, isDoor: true };
      group.add(leaf);
      doorLeaves.push({
        mesh: leaf, gx: col, gy: row,
        open: false, t: 0,
        closedY: wallHeight/2,
        openY: -wallHeight/2 - 0.1
      });
    }
  }
}

// ============================================================
//  ПОТОЛОК над проходимыми клетками
// ============================================================
for (let row=0; row<size; row++){
  for (let col=0; col<size; col++){
    if (map[row][col] === 1) continue;
    const x = col - Math.floor(size/2);
    const z = row - Math.floor(size/2);
    const ceil = new THREE.Mesh(ceilGeo, ceilMat);
    ceil.rotation.x = Math.PI/2;
    ceil.position.set(x, wallHeight, z);
    group.add(ceil);
  }
}

// ============================================================
//  ФАКТЕЛЫ
// ============================================================
const torches = [];
for (let row=0; row<size; row++){
  for (let col=0; col<size; col++){
    if (map[row][col] === 0 && row % 3 === 0 && col % 3 === 0){
      const x = col - Math.floor(size/2);
      const z = row - Math.floor(size/2);
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xffcc66 })
      );
      bulb.position.set(x, wallHeight - 0.15, z);
      group.add(bulb);
      const light = new THREE.PointLight(0xff8833, 0.9, 6, 2);
      light.position.set(x, wallHeight - 0.2, z);
      group.add(light);
      const flame = new THREE.Sprite(new THREE.SpriteMaterial({
        color:0xffaa44, transparent:true, opacity:0.9,
        blending:THREE.AdditiveBlending, depthWrite:false
      }));
      flame.scale.set(0.22, 0.34, 1);
      flame.position.copy(light.position);
      group.add(flame);
      torches.push({ light, flame, phase: Math.random()*Math.PI*2 });
    }
  }
}

// ============================================================
//  ИГРОК
// ============================================================
const startRoom = rooms[0] || { cx:1, cy:1 };
let playerGX = startRoom.cx;
let playerGY = startRoom.cy;
const playerPos = new THREE.Vector3(
  playerGX - Math.floor(size/2), 0,
  playerGY - Math.floor(size/2)
);
let playerYaw = 0;

const facingMarker = new THREE.Mesh(
  new THREE.ConeGeometry(0.16, 0.36, 4),
  new THREE.MeshBasicMaterial({ color: 0xc8a050 })
);
facingMarker.rotation.x = Math.PI/2;
group.add(facingMarker);

const hero = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.26, 0.35, 10),
  new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness:0.9 })
);
hero.position.set(playerPos.x, 0.175, playerPos.z);
group.add(hero);

const heroGlow = new THREE.PointLight(0xffb060, 0.6, 5, 2);
heroGlow.position.set(playerPos.x, 1.0, playerPos.z);
scene.add(heroGlow);

// ============================================================
//  ДВИЖЕНИЕ
// ============================================================
const MOVE_SPEED = 1.6;
const TURN_SPEED = 8.0;

let waypoints = [];
let moving = false;

function isWalkable(gx, gy){
  if (gx<0 || gy<0 || gx>=size || gy>=size) return false;
  const v = map[gy][gx];
  return v === 0 || v === 3;
}
function isClosedDoor(gx, gy){
  if (gx<0 || gy<0 || gx>=size || gy>=size) return false;
  return map[gy][gx] === 2;
}
function canStep(fromGX, fromGY, toGX, toGY){
  if (!isWalkable(toGX, toGY)) return false;
  const dx = toGX - fromGX;
  const dy = toGY - fromGY;
  if (dx !== 0 && dy !== 0){
    if (!isWalkable(fromGX + dx, fromGY)) return false;
    if (!isWalkable(fromGX, fromGY + dy)) return false;
  }
  return true;
}
function gridToWorld(gx, gy){
  return { x: gx - Math.floor(size/2), z: gy - Math.floor(size/2) };
}
function worldToGrid(wx, wz){
  return {
    gx: Math.round(wx + Math.floor(size/2)),
    gy: Math.round(wz + Math.floor(size/2))
  };
}
function buildPath(startGX, startGY, goalGX, goalGY){
  if (!isWalkable(goalGX, goalGY)) return [];
  const key = (x,y)=> y*size + x;
  const prev = new Map();
  const q = [{x:startGX, y:startGY}];
  prev.set(key(startGX,startGY), null);
  const dirs = [
    {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1},
    {x:1,y:1},{x:1,y:-1},{x:-1,y:1},{x:-1,y:-1}
  ];
  while (q.length){
    const cur = q.shift();
    if (cur.x === goalGX && cur.y === goalGY){
      const out = [];
      let k = key(cur.x, cur.y);
      while (k !== null){
        out.push({ gx: k % size, gy: Math.floor(k/size) });
        k = prev.get(k);
      }
      return out.reverse();
    }
    for (const d of dirs){
      const nx = cur.x+d.x, ny = cur.y+d.y;
      if (!canStep(cur.x, cur.y, nx, ny)) continue;
      const k = key(nx, ny);
      if (!prev.has(k)){
        prev.set(k, key(cur.x, cur.y));
        q.push({x:nx, y:ny});
      }
    }
  }
  return [];
}

function openDoor(gx, gy){
  if (!isClosedDoor(gx, gy)) return false;
  map[gy][gx] = 3;
  const d = doorLeaves.find(o => o.gx === gx && o.gy === gy);
  if (d && !d.open){ d.open = true; d.t = 0; }
  return true;
}
function findNearestWalkable(gx, gy, maxR = 4){
  if (isWalkable(gx, gy)) return { gx, gy };
  for (let r=1; r<=maxR; r++){
    for (let dy=-r; dy<=r; dy++){
      for (let dx=-r; dx<=r; dx++){
        if (Math.abs(dx) + Math.abs(dy) !== r) continue;
        const nx = gx + dx, ny = gy + dy;
        if (isWalkable(nx, ny)) return { gx: nx, gy: ny };
      }
    }
  }
  return null;
}

// ============================================================
//  ВРАГИ (простая реализация — стоят на местах, бой по подходу)
// ============================================================
var enemies = [];
for (var i=0; i<8; i++){
  var pos = pickFreeCell();
  if (!pos) continue;
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: loader.load('assets/assets2/mobs/dungeon_mobs/plague_crow.png'),
    transparent:true
  }));
  sprite.scale.set(1.2, 1.2, 1);
  var w = gridToWorld(pos.gx, pos.gy);
  sprite.position.set(w.x, 0.85, w.z);
  sprite.userData = { gx: pos.gx, gy: pos.gy, type: 'enemy' };
  group.add(sprite);
  enemies.push({
    mesh: sprite, gx: pos.gx, gy: pos.gy,
    hp: 1000 + Math.floor(Math.random()*1000),
    maxHp: 0, alive: true, attacking: false, stepTimer: 0
  });
  enemies[enemies.length-1].maxHp = enemies[enemies.length-1].hp;
}

// лут
var lootItems = [];
var lootTypes = [
  { type:'potion_hp',    img:'assets/assets2/game_details/resource_life_potion.png' },
  { type:'potion_mana',  img:'assets/assets2/game_details/potion_of_filth.png' },
  { type:'cauldron',     img:'assets/assets2/game_details/cauldron_first_dungeon.png' },
  { type:'altar',        img:'assets/assets2/game_details/altar_of_the_first_dungeon.png' }
];
for (var t=0; t<lootTypes.length; t++){
  for (var k=0; k<2; k++){
    var lp = pickFreeCell(); if (!lp) continue;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: loader.load(lootTypes[t].img), transparent:true
    }));
    sp.scale.set(0.5, 0.5, 1);
    var wp = gridToWorld(lp.gx, lp.gy);
    sp.position.set(wp.x, 0.35, wp.z);
    sp.userData = { gx: lp.gx, gy: lp.gy, type: lootTypes[t].type };
    group.add(sp);
    lootItems.push({ mesh: sp, gx: lp.gx, gy: lp.gy, type: lootTypes[t].type, collected: false });
  }
}

function pickFreeCell(){
  for (var a=0; a<120; a++){
    var x = 2 + Math.floor(Math.random()*(size-4));
    var y = 2 + Math.floor(Math.random()*(size-4));
    if (map[y][x] !== 0) continue;
    // не рядом с игроком
    if (Math.abs(x - playerGX) + Math.abs(y - playerGY) < 3) continue;
    var busy = false;
    for (var e of enemies) if (e.alive && Math.abs(e.gx-x)+Math.abs(e.gy-y)<2){ busy = true; break; }
    if (!busy) for (var l of lootItems) if (Math.abs(l.gx-x)+Math.abs(l.gy-y)<2){ busy = true; break; }
    if (!busy) return { gx: x, gy: y };
  }
  return null;
}

// ============================================================
//  КЛИК
// ============================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const targetEl = document.getElementById('target');

renderer.domElement.addEventListener('click', (e)=>{
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);

  // 1) дверь
  const doorHits = raycaster.intersectObjects(doorLeaves.map(d => d.mesh), false);
  if (doorHits.length){
    const ud = doorHits[0].object.userData;
    if (ud.isDoor && openDoor(ud.doorGX, ud.doorGY)) return;
  }

  // 2) враг
  const enemyMeshes = enemies.filter(x => x.alive).map(x => x.mesh);
  const enemyHits = raycaster.intersectObjects(enemyMeshes, false);
  if (enemyHits.length){
    const hit = enemyHits[0].object;
    const enemy = enemies.find(x => x.mesh === hit);
    if (enemy){
      // если уже в бою с ним — бьём
      if (isBattleActive && currentEnemy === enemy){
        attackEnemy();
      } else {
        // иначе идём к нему
        const cur = worldToGrid(playerPos.x, playerPos.z);
        const path = buildPath(cur.gx, cur.gy, enemy.gx, enemy.gy);
        if (path.length > 1){
          waypoints = path.slice(1).map(n => gridToWorld(n.gx, n.gy));
          moving = true;
          targetEl.style.left = e.clientX + 'px';
          targetEl.style.top  = e.clientY + 'px';
          targetEl.classList.add('on');
        }
      }
      return;
    }
  }

  // 3) лут
  const lootMeshes = lootItems.filter(x => !x.collected).map(x => x.mesh);
  const lootHits = raycaster.intersectObjects(lootMeshes, false);
  if (lootHits.length){
    const hit = lootHits[0].object;
    const item = lootItems.find(x => x.mesh === hit);
    if (item){
      const cur = worldToGrid(playerPos.x, playerPos.z);
      if (Math.abs(cur.gx - item.gx) + Math.abs(cur.gy - item.gy) <= 1){
        pickUpLoot(item);
      } else {
        const path = buildPath(cur.gx, cur.gy, item.gx, item.gy);
        if (path.length > 1){
          waypoints = path.slice(1).map(n => gridToWorld(n.gx, n.gy));
          moving = true;
          targetEl.style.left = e.clientX + 'px';
          targetEl.style.top  = e.clientY + 'px';
          targetEl.classList.add('on');
        }
      }
      return;
    }
  }

  // 4) пол
  const floorHits = raycaster.intersectObjects(floorMeshes, false);
  if (floorHits.length){
    const cell = floorHits[0].object.userData;
    if (cell.walkable){ goTo(cell.gridX, cell.gridY, e.clientX, e.clientY); return; }
  }

  // 5) стена — ближайший пол
  const wallHits = raycaster.intersectObjects(wallMeshes, false);
  if (wallHits.length){
    const cell = wallHits[0].object.userData;
    const near = findNearestWalkable(cell.gridX, cell.gridY, 4);
    if (near) goTo(near.gx, near.gy, e.clientX, e.clientY);
  }
});

function goTo(gridX, gridY, clientX, clientY){
  const start = worldToGrid(playerPos.x, playerPos.z);
  const path = buildPath(start.gx, start.gy, gridX, gridY);
  if (path.length < 2) return;
  waypoints = path.slice(1).map(n => gridToWorld(n.gx, n.gy));
  moving = true;
  if (clientX !== undefined){
    targetEl.style.left = clientX + 'px';
    targetEl.style.top  = clientY + 'px';
    targetEl.classList.add('on');
  }
}

// ============================================================
//  БОЙ
// ============================================================
var isBattleActive = false;
var currentEnemy = null;
var battleTimer = null;

function startBattle(enemy){
  if (isBattleActive) return;
  isBattleActive = true;
  currentEnemy = enemy;
  waypoints = []; moving = false; targetEl.classList.remove('on');
  document.getElementById('mob-hp').style.display = 'block';
  updateMobHpUi();
  playSound(soundHit);

  battleTimer = setInterval(function(){
    if (!isBattleActive || !currentEnemy) return;
    if (parent.Sherwood && parent.Sherwood.getPlayer){
      var p = parent.Sherwood.getPlayer();
      if (p){
        var dmg = Math.max(1, Math.floor(10 + Math.random()*15));
        p.stats.hp = Math.max(0, p.stats.hp - dmg);
        if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
      }
    }
  }, 1500);
}

function stopBattle(){
  isBattleActive = false;
  if (battleTimer){ clearInterval(battleTimer); battleTimer = null; }
  document.getElementById('mob-hp').style.display = 'none';
  currentEnemy = null;
}

function updateMobHpUi(){
  if (!currentEnemy) return;
  document.getElementById('mob-hp-text').textContent = 'HP: ' + currentEnemy.hp + '/' + currentEnemy.maxHp;
  document.getElementById('mob-hp-fill').style.clipPath = 'inset(0 ' + (100 - currentEnemy.hp/currentEnemy.maxHp*100) + '% 0 0)';
  var pos = currentEnemy.mesh.position.clone();
  pos.y += 0.6;
  pos.project(camera);
  var sx = (pos.x*0.5+0.5)*innerWidth;
  var sy = (-pos.y*0.5+0.5)*innerHeight;
  var el = document.getElementById('mob-hp');
  el.style.left = sx + 'px';
  el.style.top  = sy + 'px';
}

function attackEnemy(){
  if (!isBattleActive || !currentEnemy) return;
  var baseDmg = 80 + Math.floor(Math.random()*60);
  currentEnemy.hp = Math.max(0, currentEnemy.hp - baseDmg);
  playSound(soundHit);
  updateMobHpUi();
  if (currentEnemy.hp <= 0){
    playSound(soundVictory);
    currentEnemy.alive = false;
    group.remove(currentEnemy.mesh);
    stopBattle();
  }
}

document.getElementById('attack-icon').addEventListener('click', function(){
  if (isBattleActive) attackEnemy();
});

function pickUpLoot(item){
  if (!item || item.collected) return;
  item.collected = true;
  group.remove(item.mesh);
  if (parent.Sherwood && parent.Sherwood.getPlayer){
    var p = parent.Sherwood.getPlayer();
    if (p){
      if (item.type === 'potion_hp')   p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp + 50);
      if (item.type === 'potion_mana') p.stats.mana = Math.min(p.stats.maxMana || 100, (p.stats.mana||0) + 50);
      if (item.type === 'cauldron'){ p.stats.hp = Math.min(p.stats.maxHp, p.stats.hp+25); p.stats.mana = Math.min(p.stats.maxMana||100, (p.stats.mana||0)+25); }
      if (item.type === 'altar'){ p.stats.hp = p.stats.maxHp; p.stats.mana = p.stats.maxMana||100; }
      if (parent.UI && parent.UI.updateDisplay) parent.UI.updateDisplay();
    }
  }
}

// ============================================================
//  AI ВРАГОВ — медленно, шагами как в D1
// ============================================================
const ENEMY_SPEED = 0.55;
const ENEMY_AGGRO_RANGE = 6.0;
const ENEMY_STOP_DIST = 0.9;
const ENEMY_STEP_INTERVAL = 0.5;

function updateEnemies(dt){
  if (isBattleActive) return;
  for (const e of enemies){
    if (!e.alive || e.attacking) continue;
    const ex = e.mesh.position.x, ez = e.mesh.position.z;
    const dx = playerPos.x - ex, dz = playerPos.z - ez;
    const dist = Math.hypot(dx, dz);
    if (dist > ENEMY_AGGRO_RANGE){ e.stepTimer = 0; continue; }
    if (dist < ENEMY_STOP_DIST){ e.attacking = true; startBattle(e); return; }
    e.stepTimer += dt;
    if (e.stepTimer < ENEMY_STEP_INTERVAL) continue;
    e.stepTimer = 0;
    const step = ENEMY_SPEED * ENEMY_STEP_INTERVAL;
    const nx = ex + (dx/dist)*step;
    const nz = ez + (dz/dist)*step;
    const g = worldToGrid(nx, nz);
    if (isWalkable(g.gx, g.gy)){
      e.mesh.position.x = nx;
      e.mesh.position.z = nz;
      e.gx = g.gx; e.gy = g.gy;
    }
  }
}

// ============================================================
//  КАМЕРА — плавная
// ============================================================
const CAM_HEIGHT = 11.5;
const CAM_TILT   = 0.75;
const CAM_DEADZONE = 2.2;
const CAM_FOLLOW = 2.2;

const camFocus = new THREE.Vector3(playerPos.x, 0, playerPos.z);
const camPosSmooth  = new THREE.Vector3();
const camLookSmooth = new THREE.Vector3();
let camInitialized = false;

function updateCamera(dt){
  const tx = playerPos.x, tz = playerPos.z;
  const dx = tx - camFocus.x, dz = tz - camFocus.z;
  const dist = Math.hypot(dx, dz);

  if (dist > CAM_DEADZONE){
    const targetDist = dist - CAM_DEADZONE;
    const moveDist = Math.min(targetDist, CAM_FOLLOW * dt) * 0.7;
    const nx = dx / dist, nz = dz / dist;
    camFocus.x += nx * moveDist;
    camFocus.z += nz * moveDist;
  }

  const desiredPos = new THREE.Vector3(camFocus.x, CAM_HEIGHT, camFocus.z + CAM_TILT*CAM_HEIGHT*0.85);
  const lookAt = new THREE.Vector3(camFocus.x, 0, camFocus.z - 1.0);

  if (!camInitialized){
    camPosSmooth.copy(desiredPos);
    camLookSmooth.copy(lookAt);
    camInitialized = true;
  } else {
    const k = 1 - Math.pow(0.03, dt);
    camPosSmooth.lerp(desiredPos, k);
    camLookSmooth.lerp(lookAt, k);
  }
  camera.position.copy(camPosSmooth);
  camera.lookAt(camLookSmooth);
}

function syncPlayerGrid(){
  const g = worldToGrid(playerPos.x, playerPos.z);
  playerGX = g.gx;
  playerGY = g.gy;
}

// ============================================================
//  ЦИКЛ
// ============================================================
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.elapsedTime;

  if (moving && waypoints.length){
    let budget = MOVE_SPEED * dt;
    while (budget > 0 && waypoints.length){
      const tgt = waypoints[0];
      const dx = tgt.x - playerPos.x;
      const dz = tgt.z - playerPos.z;
      const dist = Math.hypot(dx, dz);
      if (dist <= budget){
        playerPos.x = tgt.x;
        playerPos.z = tgt.z;
        budget -= dist;
        waypoints.shift();
      } else {
        const nx = dx/dist, nz = dz/dist;
        playerPos.x += nx*budget;
        playerPos.z += nz*budget;
        budget = 0;
      }
    }
    if (!waypoints.length){
      moving = false;
      targetEl.classList.remove('on');
    }
    let lookX = playerPos.x, lookZ = playerPos.z;
    if (waypoints.length){ lookX = waypoints[0].x; lookZ = waypoints[0].z; }
    const ddx = lookX - playerPos.x;
    const ddz = lookZ - playerPos.z;
    if (ddx*ddx + ddz*ddz > 1e-6){
      const desiredYaw = Math.atan2(-ddx, -ddz);
      let dy = desiredYaw - playerYaw;
      while (dy >  Math.PI) dy -= Math.PI*2;
      while (dy < -Math.PI) dy += Math.PI*2;
      const maxStep = TURN_SPEED * dt;
      playerYaw += Math.max(-maxStep, Math.min(maxStep, dy));
    }
  }

  updateEnemies(dt);
  syncPlayerGrid();

  hero.position.set(playerPos.x, 0.175, playerPos.z);
  heroGlow.position.set(playerPos.x, 1.0, playerPos.z);
  heroGlow.intensity = 0.55 + Math.sin(t*3)*0.08;

  facingMarker.position.set(playerPos.x, 0.05, playerPos.z);
  facingMarker.rotation.set(Math.PI/2, -playerYaw, 0);

  for (const d of doorLeaves){
    if (d.open && d.t < 1){
      d.t += dt / 0.45;
      const k = Math.min(d.t, 1);
      const e = k*k*(3-2*k);
      d.mesh.position.y = d.closedY + (d.openY - d.closedY) * e;
      if (k >= 1) d.mesh.visible = false;
    }
  }

  updateCamera(dt);

  for (const tr of torches){
    const f = 0.75 + Math.sin(t*9 + tr.phase)*0.18 + Math.sin(t*23 + tr.phase*1.7)*0.07;
    tr.light.intensity = 1.0 * f + 0.35;
    tr.flame.material.opacity = 0.7 + f*0.25;
    const s = 0.18 + f*0.05;
    tr.flame.scale.set(s, s*1.5, 1);
  }

  if (isBattleActive) updateMobHpUi();

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
