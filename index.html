<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sherwood RPG</title>
    <link rel="icon" type="image/png" href="assets/interface/logo.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Georgia', serif;
            touch-action: manipulation;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100dvh;
        }
        
        .statue-left, .statue-right, .divider-left, .divider-right {
            display: none;
        }
        
        #game-container {
            width: 480px;
            height: 800px;
            position: relative;
            background: #0a0a0f;
            overflow: hidden;
            border: 1px solid #2a2a3e;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            z-index: 10;
            transform-origin: center center;
        }
        
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/backgrounds/homepage_screen.jpeg') center/cover no-repeat;
            z-index: 0;
        }
        
        .portal-video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            display: none;
        }
        
        .portal-video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .top-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 4px 0;
        }
        
        .top-resources-row, .top-stats-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        
        .top-row-buttons {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }
        
        .res-group {
            display: flex;
            align-items: center;
            position: relative;
        }
        
        .res-group img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-right: -3px;
        }
        
        .val-block {
            width: 90px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('assets/interface/all_stat.png') center/100% 100% no-repeat;
        }
        
        .val-block span {
            color: #fff;
            font-size: 1em;
            font-weight: bold;
        }
        
        .top-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 72px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .top-btn img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        
        .top-btn .label {
            width: 90px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('assets/interface/all_stat.png') center/100% 100% no-repeat;
            color: #ffa500;
            font-size: 11px;
            font-weight: bold;
            margin-top: -4px;
        }
        
        .arch-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 580px;
            background: url('assets/interface/staircase_with_an_arch.png') bottom center / 100% 100% no-repeat;
            z-index: 3;
            pointer-events: none;
        }
        
        .arch-layer::after {
            content: '';
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 51%;
            height: 65%;
            background: url('assets/backgrounds/homepage_screen.jpeg') center/cover no-repeat;
            border-radius: 50% 50% 0 0;
            z-index: -1;
        }
        
        .hero-layer {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 480px;
            z-index: 4;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            pointer-events: none;
        }
        
        .hero-layer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom center;
        }
        
        .side-btn {
            width: 72px;
            height: 72px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
        }
        
        .side-btn img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }
        
        .side-btn .label {
            width: 90px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('assets/interface/all_stat.png') center/100% 100% no-repeat;
            color: #ffa500;
            font-size: 12px;
            font-weight: bold;
            margin-top: -4px;
        }
        
        .left-buttons-column {
            position: absolute;
            bottom: 140px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        
        .right-buttons-column {
            position: absolute;
            bottom: 140px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 20;
        }
        
    .profile-action-btn {
    width: 140px;
    cursor: pointer;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.profile-action-btn img {
    width: 140px;
    height: 140px;
    object-fit: contain;
}

.profile-action-btn .action-label {
    width: 160px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url('assets/interface/all_stat.png') center/100% 100% no-repeat;
    color: #fff;
    font-size: 0.8em;
    font-weight: bold;
    text-shadow: 0 0 4px #000;
    margin-top: -4px;
}
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-screen .loading-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/backgrounds/loading_screen_with_logo.png') center/cover no-repeat;
        }
        
        .loading-screen .play-btn {
            position: relative;
            z-index: 1;
            background: transparent;
            border: none;
            cursor: pointer;
            width: 140px;
            height: 140px;
            margin-top: 120px;
        }
        
        .loading-screen .play-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .main-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: none;
        }
        
        .main-interface.active {
            display: block;
        }
        
        #screen-layer div::-webkit-scrollbar {
            display: none;
        }
        #screen-layer div {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        @media (min-width: 768px) {
            .statue-left {
                display: block;
                position: fixed;
                left: 0;
                top: 0;
                width: calc((100vw - 480px) / 2);
                height: 100%;
                background: url('assets/backgrounds/left_statue_of_the_main_screen.png') right/cover no-repeat;
                z-index: 9999;
                pointer-events: none;
            }
            .statue-right {
                display: block;
                position: fixed;
                right: 0;
                top: 0;
                width: calc((100vw - 480px) / 2);
                height: 100%;
                background: url('assets/backgrounds/right_statue_of_the_main_screen.png') left/cover no-repeat;
                z-index: 9999;
                pointer-events: none;
            }
            .divider-left {
                display: block;
                position: fixed;
                left: calc((100vw - 480px) / 2 - 80px);
                top: 0;
                width: 160px;
                height: 100vh;
                background: url('assets/interface/vertical_screen_divider.png') center/contain no-repeat;
                background-size: 100% 100%;
                z-index: 9999;
                pointer-events: none;
            }
            .divider-right {
                display: block;
                position: fixed;
                right: calc((100vw - 480px) / 2 - 80px);
                top: 0;
                width: 160px;
                height: 100vh;
                background: url('assets/interface/vertical_screen_divider.png') center/contain no-repeat;
                background-size: 100% 100%;
                z-index: 9999;
                pointer-events: none;
            }
        }
    </style>
</head>
<body>
    <div class="statue-left"></div>
    <div class="statue-right"></div>
    <div class="divider-left"></div>
    <div class="divider-right"></div>
    
    <div id="game-container">
        <div class="bg-layer"></div>
        <div class="portal-video-bg"><video src="assets/animation/animation_frame_hero.webm" autoplay muted playsinline loop></video></div>
        <div class="arch-layer"></div>
        <div class="hero-layer"><img src="assets/hero_skins/skin1_01.png" alt="Герой"></div>
        
        <div class="top-panel">
            <div class="top-resources-row">
                <div class="res-group"><img src="assets/interface/gold_plate.png"><div class="val-block"><span id="gold-display">0</span></div></div>
                <div class="res-group"><img src="assets/interface/level_hero.png"><span id="level-display" style="position:absolute;top:50%;left:28px;transform:translate(-50%,-50%);color:#fff;font-size:0.85em;font-weight:bold;">1</span><div class="val-block"><span id="exp-display">0%</span></div></div>
                <div class="res-group"><img src="assets/interface/silver_plaque.png"><div class="val-block"><span id="silver-display">0</span></div></div>
            </div>
            <div class="top-stats-row">
                <div class="res-group"><img src="assets/interface/icon_power.png"><div class="val-block"><span class="stat-value attack">0</span></div></div>
                <div class="res-group"><img src="assets/interface/icon_defense.png"><div class="val-block"><span class="stat-value defense">0</span></div></div>
                <div class="res-group"><img src="assets/interface/icon_health.png"><div class="val-block"><span class="stat-value hp">0</span></div></div>
            </div>
            <div class="top-row-buttons">
                <div class="top-btn" data-action="profile"><img src="assets/all_buttons/player_profile.png"><span class="label">Профиль</span></div>
                <div class="top-btn" data-action="hearth"><img src="assets/all_buttons/button_hearth.png"><span class="label">Очаг</span></div>
                <div class="top-btn" data-action="market"><img src="assets/all_buttons/sherwood_market.png"><span class="label">Рынок</span></div>
                <div class="top-btn" data-action="chat"><img src="assets/all_buttons/chat_button.png"><span class="label">Чат</span></div>
                <div class="top-btn" data-action="settings"><img src="assets/all_buttons/settings.png"><span class="label">Настройки</span></div>
            </div>
        </div>
        
        <div class="left-buttons-column">
            <div class="side-btn" data-action="quest"><img src="assets/all_buttons/home.png"><span class="label">Квест</span></div>
            <div class="side-btn" data-action="raid"><img src="assets/all_buttons/raid.png"><span class="label">Рейд</span></div>
            <div class="side-btn" data-action="arena"><img src="assets/all_buttons/arena.png"><span class="label">Арена</span></div>
            <div class="side-btn" data-action="portal"><img src="assets/all_buttons/portal.png"><span class="label">Порталы</span></div>
        </div>
        
        <div class="right-buttons-column">
            <div class="side-btn" data-action="tavern"><img src="assets/all_buttons/tavern.png"><span class="label">Таверна</span></div>
            <div class="side-btn" data-action="subway"><img src="assets/all_buttons/subway.png"><span class="label">Подземка</span></div>
            <div class="side-btn" data-action="daily"><img src="assets/all_buttons/daily_quests.png"><span class="label">Задания</span></div>
            <div class="side-btn" data-action="bag"><img src="assets/all_buttons/hero_bag.png"><span class="label">Сумка</span></div>
        </div>
        
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-bg"></div>
            <button class="play-btn" id="playBtn" onclick="document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('mainInterface').classList.add('active');try{SherwoodUI._playSound('click');SherwoodUI._playVideoBackground();}catch(e){}">
                <img src="assets/all_buttons/play.png" alt="Играть">
            </button>
        </div>
        
        <div class="main-interface" id="mainInterface"></div>
    </div>
    
    <script src="js/sherwood/core.js"></script>
    <script src="js/sherwood/models.js"></script>
    <script src="js/sherwood/dungeon.js"></script>
    <script src="js/sherwood/bag.js"></script>
    <script src="js/sherwood/combat.js"></script>
    <script src="js/sherwood/quests.js"></script>
    <script src="js/sherwood/tavern.js"></script>
    <script src="js/sherwood/portal.js"></script>
    <script src="js/sherwood/forge.js"></script>
    <script src="js/sherwood/raid.js"></script>
    <script src="js/sherwood/blackmarket.js"></script>
    <script src="js/sherwood/arena.js"></script>
    <script src="js/sherwood/chat.js"></script>
    <script src="js/sherwood/bestiary.js"></script>
    <script src="js/sherwood/daily.js"></script>
    <script src="js/sherwood/ui.js"></script>
    
    <script>
    (function() {
        var container = document.getElementById('game-container');
        if (!container) return;
        
        var GAME_WIDTH = 480;
        var GAME_HEIGHT = 800;
        
        function scaleGame() {
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            
            var scaleX = vw / GAME_WIDTH;
            var scaleY = vh / GAME_HEIGHT;
            var scale = Math.min(scaleX, scaleY);
            
            if (scale > 1) scale = 1;
            
            container.style.transform = 'scale(' + scale + ')';
            container.style.transformOrigin = 'top left';
            container.style.position = 'absolute';
            container.style.left = '0';
            container.style.top = '0';
            
            var scaledWidth = GAME_WIDTH * scale;
            var scaledHeight = GAME_HEIGHT * scale;
            
            var leftOffset = (vw - scaledWidth) / 2;
            var topOffset = (vh - scaledHeight) / 2;
            
            container.style.marginLeft = leftOffset + 'px';
            container.style.marginTop = topOffset + 'px';
        }
        
        scaleGame();
        window.addEventListener('resize', scaleGame);
        window.addEventListener('orientationchange', scaleGame);
        document.addEventListener('DOMContentLoaded', scaleGame);
    })();
    </script>
</body>
</html>
