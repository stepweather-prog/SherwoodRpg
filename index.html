<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SherwoodRpg</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loadingScreen">
    <img src="assets/assets2/backgrounds/loading_screen_with_logo.png" alt="Loading">
    <button id="playButton">
        <img src="assets/assets2/icons/play_button.png" alt="Play">
    </button>
</div>

<div id="homeScreen">
    <img id="leftStatue" src="assets/assets2/game_details/left_statue_of_the_main_screen.png" alt="Left Statue">
    
    <!-- Элементы карусели -->
<img id="sectionIcon" src="assets/assets2/icons/player_profile.png" alt="Section Icon" style="position:absolute; top:18%; left:50%; transform:translateX(-50%); width:110px; height:110px; object-fit:contain; z-index:5;">

<div id="sectionName" style="position:absolute; top:31%; left:50%; transform:translateX(-50%); width:250px; height:52px; background:url('assets/assets2/game_details/sections_menu.png') center/100% 100% no-repeat; display:flex; justify-content:center; align-items:center; color:#ffa500; font-size:1.2em; font-weight:bold; text-shadow:0 2px 4px #000; z-index:6;">
    Профиль
</div>

<img id="carouselLeftArrow" src="assets/assets2/icons/left.png" alt="Left" style="position:absolute; left:calc(50% - 165px); top:33.5%; transform:translateY(-50%); width:45px; height:45px; cursor:pointer; z-index:7;">
<img id="carouselRightArrow" src="assets/assets2/icons/right.png" alt="Right" style="position:absolute; right:calc(50% - 165px); top:33.5%; transform:translateY(-50%); width:45px; height:45px; cursor:pointer; z-index:7;"> 

        <div id="topBar">
            <div class="stat-box">
                <img src="assets/assets2/icons/progress.png" alt="Опыт" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="expVal">0</span>
                </div>
            </div>

            <div class="stat-box">
                <img src="assets/assets2/icons/power.png" alt="Урон" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="dmgVal">0</span>
                </div>
            </div>

            <div class="stat-box">
                <img src="assets/assets2/icons/armor.png" alt="Броня" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="armorVal">0</span>
                </div>
            </div>

            <div class="stat-box">
                <img src="assets/assets2/icons/life.png" alt="Жизнь" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="hpVal">0</span>
                </div>
            </div>

            <div class="stat-box">
                <img src="assets/assets2/icons/resource_gold.png" alt="Золото" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="goldVal">0</span>
                </div>
            </div>

            <div class="stat-box">
                <img src="assets/assets2/icons/resource_silver.png" alt="Серебро" class="icon">
                <div class="panel-bg">
                    <span class="stat-value" id="silverVal">0</span>
                </div>
            </div>
        </div>
    </div>
    
    <img id="rightStatue" src="assets/assets2/game_details/right_statue_of_the_main_screen.png" alt="Right Statue">
</div>

<div id="menuScreen" style="display:none;"></div>

<script src="js/sherwood/core.js"></script>
<script src="js/sherwood/models.js"></script>
<script src="js/sherwood/textures.js"></script>
<script src="js/sherwood/audio.js"></script>
<script src="js/sherwood/bag.js"></script>
<script src="js/sherwood/talents.js"></script>
<script src="js/sherwood/tavern.js"></script>
<script src="js/sherwood/portal.js"></script>
<script src="js/sherwood/bestiary.js"></script>
<script src="js/sherwood/dungeon.js"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="js/sherwood/Dungeon2D5.js"></script>
<script src="js/sherwood/daily.js"></script>
<script src="js/sherwood/quests.js"></script>
<script src="js/sherwood/raid.js"></script>
<script src="js/sherwood/blackmarket.js"></script>
<script src="js/sherwood/arena.js"></script>
<script src="js/sherwood/forge.js"></script>
<script src="js/sherwood/combat.js"></script>
<script src="js/sherwood/hearth.js"></script>
<script src="js/sherwood/menu.js"></script>
<script src="js/sherwood/main.js"></script>
</body>
</html>
