<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Sherwood RPG</title>
    <link rel="icon" type="image/png" href="assets/interface/logo.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0f; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: 'Georgia', serif; overflow-y: auto; overflow-x: hidden; position: relative; margin: 0; padding: 0; }
        .statue-left { position: fixed; left: 0; top: 0; width: calc((100vw - 480px) / 2); height: 100%; background: url('assets/backgrounds/left_statue_of_the_main_screen.png') right/cover no-repeat; z-index: 9999; pointer-events: none; }
        .statue-right { position: fixed; right: 0; top: 0; width: calc((100vw - 480px) / 2); height: 100%; background: url('assets/backgrounds/right_statue_of_the_main_screen.png') left/cover no-repeat; z-index: 9999; pointer-events: none; }
        .divider-left { position: fixed; left: calc((100vw - 480px) / 2 - 80px); top: 0; width: 160px; height: 100vh; background: url('assets/interface/vertical_screen_divider.png') center/contain no-repeat; background-size: 100% 100%; z-index: 9999; pointer-events: none; }
        .divider-right { position: fixed; right: calc((100vw - 480px) / 2 - 80px); top: 0; width: 160px; height: 100vh; background: url('assets/interface/vertical_screen_divider.png') center/contain no-repeat; background-size: 100% 100%; z-index: 9999; pointer-events: none; }
        #game-container { width: 100%; max-width: 480px; min-height: 100vh; position: relative; background: #0a0a0f; overflow: hidden; border: 1px solid #2a2a3e; box-shadow: 0 0 60px rgba(0,0,0,0.9); z-index: 10; margin: 0 auto; transform-origin: top center; }
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('assets/backgrounds/homepage_screen.jpeg') center/cover no-repeat; z-index: 0; }
        .top-panel { position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: transparent; padding: 2px 0; }
        .top-row-icons { display: flex; justify-content: center; gap: 4px; }
        .top-icon-block { display: flex; flex-direction: column; align-items: center; width: 56px; }
        .top-icon-block img { width: 56px; height: 56px; object-fit: contain; }
        .top-row-values { display: flex; justify-content: center; gap: 4px; margin-top: 2px; }
        .val-block { width: 90px; height: 32px; display: flex; align-items: center; justify-content: center; background: url('assets/interface/all_stat.png') center/100% 100% no-repeat; }
        .val-block span { color: #fff; font-size: 0.85em; font-weight: bold; text-shadow: 0 0 4px #000; }
        .top-row-stats { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
        .stat-btn { display: flex; flex-direction: column; align-items: center; width: 70px; }
        .stat-btn img { width: 42px; height: 42px; object-fit: contain; }
        .stat-btn .stat-panel { width: 90px; height: 32px; display: flex; align-items: center; justify-content: center; background: url('assets/interface/all_stat.png') center/100% 100% no-repeat; margin-top: -2px; }
        .stat-btn .stat-value { color: #fff; font-size: 0.85em; font-weight: bold; text-shadow: 0 0 4px #000; }
        .top-row-buttons { display: flex; justify-content: center; gap: 4px; margin-top: 6px; }
        .top-btn { display: flex; flex-direction: column; align-items: center; width: 56px; cursor: pointer; background: none; border: none; }
        .top-btn img { width: 56px; height: 56px; object-fit: contain; }
        .top-btn .label { color: #ffa500; font-size: 8px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 6px #000; text-align: center; margin-top: -2px; }
        .portal-video-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; pointer-events: none; }
        .portal-video-bg video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
        .arch-layer { position: absolute; bottom: 0; left: 0; right: 0; width: 100%; height: 580px; background: url('assets/interface/staircase_with_an_arch.png') bottom center / 100% 100% no-repeat; z-index: 3; pointer-events: none; }
        .arch-layer::after { content: ''; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 51%; height: 65%; background: url('assets/backgrounds/homepage_screen.jpeg') center/cover no-repeat; border-radius: 50% 50% 0 0; z-index: -1; }
        .hero-layer { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); width: 220px; height: 400px; z-index: 4; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
        .hero-layer img { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.7)); }
        .side-btn { width: 56px; height: 56px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; position: relative; z-index: 21; }
        .side-btn img { width: 56px; height: 56px; object-fit: contain; }
        .side-btn .label { color: #ffa500; font-size: 8px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 6px #000; text-align: center; margin-top: -2px; }
        .left-buttons-column { position: absolute; bottom: 232px; left: 52px; display: flex; flex-direction: column; gap: 4px; z-index: 20; pointer-events: auto; }
        .right-buttons-column { position: absolute; bottom: 232px; right: 52px; display: flex; flex-direction: column; gap: 4px; z-index: 20; pointer-events: auto; }
        .top-buttons-row, .bottom-buttons-row, .left-buttons-column, .right-buttons-column { z-index: 25 !important; pointer-events: auto !important; }
        .loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; pointer-events: all; }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
        .loading-screen .loading-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('assets/backgrounds/loading_screen_with_logo.png') center/cover no-repeat; z-index: 0; pointer-events: none; }
        .loading-screen .play-btn { position: relative; z-index: 1; background: transparent; border: none; cursor: pointer; transition: 0.2s; width: 140px; height: 140px; margin-top: 120px; }
        .loading-screen .play-btn img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 30px rgba(201,168,76,0.3)); }
        .loading-screen .play-btn:hover { transform: scale(1.05); }
        .loading-screen .play-btn:active { transform: scale(0.95); }
        .main-interface { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; pointer-events: none; }
        .main-interface.active { display: block; pointer-events: none; }.main-interface.active > * { pointer-events: auto; }
        @keyframes epicShockwave { 0%{transform:rotate(0deg);filter:brightness(1) blur(0px) saturate(1);} 15%{transform:rotate(-1.5deg);filter:brightness(1.6) saturate(1.8) blur(1px);} 45%{transform:rotate(0.8deg);filter:brightness(1) saturate(1) blur(3px);} 75%{transform:rotate(-0.3deg);filter:blur(1px);} 100%{transform:rotate(0deg);filter:brightness(1) blur(0px) saturate(1);} }
        @media (max-width: 480px) { .statue-left, .statue-right, .divider-left, .divider-right { display: none; } .loading-screen .play-btn { width: 100px; height: 100px; margin-top: 80px; } }
    </style>
</head>
<body>
    <div class="statue-left"></div><div class="statue-right"></div><div class="divider-left"></div><div class="divider-right"></div>
    <div id="game-container">
        <div class="bg-layer"></div>
        <div class="portal-video-bg"><video src="assets/animation/animation_frame_hero.webm" autoplay muted playsinline loop></video></div>
        <div class="arch-layer"></div>
        <div class="hero-layer"><img src="assets/hero_skins/skin1_01.png" alt="Герой"></div>
        <div class="top-panel">
            <div class="top-row-icons">
                <div class="top-icon-block"><img src="assets/interface/gold_plate.png"></div>
                <div class="top-icon-block"><img src="assets/interface/level_hero.png"></div>
                <div class="top-icon-block"><img src="assets/interface/silver_plaque.png"></div>
            </div>
            <div class="top-row-values">
                <div class="val-block"><span id="gold-display">0</span></div>
                <div class="val-block"><span id="level-display">1</span></div>
                <div class="val-block"><span id="silver-display">0</span></div>
            </div>
            <div class="top-row-stats">
                <div class="stat-btn"><img src="assets/interface/icon_power.png"><div class="stat-panel"><span class="stat-value attack">0</span></div></div>
                <div class="stat-btn"><img src="assets/interface/icon_defense.png"><div class="stat-panel"><span class="stat-value defense">0</span></div></div>
                <div class="stat-btn"><img src="assets/interface/icon_health.png"><div class="stat-panel"><span class="stat-value hp">0</span></div></div>
            </div>
            <div class="top-row-buttons">
                <div class="top-btn" data-action="profile"><img src="assets/all_buttons/player_profile.png"><span class="label">Профиль</span></div>
                <div class="top-btn" data-action="hearth"><img src="assets/all_buttons/button_hearth.png"><span class="label">Очаг</span></div>
                <div class="top-btn" data-action="talents"><img src="assets/all_buttons/ranger_skills_button.png"><span class="label">Таланты</span></div>
                <div class="top-btn" data-action="market"><img src="assets/all_buttons/sherwood_market.png"><span class="label">Рынок</span></div>
                <div class="top-btn" data-action="chat"><img src="assets/all_buttons/chat_button.png"><span class="label">Чат</span></div>
                <div class="top-btn" data-action="settings"><img src="assets/all_buttons/settings.png"><span class="label">Настройки</span></div>
            </div>
        </div>
        <div class="left-buttons-column">
            <div class="side-btn" data-action="quest"><img src="assets/all_buttons/home.png"><span class="label">Квест</span></div>
            <div class="side-btn" data-action="raid"><img src="assets/all_buttons/raid.png"><span class="label">Рейд</span></div>
            <div class="side-btn" data-action="arena"><img src="assets/all_buttons/arena.png"><span class="label">Арена</span></div>
            <div class="side-btn" data-action="portal"><img src="assets/all_buttons/portal.png"><span class="label">Порталы</span></div>
        </div>
        <div class="right-buttons-column">
            <div class="side-btn" data-action="tavern"><img src="assets/all_buttons/tavern.png"><span class="label">Таверна</span></div>
            <div class="side-btn" data-action="subway"><img src="assets/all_buttons/subway.png"><span class="label">Подземка</span></div>
            <div class="side-btn" data-action="daily"><img src="assets/all_buttons/daily_quests.png"><span class="label">Задания</span></div>
            <div class="side-btn" data-action="bag"><img src="assets/all_buttons/hero_bag.png"><span class="label">Сумка</span></div>
        </div>
        <div class="loading-screen" id="loadingScreen"><div class="loading-bg"></div><button class="play-btn" id="playBtn" onclick="document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('mainInterface').classList.add('active');try{SherwoodUI._playSound('click');}catch(e){}"><img src="assets/all_buttons/play.png" alt="Играть"></button></div>
        <div class="main-interface" id="mainInterface"></div>
    </div>
    <script src="js/sherwood/core.js"></script>
    <script src="js/sherwood/models.js"></script>
    <script src="js/sherwood/dungeon.js"></script>
    <script src="js/sherwood/bag.js"></script>
    <script src="js/sherwood/combat.js"></script>
    <script src="js/sherwood/quests.js"></script>
    <script src="js/sherwood/tavern.js"></script>
    <script src="js/sherwood/portal.js"></script>
    <script src="js/sherwood/forge.js"></script>
    <script src="js/sherwood/raid.js"></script>
    <script src="js/sherwood/blackmarket.js"></script>
    <script src="js/sherwood/arena.js"></script>
    <script src="js/sherwood/chat.js"></script>
    <script src="js/sherwood/bestiary.js"></script>
    <script src="js/sherwood/daily.js"></script>
    <script src="js/sherwood/ui.js"></script>
</body>
</html>
