<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SherwoodRpg</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loadingScreen">
    <img src="assets/assets2/backgrounds/loading_screen_with_logo.png" alt="Loading">
    <button id="playButton">
        <img src="assets/assets2/icons/play_button.png" alt="Play">
    </button>
</div>

<div id="homeScreen">
    <!-- Левая статуя за пределами игровой зоны -->
    <img id="leftStatue" src="assets/assets2/game_details/left_statue_of_the_main_screen.png" alt="Left Statue">
    
    <!-- ЦЕНТРАЛЬНАЯ ИГРОВАЯ ЗОНА -->
    <div id="gameZone">
        <!-- Фоны и декорации -->
        <img id="arch" src="assets/assets2/game_details/staircase_with_an_arch.png" alt="Arch">
        <img id="leftDivider" src="assets/assets2/game_details/left_divider.png" alt="Left Divider">
        <img id="rightDivider" src="assets/assets2/game_details/divider_right.png" alt="Right Divider">
        
        <!-- Главный герой -->
        <img id="hero" src="assets/hero_skins/skin1_01.png" alt="Hero">

        <!-- Элементы карусели меню -->
        <img id="sectionIcon" src="assets/assets2/icons/player_profile.png" alt="Section Icon">
        <div id="sectionName">Профиль</div>
        <img id="carouselLeftArrow" src="assets/assets2/icons/left.png" alt="Left">
        <img id="carouselRightArrow" src="assets/assets2/icons/right.png" alt="Right">

        <!-- Верхняя панель характеристик -->
        <div id="topBar">
            <!-- Первый ряд: строго все иконки -->
            <div class="icons-row">
                <img src="assets/assets2/icons/progress.png" alt="Опыт" class="icon">
                <img src="assets/assets2/icons/power.png" alt="Урон" class="icon">
                <img src="assets/assets2/icons/armor.png" alt="Броня" class="icon">
                <img src="assets/assets2/icons/life.png" alt="Жизнь" class="icon">
                <img src="assets/assets2/icons/resource_gold.png" alt="Золото" class="icon">
                <img src="assets/assets2/icons/resource_silver.png" alt="Серебро" class="icon">
            </div>

            <!-- Второй ряд: строго все плашки под ними -->
            <div class="panels-row">
                <div class="panel-bg"><span class="stat-value" id="expVal">0</span></div>
                <div class="panel-bg"><span class="stat-value" id="dmgVal">0</span></div>
                <div class="panel-bg"><span class="stat-value" id="armorVal">0</span></div>
                <div class="panel-bg"><span class="stat-value" id="hpVal">0</span></div>
                <div class="panel-bg"><span class="stat-value" id="goldVal">0</span></div>
                <div class="panel-bg"><span class="stat-value" id="silverVal">0</span></div>
            </div>
        </div>
    </div> <!-- Конец #gameZone -->
    
    <!-- Правая статуя за пределами игровой зоны -->
    <img id="rightStatue" src="assets/assets2/game_details/right_statue_of_the_main_screen.png" alt="Right Statue">
</div>

<div id="menuScreen" style="display:none;"></div>

<!-- Скрипты (Вернули на место!) -->
<script src="js/sherwood/core.js"></script>
<script src="js/sherwood/models.js"></script>
<script src="js/sherwood/textures.js"></script>
<script src="js/sherwood/audio.js"></script>
<script src="js/sherwood/bag.js"></script>
<script src="js/sherwood/talents.js"></script>
<script src="js/sherwood/tavern.js"></script>
<script src="js/sherwood/portal.js"></script>
<script src="js/sherwood/bestiary.js"></script>
<script src="js/sherwood/dungeon.js"></script>
<script src="https://unpkg.com"></script>
<script src="js/sherwood/Dungeon2D5.js"></script>
<script src="js/sherwood/daily.js"></script>
<script src="js/sherwood/quests.js"></script>
<script src="js/sherwood/raid.js"></script>
<script src="js/sherwood/blackmarket.js"></script>
<script src="js/sherwood/forge.js"></script>
<script src="js/sherwood/combat.js"></script>
<script src="js/sherwood/hearth.js"></script>
<script src="js/sherwood/main.js"></script>
</body>
</html>
