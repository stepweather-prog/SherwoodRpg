<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SherwoodRpg</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>



<div id="homeScreen">
    <!-- Левая статуя за пределами игровой зоны -->
    <img id="leftStatue" src="assets/assets2/game_details/left_statue_of_the_main_screen.png" alt="Left Statue">
    
    <!-- Левый разделитель — между статуей и gameZone -->
    <img id="leftDivider" src="assets/assets2/game_details/left_divider.png" alt="Left Divider">
    
    <!-- ЦЕНТРАЛЬНАЯ ИГРОВАЯ ЗОНА -->
    <div id="gameZone">
        <div id="loadingScreen" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:2000;">
        <img src="assets/assets2/backgrounds/loading_screen_with_logo.png" alt="Loading" style="width:100%;height:100%;object-fit:cover;">
        
    </div>
        <!-- Фоны и декорации -->
        <img id="substrate" src="assets/assets2/Sherwood_Square/substrate.png" alt="Substrate">
        <img id="arch" src="assets/assets2/game_details/staircase_with_an_arch.png" alt="Arch">
        
        <!-- Главный герой -->
        <img id="hero" src="assets/hero_skins/skin1_01.png" alt="Hero">

        <!-- Элементы карусели меню -->
        <img id="sectionIcon" src="assets/assets2/icons/player_profile.png" alt="Section Icon">
        <div id="sectionName">Профиль</div>
        <img id="carouselLeftArrow" src="assets/assets2/icons/left.png" alt="Left">
        <img id="carouselRightArrow" src="assets/assets2/icons/right.png" alt="Right">

        <!-- Верхняя панель характеристик -->
        <div id="topBar">
            <div class="main-stone-panel"></div>

            <!-- Иконки (Ряд 1) -->
            <img src="assets/assets2/icons/progress.png" alt="Опыт" class="top-icon cell-1">
            <img src="assets/assets2/icons/power.png" alt="Урон" class="top-icon cell-2">
            <img src="assets/assets2/icons/armor.png" alt="Броня" class="top-icon cell-3">
            <img src="assets/assets2/icons/life.png" alt="Жизнь" class="top-icon cell-4">
            <img src="assets/assets2/icons/resource_gold.png" alt="Золото" class="top-icon cell-5">
            <img src="assets/assets2/icons/resource_silver.png" alt="Серебро" class="top-icon cell-6">

            <!-- Цифры (Ряд 2) -->
            <span class="stat-value val-1" id="expVal">0</span>
            <span class="stat-value val-2" id="dmgVal">0</span>
            <span class="stat-value val-3" id="armorVal">0</span>
            <span class="stat-value val-4" id="hpVal">0</span>
            <span class="stat-value val-5" id="goldVal">0</span>
            <span class="stat-value val-6" id="silverVal">0</span>
        </div>
    </div> <!-- Конец #gameZone -->
    
    <!-- Правый разделитель — между gameZone и статуей -->
    <img id="rightDivider" src="assets/assets2/game_details/divider_right.png" alt="Right Divider">
    
    <!-- Правая статуя за пределами игровой зоны -->
    <img id="rightStatue" src="assets/assets2/game_details/right_statue_of_the_main_screen.png" alt="Right Statue">
</div>

<div id="menuScreen" style="display:none;"></div>

<!-- ========== СКРИПТЫ ========== -->

<!-- 0. СОЗДАЁМ ОБЪЕКТ Sherwood -->
<script>
    if (typeof Sherwood === 'undefined') {
        window.Sherwood = {};
    }
</script>

<!-- 1. Модели и ядро -->
<script src="js/sherwood/models.js"></script>
<script src="js/sherwood/core.js"></script>

<!-- 2. Базовые системы -->
<script src="js/sherwood/audio.js"></script>
<script src="js/sherwood/bag.js"></script>
<script src="js/sherwood/talents.js"></script>
<script src="js/sherwood/settings.js"></script>

<!-- 3. Игровые режимы -->
<script src="js/sherwood/quests.js"></script>
<script src="js/sherwood/tavern.js"></script>
<script src="js/sherwood/dungeon.js"></script>

<!-- THREE.JS для 3D подземки (локально) -->
<script src="js/sherwood/three.min.js"></script>

<script src="js/sherwood/Dungeon2D5.js"></script>
<script src="js/sherwood/portal.js"></script>
<script src="js/sherwood/raid.js"></script>

<!-- 4. Дополнительные системы -->
<script src="js/sherwood/bestiary.js"></script>
<script src="js/sherwood/blackmarket.js"></script>
<script src="js/sherwood/forge.js"></script>
<script src="js/sherwood/combat.js"></script>
<script src="js/sherwood/hearth.js"></script>



<!-- 5. UI (ОБЯЗАТЕЛЬНО ПОСЛЕ ВСЕХ МОДУЛЕЙ, ДО main.js) -->

<script src="js/sherwood/ui_screens.js"></script>

<!-- 6. Главный файл -->
<script src="js/sherwood/main.js"></script>

</body>
</html>
