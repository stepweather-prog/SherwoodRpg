<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рейдовый коридор</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; }

        #raid-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #ff6b35; font: 18px "Times New Roman", serif; background: rgba(0, 0, 0, 0.7); padding: 6px 20px; border: 2px solid #6b5a3a; border-radius: 4px; text-align: center; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px #000; }
        #raid-title .enemy-name { display: block; color: #fff; font-size: 16px; margin-top: 4px; }

        #mob-hp { position: absolute; width: 300px; height: 200px; z-index: 50; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mob-hp .frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: fill; z-index: 2; }
        #mob-hp .fill { position: absolute; top: 45%; left: 10%; width: 80%; height: 12%; object-fit: cover; clip-path: inset(0 50% 0 0); z-index: 1; }
        #mob-hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 20px; font-weight: bold; z-index: 3; text-shadow: 0 0 6px #000, 0 2px 6px #000; }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hit-effect { position: absolute; display: none; pointer-events: none; z-index: 60; transform: translate(-50%, -50%); }
        #hit-effect-img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.6)); }

        #joystick { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 160px; height: 160px; z-index: 30; pointer-events: auto; }
        .arrow-btn { position: absolute; width: 50px; height: 50px; background: rgba(10, 8, 5, 0.9); border: 2px solid #6b5a3a; border-radius: 50%; color: #c8a050; font-size: 22px; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        #btn-forward { top: 0; left: 55px; }
        #btn-left { top: 55px; left: 0; }
        #btn-right { top: 55px; left: 110px; }
        #btn-back { top: 110px; left: 55px; }
        #attack-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; z-index: 40; cursor: pointer; pointer-events: auto; }

        #skills-left, #skills-right { pointer-events: auto; }
        #skills-left img, #skills-right img { cursor: pointer; border-radius: 6px; transition: all 0.2s; border: 2px solid rgba(200, 160, 80, 0.7); background: rgba(0, 0, 0, 0.5); padding: 2px; }
        #skills-left img:hover, #skills-right img:hover { filter: drop-shadow(0 0 10px #ffd700); transform: scale(1.1); }
        #skills-left img.on-cooldown, #skills-right img.on-cooldown { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        @media (max-width: 600px) {
            #raid-title { top: 8px !important; font-size: 14px !important; padding: 4px 12px !important; max-width: 92% !important; }
            #raid-title .enemy-name { font-size: 13px !important; margin-top: 2px !important; }
            button[onclick*="dungeonMusic"] { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #mob-hp { width: 220px !important; height: 150px !important; }
            #mob-hp-text { font-size: 15px !important; }
            #joystick { bottom: 20px !important; width: 120px !important; height: 120px !important; }
            .arrow-btn { width: 38px !important; height: 38px !important; font-size: 17px !important; }
            #btn-forward { top: 0 !important; left: 41px !important; }
            #btn-left    { top: 41px !important; left: 0 !important; }
            #btn-right   { top: 41px !important; left: 82px !important; }
            #btn-back    { top: 82px !important; left: 41px !important; }
            #attack-icon { width: 38px !important; height: 38px !important; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #skills-left, #skills-right { bottom: 110px !important; width: 80px !important; }
            #skills-left img, #skills-right img { width: 38px !important; height: 38px !important; }
            #hit-effect-img { width: 130px !important; height: 130px !important; }
        }
    </style>
</head>
<body>
    <div id="raid-title">
        <span id="boss-name">Изначальный Ужас — Спящий в Корнях</span>
        <span class="enemy-name" id="enemy-name">Изначальный Ужас</span>
    </div>

    <div id="mob-hp">
        <img class="frame" src="assets/assets2/game_details/life_of_mobs.png" alt="">
        <img id="mob-hp-fill" class="fill" src="assets/assets2/game_details/mob_life_filling.png" alt="">
        <span id="mob-hp-text">HP: 1000/1000</span>
    </div>

    <div id="hit-effect"><img id="hit-effect-img" src="" alt=""></div>

    <div id="skills-left" style="position:absolute; bottom:130px; left:10px; width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:45;"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>

    <div id="skills-right" style="position:absolute; bottom:130px; right:10px; width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:45;"></div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">1000</span>
    </div>

    <div id="joystick">
        <div class="arrow-btn" id="btn-forward">▲</div>
        <div class="arrow-btn" id="btn-left">◀</div>
        <div class="arrow-btn" id="btn-right">▶</div>
        <div class="arrow-btn" id="btn-back">▼</div>
        <div id="attack-icon"><img src="assets/assets2/talents/simple_attack.png" style="width:90%;height:90%;object-fit:contain;"></div>
    </div>

    <button onclick="dungeonMusic.pause(); parent.Sherwood.Raid._raidFlee()" style="position:fixed;top:10px;left:10px;z-index:100;background:rgba(0,0,0,0.8);border:2px solid #6b5a3a;border-radius:4px;padding:8px 16px;color:#c8a050;font-size:16px;font-weight:bold;">←</button>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        var soundHit = new Audio('assets/assets2/tune/hit.wav');
        var soundVictory = new Audio('assets/assets2/tune/victory.wav');
        var soundDefeat = new Audio('assets/assets2/tune/defeat.wav');
        var soundSteps = new Audio('assets/assets2/tune/steps.wav');
        var dungeonMusic = new Audio('assets/assets2/music/dungeon_3.ogg');
        dungeonMusic.loop = true;
        dungeonMusic.volume = 0.4;

        setTimeout(function() { dungeonMusic.play().catch(function() {}); }, 500);

        function playSound(audio) { try { audio.currentTime = 0; audio.play().catch(function() {}); } catch(e) {} }
        window.soundHit = soundHit;
        window.soundVictory = soundVictory;
        window.soundDefeat = soundDefeat;
        window.soundSteps = soundSteps;
        window.dungeonMusic = dungeonMusic;
        window.playSound = playSound;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e0a06);
        scene.fog = new THREE.Fog(0x0e0a06, 4, 10);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 25);
        camera.position.set(0, 0.8, 2.5);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x0e0a06, 1);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x887766, 1.0));
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(5, 10, 5);
        scene.add(mainLight);

        const floorTex = new THREE.TextureLoader().load('assets/assets2/Sherwood_Square/floors_raid.png');
        const wallTex = new THREE.TextureLoader().load('assets/assets2/Sherwood_Square/walls_raid.png');
        const ceilTex = new THREE.TextureLoader().load('assets/assets2/Sherwood_Square/ceiling_raid.png');

        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 });
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8 });
        const ceilMat = new THREE.MeshStandardMaterial({ map: ceilTex, roughness: 0.9 });

        const corridorWidth = 1;
        const corridorLength = 5;
        const wallHeight = 1.1;

        for (let z = 0; z < corridorLength; z++) {
            const floorTile = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), floorMat);
            floorTile.rotation.x = -Math.PI / 2;
            floorTile.position.set(0, 0, z - corridorLength / 2 + 0.5);
            scene.add(floorTile);

            const ceilTile = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), ceilMat);
            ceilTile.rotation.x = Math.PI / 2;
            ceilTile.position.set(0, wallHeight, z - corridorLength / 2 + 0.5);
            scene.add(ceilTile);
        }

        for (let z = 0; z < corridorLength; z++) {
            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, wallHeight, 1), wallMat);
            wallLeft.position.set(-0.6, wallHeight / 2, z - corridorLength / 2 + 0.5);
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, wallHeight, 1), wallMat);
            wallRight.position.set(0.6, wallHeight / 2, z - corridorLength / 2 + 0.5);
            scene.add(wallRight);
        }

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(1, wallHeight, 0.2), wallMat);
        backWall.position.set(0, wallHeight / 2, -corridorLength / 2);
        scene.add(backWall);

        const frontWall = new THREE.Mesh(new THREE.BoxGeometry(1, wallHeight, 0.2), wallMat);
        frontWall.position.set(0, wallHeight / 2, corridorLength / 2);
        scene.add(frontWall);

        var enemySprite = null;
        var enemyData = parent.Sherwood.Raid.getCurrentEnemy();
        var bossData = parent.Sherwood.Raid._raidBoss;
        var isBattleActive = false;
        var enemyHp = 1000;
        var enemyMaxHp = 1000;
        var pushTimer = null;

        var enemyPos = new THREE.Vector3(0, 0, -1.5);
        var enemyBaseY = 0.55;
        var enemyKnockback = { active: false, t: 0, duration: 0.25, ox: 0, oz: 0, dz: 0 };
        var cameraShake = 0;

        if (bossData) {
            document.getElementById('boss-name').textContent = bossData.name;
        }

        var RAID_BEAST_DIRS = [
            'assets/assets2/mobs/raid_mobs/',
            'assets/assets2/mobs/portal_mobs/',
            'assets/all_beasts/',
            'assets/beast_quest/',
            'assets/assets2/mobs/dungeon_mobs/'
        ];

        function loadRaidEnemyTexture(imageName, onLoaded) {
            var idx = 0;
            function tryNext() {
                if (idx >= RAID_BEAST_DIRS.length) {
                    if (onLoaded) onLoaded(null);
                    return;
                }
                var url = RAID_BEAST_DIRS[idx] + imageName;
                idx++;
                var tex = new THREE.TextureLoader().load(url,
                    function(t) {
                        t.minFilter = THREE.LinearFilter;
                        t.magFilter = THREE.LinearFilter;
                        if (onLoaded) onLoaded(t);
                    },
                    undefined,
                    function() { tryNext(); }
                );
            }
            tryNext();
        }

        // === ОБНОВЛЕНИЕ ВРАГА — эта функция вызывается И снаружи (parent) ===
        function updateEnemy() {
            enemyData = parent.Sherwood.Raid.getCurrentEnemy();
            if (!enemyData) return;

            document.getElementById('enemy-name').textContent = enemyData.name;
            if (enemySprite) {
                scene.remove(enemySprite);
                enemySprite = null;
            }

            var isBoss = !!enemyData.isRaidBoss || !!enemyData.isBoss;
            var scale = isBoss ? 1.5 : 1.05;

            loadRaidEnemyTexture(enemyData.image, function(tex) {
                if (!tex) return;
                enemySprite = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: tex, transparent: true, alphaTest: 0.05
                }));
                enemySprite.scale.set(scale, scale, 1);
                enemyBaseY = scale / 2;
                enemySprite.position.set(enemyPos.x, enemyBaseY, enemyPos.z);
                scene.add(enemySprite);
            });

            enemyHp = enemyData.hp;
            enemyMaxHp = enemyData.maxHp;
            updateMobHpBarFill(enemyHp, enemyMaxHp);
            isBattleActive = true;
        }

        // === ЭКСПОРТ В WINDOW, чтобы parent.Sherwood.Raid._onRaidWin мог вызвать ===
        window.updateEnemy = updateEnemy;

        updateEnemy();

        var bloodSprites = [
            'assets/assets2/animation/blood_1.png',
            'assets/assets2/animation/blood_2.png',
            'assets/assets2/animation/blood_3.png',
            'assets/assets2/animation/blood_4.png',
            'assets/assets2/animation/blood_5.png'
        ];
        var bloodTextures = bloodSprites.map(function(path) { return new THREE.TextureLoader().load(path); });

        var hitFlashSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: bloodTextures[0], transparent: true, opacity: 0.85, depthTest: false, depthWrite: false
        }));
        hitFlashSprite.scale.set(0.4, 0.4, 1);
        hitFlashSprite.visible = false;
        scene.add(hitFlashSprite);

        document.getElementById('mob-hp').style.display = 'none';

        function updateHeroSpheres() {
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            var hpPercent = p.stats.hp / p.stats.maxHp;
            var lifeFill = document.getElementById('life-fill');
            if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPercent) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text');
            if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);

            var mana = p.stats.mana || 0;
            var maxMana = p.stats.maxMana || 100;
            var manaPercent = mana / maxMana;
            var manaFill = document.getElementById('mana-fill');
            if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - manaPercent) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text');
            if (manaText) manaText.textContent = 'MP: ' + Math.floor(mana);
        }
        setTimeout(updateHeroSpheres, 500);

        let yaw = 0;
        const rotationSpeed = Math.PI / 2;
        let isMoving = false;
        let isTurning = false;

        function updateCamera() {
            const euler = new THREE.Euler(0, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function animateStep(targetX, targetZ) {
            const startX = camera.position.x;
            const startZ = camera.position.z;
            const startY = camera.position.y;
            const duration = 800;
            const startTime = performance.now();
            playSound(soundSteps);
            function stepLoop() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const smoothT = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                camera.position.x = startX + (targetX - startX) * smoothT;
                camera.position.z = startZ + (targetZ - startZ) * smoothT;
                camera.position.y = startY + Math.sin(t * Math.PI) * 0.015;
                if (t < 1) { requestAnimationFrame(stepLoop); }
                else {
                    camera.position.x = targetX;
                    camera.position.z = targetZ;
                    camera.position.y = startY;
                    isMoving = false;
                    try { soundSteps.pause(); soundSteps.currentTime = 0; } catch(e) {}
                    checkEnemy();
                }
            }
            stepLoop();
        }

        function animateTurn(targetYaw) {
            const startYaw = yaw;
            const duration = 500;
            const startTime = performance.now();
            isTurning = true;
            function turnLoop() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const smoothT = t * t * (3 - 2 * t);
                yaw = startYaw + (targetYaw - startYaw) * smoothT;
                updateCamera();
                if (t < 1) requestAnimationFrame(turnLoop);
                else { yaw = targetYaw; updateCamera(); isTurning = false; }
            }
            turnLoop();
        }

        function moveForward() {
            if (isMoving || isTurning) return;
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const targetX = camera.position.x + Math.round(forward.x);
            const targetZ = camera.position.z + Math.round(forward.z);
            if (targetX < -0.35 || targetX > 0.35 || targetZ < -corridorLength / 2 + 0.3 || targetZ > corridorLength / 2 - 0.3) return;
            if (targetZ < enemyPos.z + 2.0) return;
            isMoving = true;
            animateStep(targetX, targetZ);
        }

        function moveBackward() {
            if (isMoving || isTurning) return;
            const forward = new THREE.Vector3(0, 0, 1);
            forward.applyQuaternion(camera.quaternion);
            forward.y = 0; forward.normalize();
            const targetX = camera.position.x + Math.round(forward.x);
            const targetZ = camera.position.z + Math.round(forward.z);
            if (targetX < -0.35 || targetX > 0.35 || targetZ < -corridorLength / 2 + 0.3 || targetZ > corridorLength / 2 - 0.3) return;
            isMoving = true;
            animateStep(targetX, targetZ);
        }

        function turnLeft() { if (!isMoving && !isTurning) animateTurn(yaw + rotationSpeed); }
        function turnRight() { if (!isMoving && !isTurning) animateTurn(yaw - rotationSpeed); }

        document.getElementById('btn-forward').addEventListener('touchstart', (e) => { e.preventDefault(); moveForward(); });
        document.getElementById('btn-back').addEventListener('touchstart', (e) => { e.preventDefault(); moveBackward(); });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); turnLeft(); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); turnRight(); });
        document.getElementById('btn-forward').addEventListener('click', moveForward);
        document.getElementById('btn-back').addEventListener('click', moveBackward);
        document.getElementById('btn-left').addEventListener('click', turnLeft);
        document.getElementById('btn-right').addEventListener('click', turnRight);
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': case 'arrowup': moveForward(); e.preventDefault(); break;
                case 's': case 'arrowdown': moveBackward(); e.preventDefault(); break;
                case 'a': case 'arrowleft': turnLeft(); e.preventDefault(); break;
                case 'd': case 'arrowright': turnRight(); e.preventDefault(); break;
            }
        });

        document.getElementById('attack-icon').addEventListener('click', function() { attackEnemy(); });

        var hitSprites = [
            'strike_claws.png', 'strike_claws_1.png', 'strike_claws_2.png',
            'strike_claws_4.png', 'strike_claws_5.png', 'strike_claws_6.png'
        ];

        function knockbackEnemy() {
            if (!enemySprite) return;
            enemyKnockback.active = true;
            enemyKnockback.t = 0;
            enemyKnockback.ox = enemySprite.position.x;
            enemyKnockback.oz = enemySprite.position.z;
            enemyKnockback.dz = 0.15;
        }

        function attackEnemy() {
            if (!isBattleActive) return;
            if (!enemyData || enemyData.hp <= 0) return;

            var playerStats = parent.Sherwood.getPlayer();
            playSound(soundHit);

            var r = parent.Sherwood.Raid.raidAttack();
            if (!r || r.error) return;

            // Отталкивание + кровь
            if (enemySprite) {
                knockbackEnemy();
                hitFlashSprite.material.map = bloodTextures[Math.floor(Math.random() * bloodTextures.length)];
                hitFlashSprite.material.needsUpdate = true;
                hitFlashSprite.material.rotation = Math.random() * Math.PI * 2;
                var spriteW = enemySprite.scale.x;
                var spriteH = enemySprite.scale.y;
                var ox = (Math.random() - 0.5) * spriteW * 0.7;
                var oy = (Math.random() - 0.5) * spriteH * 0.7;
                hitFlashSprite.position.copy(enemySprite.position);
                hitFlashSprite.position.x += ox;
                hitFlashSprite.position.y += oy;
                hitFlashSprite.visible = true;
                clearTimeout(pushTimer);
                pushTimer = setTimeout(function() { hitFlashSprite.visible = false; }, 150);
                cameraShake = 0.06;
            }

            var hitEffect = document.getElementById('hit-effect');
            var hitEffectImg = document.getElementById('hit-effect-img');
            if (hitEffect && hitEffectImg && enemySprite) {
                hitEffectImg.src = 'assets/assets2/animation/' + hitSprites[Math.floor(Math.random() * hitSprites.length)];
                var screenPos = enemySprite.position.clone();
                screenPos.project(camera);
                var x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
                var y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
                var side = Math.random() < 0.5 ? -1 : 1;
                hitEffect.style.left = (x + side * 120) + 'px';
                hitEffect.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                hitEffect.style.display = 'block';
                setTimeout(function() { hitEffect.style.display = 'none'; }, 200);
            }

            // Обновляем HP
            if (r.enemyHp !== undefined) {
                enemyHp = r.enemyHp;
                enemyMaxHp = r.enemyMaxHp;
                updateMobHpBarFill(enemyHp, enemyMaxHp);
            }

            // Игрок получил урон
            if (r.playerHp !== undefined) updateHeroSpheres();

            // Игрок умер
            if (r.playerDead) {
                playSound(soundDefeat);
                dungeonMusic.pause();
                isBattleActive = false;
                document.getElementById('mob-hp').style.display = 'none';
                if (enemySprite) scene.remove(enemySprite);
                parent.Sherwood.Raid._raidFlee();
                return;
            }

            // Рейд полностью пройден
            if (r.raidComplete) {
                onRaidComplete(r);
                return;
            }

            // Этап пройден (например, волна → босс)
            if (r.stageComplete) {
                // Переходим в новую сцену через parent — он пересоздаст iframe
                isBattleActive = false;
                document.getElementById('mob-hp').style.display = 'none';
                if (enemySprite) scene.remove(enemySprite);
                parent.Sherwood.Raid._onRaidWin();
                return;
            }

            // Враг убит, но волна не пройдена → следующий враг
            if (r.enemyDead) {
                isBattleActive = false;
                document.getElementById('mob-hp').style.display = 'none';
                if (enemySprite) scene.remove(enemySprite);
                parent.Sherwood.Raid._onRaidWin();
                return;
            }
        }

        function onRaidComplete(r) {
            playSound(soundVictory);
            dungeonMusic.pause();
            isBattleActive = false;
            document.getElementById('mob-hp').style.display = 'none';
            if (enemySprite) scene.remove(enemySprite);
            parent.Sherwood.Raid._onRaidWin();
        }

        function updateMobHpBarFill(hp, maxHp) {
            if (!maxHp) maxHp = 1;
            var pct = Math.max(0, Math.min(1, hp / maxHp));
            var fill = document.getElementById('mob-hp-fill');
            if (fill) fill.style.clipPath = 'inset(0 ' + (1 - pct) * 100 + '% 0 0)';
            var txt = document.getElementById('mob-hp-text');
            if (txt) txt.textContent = 'HP: ' + Math.max(0, hp) + '/' + maxHp;
        }

        function updateMobHpBar() {
            if (!isBattleActive || !enemySprite) return;
            var worldPos = enemySprite.position.clone();
            worldPos.y += enemySprite.scale.y / 2 + 0.1;
            worldPos.project(camera);
            var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;
            document.getElementById('mob-hp').style.left = x + 'px';
            document.getElementById('mob-hp').style.top = y + 'px';
        }

        function checkEnemy() {
            var dist = camera.position.distanceTo(enemyPos);
            if (dist < 3.0 && !isBattleActive && enemyData && enemyData.hp > 0) {
                isBattleActive = true;
                document.getElementById('mob-hp').style.display = 'block';
                enemyHp = enemyData.hp;
                enemyMaxHp = enemyData.maxHp;
                updateMobHpBarFill(enemyHp, enemyMaxHp);
            }
        }

        // ===== СКИЛЛЫ =====
        var talentData = {
            'poisoning': { icon: 'assets/assets2/talents/poisoning.png', side: 'left', cooldown: 5000, name: 'Отравление' },
            'vampirism': { icon: 'assets/assets2/talents/vampirism.png', side: 'left', cooldown: 5000, name: 'Вампиризм' },
            'stunning': { icon: 'assets/assets2/talents/stunning.png', side: 'left', cooldown: 8000, name: 'Оглушение' },
            'ricochet': { icon: 'assets/assets2/talents/Ricochet.png', side: 'left', cooldown: 10000, name: 'Рикошет' },
            'riot': { icon: 'assets/assets2/talents/Riot.png', side: 'left', cooldown: 6000, name: 'Бунт' },
            'force_of_elements': { icon: 'assets/assets2/talents/force of the elements.png', side: 'left', cooldown: 0, name: 'Сила стихий' },
            'evil_eye': { icon: 'assets/assets2/talents/evil_eye.png', side: 'left', cooldown: 7000, name: 'Злой глаз' },
            'healing': { icon: 'assets/assets2/talents/healing.png', side: 'right', cooldown: 10000, name: 'Исцеление' },
            'healer': { icon: 'assets/assets2/talents/Healer.png', side: 'right', cooldown: 12000, name: 'Хилер' },
            'funnel': { icon: 'assets/assets2/talents/funnel.png', side: 'right', cooldown: 8000, name: 'Воронка' },
            'inspiration': { icon: 'assets/assets2/talents/inspiration.png', side: 'right', cooldown: 15000, name: 'Вдохновение' },
            'knot': { icon: 'assets/assets2/talents/knot.png', side: 'right', cooldown: 10000, name: 'Узел' }
        };
        var skillCooldowns = {};
        var activeEffects = [];
        var poisonTimer = null;
        var healerTimer = null;

        function renderLearnedTalents() {
            var leftCol = document.getElementById('skills-left');
            var rightCol = document.getElementById('skills-right');
            if (!leftCol || !rightCol) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;
            leftCol.innerHTML = ''; rightCol.innerHTML = '';
            for (var id in p.talents) {
                var lvl = p.talents[id];
                if (lvl > 0 && talentData[id]) {
                    var img = document.createElement('img');
                    img.src = talentData[id].icon;
                    img.style.cssText = 'width:44px; height:44px; object-fit:contain;';
                    img.title = talentData[id].name + ' (Ур. ' + lvl + ')';
                    img.dataset.skillId = id;
                    img.onclick = (function(skillId) { return function() { useSkill(skillId); }; })(id);
                    (talentData[id].side === 'left' ? leftCol : rightCol).appendChild(img);
                }
            }
        }
        setTimeout(renderLearnedTalents, 500);

        function useSkill(skillId) {
            if (!isBattleActive) return;
            if (skillCooldowns[skillId] && Date.now() < skillCooldowns[skillId]) return;
            var p = parent.Sherwood.getPlayer();
            if (!p || !p.talents) return;
            var lvl = p.talents[skillId] || 0;
            if (lvl <= 0) return;

            var manaCosts = { 'poisoning': 10, 'vampirism': 15, 'stunning': 20, 'ricochet': 25, 'riot': 15, 'force_of_elements': 10, 'evil_eye': 20, 'healing': 20, 'healer': 25, 'funnel': 15, 'inspiration': 30, 'knot': 20 };
            var manaCost = (manaCosts[skillId] || 10) * lvl;
            if (!p.stats.mana) p.stats.mana = 0;
            if (p.stats.mana < manaCost) { if (parent.UI._showToast) parent.UI._showToast('Не хватает маны! Нужно ' + manaCost); return; }
            p.stats.mana -= manaCost;
            updateHeroSpheres();

            var cd = talentData[skillId].cooldown || 0;
            if (cd > 0) {
                skillCooldowns[skillId] = Date.now() + cd;
                var icon = document.querySelector('img[data-skill-id="' + skillId + '"]');
                if (icon) { icon.classList.add('on-cooldown'); setTimeout(function() { icon.classList.remove('on-cooldown'); }, cd); }
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            var dt = Math.min(clock.getDelta(), 0.05);

            if (enemyKnockback.active && enemySprite) {
                enemyKnockback.t += dt;
                var kk = Math.min(enemyKnockback.t / enemyKnockback.duration, 1);
                var ease = Math.sin(kk * Math.PI);
                enemySprite.position.z = enemyKnockback.oz + enemyKnockback.dz * ease;
                if (kk >= 1) {
                    enemySprite.position.z = enemyKnockback.oz;
                    enemyKnockback.active = false;
                }
            }

            if (cameraShake > 0.001) {
                camera.position.x = (Math.random() - 0.5) * cameraShake;
                camera.position.y = 0.8 + (Math.random() - 0.5) * cameraShake;
                camera.position.z = 2.5 + (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.85;
            } else if (cameraShake !== 0) {
                camera.position.x = 0;
                camera.position.y = 0.8;
                camera.position.z = 2.5;
                cameraShake = 0;
            }

            if (enemySprite && !enemyKnockback.active) {
                var t = clock.elapsedTime;
                enemySprite.position.y = enemyBaseY + Math.sin(t * 2.5) * 0.015;
            }

            camera.rotation.set(0, yaw, 0);

            renderer.render(scene, camera);
            if (isBattleActive) updateMobHpBar();
        }
        animate();

        addEventListener('resize', function() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // === ДОПОЛНИТЕЛЬНЫЙ ЭКСПОРТ ДЛЯ PARENT ===
        window.attackEnemy = attackEnemy;
        window.updateMobHpBarFill = updateMobHpBarFill;
        window.checkEnemy = checkEnemy;
        window.isBattleActiveRef = function() { return isBattleActive; };
    </script>
</body>
</html>
