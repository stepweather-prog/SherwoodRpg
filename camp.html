<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Лагерь Шервуда</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; }

        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #camp-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #c8a050; font: 18px "Times New Roman", serif; background: rgba(0,0,0,0.75); padding: 6px 20px; border: 2px solid #6b5a3a; border-radius: 4px; text-align: center; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }

        #camp-exit-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px; padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer; }

        #camp-hint { position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%); color: #c8a050; font-size: 13px; text-shadow: 0 0 6px #000; z-index: 20; pointer-events: none; opacity: 0.85; letter-spacing: 1px; text-align: center; }

        /* HTML-подписи над дверями */
        #door-labels-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        .door-label {
            position: absolute;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.78);
            border: 2px solid #c8a050;
            border-radius: 8px;
            padding: 4px 12px;
            color: #ffd27a;
            font: bold 14px "Times New Roman", serif;
            text-shadow: 0 0 6px #000, 0 2px 4px #000;
            letter-spacing: 1px;
            white-space: nowrap;
            display: none;
        }

        #hero-life { position: absolute; bottom: 10px; left: -20px; width: 110px; height: 110px; z-index: 50; pointer-events: none; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; pointer-events: none; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 135%; height: 135%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); top: -10px !important; }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #minimap { position: fixed; top: 12px; right: 12px; width: 180px; height: 180px; z-index: 30; pointer-events: none; }
        #minimap-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 1; }
        #minimap-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: transparent; }

        #joystick { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; z-index: 30; pointer-events: auto; }
        .arrow-btn { position: absolute; width: 38px; height: 38px; background: rgba(10, 8, 5, 0.85); border: 2px solid #6b5a3a; border-radius: 50%; color: #c8a050; font-size: 16px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px #8b6b3a; box-shadow: 0 0 6px rgba(139, 107, 58, 0.3); }
        .arrow-btn:active { background: rgba(139, 107, 58, 0.6); transform: scale(0.9); }
        #btn-forward { top: 0; left: 41px; }
        #btn-left { top: 41px; left: 0; }
        #btn-right { top: 41px; left: 82px; }
        #btn-back { top: 82px; left: 41px; }

        #step-anim {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 76px; height: 76px;
            pointer-events: none;
            z-index: 35;
            border-radius: 50%;
            object-fit: cover;
            opacity: 0.85;
            filter: drop-shadow(0 0 8px rgba(200,160,80,0.6));
        }

        @media (max-width: 600px) {
            #camp-exit-btn { padding: 6px 12px !important; font-size: 14px !important; top: 8px !important; left: 8px !important; }
            #camp-title { top: 8px !important; font-size: 14px !important; padding: 4px 12px !important; }
            #camp-hint { font-size: 11px !important; bottom: 150px !important; }
            #joystick { bottom: 20px !important; width: 110px !important; height: 110px !important; }
            .arrow-btn { width: 34px !important; height: 34px !important; font-size: 14px !important; }
            #btn-forward { top: 0 !important; left: 38px !important; }
            #btn-left    { top: 38px !important; left: 0 !important; }
            #btn-right   { top: 38px !important; left: 76px !important; }
            #btn-back    { top: 76px !important; left: 38px !important; }
            #step-anim { width: 60px !important; height: 60px !important; }
            #hero-life, #hero-mana { width: 90px !important; height: 90px !important; bottom: 6px !important; }
            #hero-life span, #hero-mana span { font-size: 13px !important; }
            #minimap { width: 130px !important; height: 130px !important; top: 8px !important; right: 8px !important; }
            #minimap-frame, #minimap-canvas { width: 100% !important; height: 100% !important; }
            .door-label { font-size: 12px !important; padding: 3px 8px !important; }
        }
    </style>
</head>
<body>
    <div id="camp-title">🏕️ ЛАГЕРЬ ШЕРВУДА</div>
    <div id="camp-exit-btn" onclick="exitCamp();">←</div>
    <div id="camp-hint">Подойди к двери и кликни по ней</div>

    <div id="door-labels-layer"></div>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>

    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">MP: 0</span>
    </div>

    <div id="minimap">
        <img id="minimap-frame" src="assets/assets2/game_details/maps_maps.png" alt="">
        <canvas id="minimap-canvas"></canvas>
    </div>

    <div id="joystick">
        <div class="arrow-btn" id="btn-forward">▲</div>
        <div class="arrow-btn" id="btn-left">◀</div>
        <div class="arrow-btn" id="btn-right">▶</div>
        <div class="arrow-btn" id="btn-back">▼</div>
        <video id="step-anim" src="assets/assets2/animation/step_up.webm" muted playsinline autoplay loop preload="auto"></video>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var returnGX = urlParams.get('returnGX');
        var returnGY = urlParams.get('returnGY');
        if (returnGX !== null) returnGX = parseInt(returnGX);
        if (returnGY !== null) returnGY = parseInt(returnGY);

        function exitCamp() {
            try { if (parent.UI && parent.UI.loadHome) parent.UI.loadHome(); } catch(e) {}
        }
        window.exitCamp = exitCamp;

        // ============================================================
        //  РАЗДЕЛЫ
        // ============================================================
        var SECTIONS = [
            { key: 'profile',  name: 'Профиль',   icon: 'assets/assets2/icons/player_profile.png',  open: function() { try { parent.UI.profile(); } catch(e) {} } },
            { key: 'quests',   name: 'Квесты',    icon: 'assets/assets2/icons/quest.png',           open: function() { try { parent.UI.quests(); } catch(e) {} } },
            { key: 'tavern',   name: 'Таверна',   icon: 'assets/assets2/icons/tavern.png',          open: function() { try { parent.UI.tavern(); } catch(e) {} } },
            { key: 'portals',  name: 'Порталы',   icon: 'assets/assets2/icons/portal.png',          open: function() { try { parent.UI.portals(); } catch(e) {} } },
            { key: 'dungeon',  name: 'Подземка',  icon: 'assets/assets2/icons/subway.png',          open: function() { try { parent.UI.dungeon(); } catch(e) {} } },
            { key: 'market',   name: 'Рынок',     icon: 'assets/assets2/icons/sherwood_market.png', open: function() { try { parent.UI.market(); } catch(e) {} } },
            { key: 'forge',    name: 'Кузница',   icon: 'assets/assets2/icons/forge.png',           open: function() { try { parent.UI.forge(); } catch(e) {} } },
            { key: 'bestiary', name: 'Бестиарий', icon: 'assets/assets2/icons/bestiary.png',        open: function() { try { parent.UI.bestiary(); } catch(e) {} } },
            { key: 'settings', name: 'Настройки', icon: 'assets/assets2/icons/settings.png',        open: function() { try { parent.UI.settings(); } catch(e) {} } }
        ];

        // ============================================================
        //  СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0805);
        scene.fog = new THREE.Fog(0x0a0805, 5, 14);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 40);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x0a0805, 1);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x665544, 1.0));
        scene.add(new THREE.HemisphereLight(0x5a4a28, 0x000000, 0.5));

        const size = 16;
        const wallHeight = 1.4;
        const cellSize = 1;

        const map = [];
        for (let i = 0; i < size; i++) {
            map[i] = [];
            for (let j = 0; j < size; j++) { map[i][j] = 1; }
        }

        function generateCamp() {
            for (var dx = -1; dx <= 1; dx++) {
                for (var dy = -1; dy <= 1; dy++) {
                    map[8 + dy][8 + dx] = 0;
                }
            }
            for (var x = 1; x < size - 1; x++) {
                map[8][x] = 0;
                map[x][8] = 0;
            }
            for (var i = 3; i < size - 3; i++) {
                map[3][i] = 0;
                map[size - 4][i] = 0;
                map[i][3] = 0;
                map[i][size - 4] = 0;
            }
            for (var y = 3; y <= 8; y++) map[y][3] = 0;
            for (var y = 8; y <= size - 4; y++) map[y][size - 4] = 0;
            for (var x = 3; x <= 8; x++) map[3][x] = 0;
            for (var x = 8; x <= size - 4; x++) map[size - 4][x] = 0;
        }
        generateCamp();

        function isWallCell(x, y) {
            if (x < 0 || y < 0 || x >= size || y >= size) return true;
            return map[y][x] === 1;
        }

        // ============================================================
        //  ДВЕРИ — только в узких проходах (2 стены по бокам)
        // ============================================================
        var candidates = [];
        for (var y = 1; y < size - 1; y++) {
            for (var x = 1; x < size - 1; x++) {
                if (map[y][x] !== 0) continue;
                if (x === 8 && y === 8) continue;

                var wL = isWallCell(x - 1, y);
                var wR = isWallCell(x + 1, y);
                var wU = isWallCell(x, y - 1);
                var wD = isWallCell(x, y + 1);
                var walls = (wL?1:0) + (wR?1:0) + (wU?1:0) + (wD?1:0);

                if (walls === 2 && ((wL && wR) || (wU && wD))) {
                    // horiz = стены СЛЕВА и СПРАВА → дверь не поворачиваем
                    candidates.push({ x: x, y: y, horiz: wL && wR });
                }
            }
        }

        var placed = [];
        for (var c = 0; c < candidates.length && placed.length < 9; c++) {
            var cand = candidates[c];
            var ok = true;
            for (var p = 0; p < placed.length; p++) {
                if (Math.abs(placed[p].x - cand.x) + Math.abs(placed[p].y - cand.y) < 3) { ok = false; break; }
            }
            if (ok) placed.push(cand);
        }

        // ============================================================
        //  ТЕКСТУРЫ
        // ============================================================
        const loader = new THREE.TextureLoader();
        const wallTex  = loader.load('assets/assets2/Sherwood_Square/walls_quest.png');
        const floorTex = loader.load('assets/assets2/Sherwood_Square/floors_quest.png');
        const ceilTex  = loader.load('assets/assets2/Sherwood_Square/ceiling_area_9.png');

        const wallMat  = new THREE.MeshStandardMaterial({ map: wallTex,  roughness: 0.85, metalness: 0.05 });
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.95, metalness: 0.0 });
        const ceilMat  = new THREE.MeshStandardMaterial({ map: ceilTex,  roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide });
        const wallMatsArray = [wallMat, wallMat, ceilMat, wallMat, wallMat, wallMat];

        const group = new THREE.Group();
        scene.add(group);

        for (let row = 0; row < size; row++) {
            for (let col = 0; col < size; col++) {
                const x = col - Math.floor(size / 2);
                const z = row - Math.floor(size / 2);

                if (map[row][col] !== 1) {
                    const floor = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, cellSize), floorMat);
                    floor.rotation.x = -Math.PI / 2;
                    floor.position.set(x, 0, z);
                    group.add(floor);

                    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, cellSize), ceilMat);
                    ceil.rotation.x = Math.PI / 2;
                    ceil.position.set(x, wallHeight, z);
                    group.add(ceil);
                }

                if (map[row][col] === 1) {
                    const wall = new THREE.Mesh(new THREE.BoxGeometry(cellSize, wallHeight, cellSize), wallMatsArray);
                    wall.position.set(x, wallHeight / 2, z);
                    group.add(wall);
                }
            }
        }

        // ============================================================
        //  ДВЕРИ — плоскость в проёме, как в подземке
        // ============================================================
        function makeDoorMaterial(iconPath) {
            var tex = loader.load(iconPath);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            return new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                side: THREE.DoubleSide,
                depthTest: true,
                depthWrite: false,
                color: 0xffffff
            });
        }

        var doorLeaves = [];

        for (var d = 0; d < placed.length; d++) {
            var dp = placed[d];
            var sec = SECTIONS[d % SECTIONS.length];

            var wx = dp.x - Math.floor(size / 2);
            var wz = dp.y - Math.floor(size / 2);

            var leaf = new THREE.Mesh(
                new THREE.PlaneGeometry(cellSize, wallHeight),
                makeDoorMaterial(sec.icon)
            );
            if (!dp.horiz) leaf.rotation.y = Math.PI / 2;

            leaf.position.set(wx, wallHeight / 2, wz);
            leaf.userData = { isDoor: true, doorGX: dp.x, doorGY: dp.y, section: sec };
            group.add(leaf);

            doorLeaves.push({
                mesh: leaf,
                gx: dp.x, gy: dp.y,
                open: false, t: 0,
                closedY: wallHeight / 2,
                openY: -wallHeight / 2 - 0.15,
                section: sec,
                labelEl: null
            });
        }

        console.log('🚪 Дверей размещено:', doorLeaves.length);

        // ============================================================
        //  СВЕТЛЯЧКИ ВОКРУГ ДВЕРЕЙ
        // ============================================================
        var fireflies = [];

        var fireflyTex = (function() {
            var canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            var ctx = canvas.getContext('2d');
            var gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 240, 160, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 220, 100, 0.85)');
            gradient.addColorStop(0.55, 'rgba(255, 180, 60, 0.35)');
            gradient.addColorStop(1, 'rgba(255, 180, 60, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.fill();
            var t = new THREE.CanvasTexture(canvas);
            t.minFilter = THREE.LinearFilter;
            t.magFilter = THREE.LinearFilter;
            return t;
        })();

        for (var fd = 0; fd < doorLeaves.length; fd++) {
            var door = doorLeaves[fd];
            var baseX = door.mesh.position.x;
            var baseZ = door.mesh.position.z;

            var count = 3 + Math.floor(Math.random() * 3);
            for (var k = 0; k < count; k++) {
                var spr = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: fireflyTex,
                    transparent: true,
                    depthTest: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                }));
                var fsize = 0.08 + Math.random() * 0.06;
                spr.scale.set(fsize, fsize, 1);

                var angle = Math.random() * Math.PI * 2;
                var radius = 0.25 + Math.random() * 0.3;
                var height = 0.3 + Math.random() * 0.9;
                spr.position.set(
                    baseX + Math.cos(angle) * radius,
                    height,
                    baseZ + Math.sin(angle) * radius
                );
                scene.add(spr);

                fireflies.push({
                    sprite: spr,
                    baseX: baseX,
                    baseZ: baseZ,
                    angle: angle,
                    radius: radius,
                    height: height,
                    speed: 0.3 + Math.random() * 0.4,
                    verticalSpeed: 0.5 + Math.random() * 0.7,
                    phase: Math.random() * Math.PI * 2,
                    wobbleAmp: 0.08 + Math.random() * 0.1
                });
            }
        }

        // ============================================================
        //  HTML-ПОДПИСИ НАД ДВЕРЯМИ
        // ============================================================
        var labelsLayer = document.getElementById('door-labels-layer');
        for (var i = 0; i < doorLeaves.length; i++) {
            var el = document.createElement('div');
            el.className = 'door-label';
            el.textContent = doorLeaves[i].section.name;
            labelsLayer.appendChild(el);
            doorLeaves[i].labelEl = el;
        }

        // ============================================================
        //  ЗВУКИ + АНИМАЦИЯ ШАГА
        // ============================================================
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var soundSteps = new Audio('assets/assets2/tune/steps.wav');
        var campMusic = new Audio('assets/assets2/music/main_theme_2.ogg');
        campMusic.loop = true;
        campMusic.volume = 0.35;

        var stepAnimEl = document.getElementById('step-anim');
        stepAnimEl.pause();

        function playSound(a) { try { a.currentTime = 0; a.play().catch(function(){}); } catch(e) {} }

        function startSteps() {
            try { soundSteps.currentTime = 0; soundSteps.play().catch(function(){}); } catch(e){}
            try { stepAnimEl.play().catch(function(){}); } catch(e){}
        }
        function stopSteps() {
            try { soundSteps.pause(); soundSteps.currentTime = 0; } catch(e){}
            try { stepAnimEl.pause(); } catch(e){}
        }

        setTimeout(function() { try { campMusic.play().catch(function(){}); } catch(e){} }, 300);
        window.addEventListener('click', function() { try { campMusic.play().catch(function(){}); } catch(e){} });

        // ============================================================
        //  СФЕРЫ HP/МАНЫ
        // ============================================================
        function updateHeroSpheres() {
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            var hpPercent = p.stats.hp / p.stats.maxHp;
            var lifeFill = document.getElementById('life-fill');
            if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPercent) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text');
            if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);

            var mana = p.stats.mana || 0;
            var maxMana = p.stats.maxMana || 100;
            var manaPercent = mana / maxMana;
            var manaFill = document.getElementById('mana-fill');
            if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - manaPercent) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text');
            if (manaText) manaText.textContent = 'MP: ' + Math.floor(mana);
        }
        setTimeout(updateHeroSpheres, 400);
        setInterval(updateHeroSpheres, 1000);

        // ============================================================
        //  ИГРОК
        // ============================================================
        let playerGX = 8, playerGY = 8;
        const playerPos = new THREE.Vector3(playerGX - Math.floor(size / 2), 0, playerGY - Math.floor(size / 2));
        let playerYaw = 0;

        if (returnGX !== null && returnGY !== null && !isNaN(returnGX) && !isNaN(returnGY)) {
            var neighbours = [
                { x: returnGX + 1, y: returnGY },
                { x: returnGX - 1, y: returnGY },
                { x: returnGX, y: returnGY + 1 },
                { x: returnGX, y: returnGY - 1 }
            ];
            var spawn = null;
            for (var n = 0; n < neighbours.length; n++) {
                var nx = neighbours[n].x, ny = neighbours[n].y;
                if (nx >= 0 && ny >= 0 && nx < size && ny < size && map[ny][nx] === 0) {
                    spawn = { x: nx, y: ny };
                    break;
                }
            }
            if (spawn) {
                playerGX = spawn.x;
                playerGY = spawn.y;
                playerPos.x = playerGX - Math.floor(size / 2);
                playerPos.z = playerGY - Math.floor(size / 2);
                var ddx = returnGX - playerGX;
                var ddy = returnGY - playerGY;
                if (ddx === 1) playerYaw = -Math.PI / 2;
                else if (ddx === -1) playerYaw = Math.PI / 2;
                else if (ddy === 1) playerYaw = Math.PI;
                else if (ddy === -1) playerYaw = 0;
            }

            for (var dl = 0; dl < doorLeaves.length; dl++) {
                if (doorLeaves[dl].gx === returnGX && doorLeaves[dl].gy === returnGY) {
                    var dd = doorLeaves[dl];
                    dd.mesh.position.y = dd.openY;
                    dd.mesh.visible = true;
                    dd.t = 0;
                    dd._reverse = true;
                    break;
                }
            }
            setTimeout(function() { playSound(soundAltar); }, 400);
        }

        const heroGlow = new THREE.PointLight(0xffb060, 0.7, 6, 2);
        heroGlow.position.set(playerPos.x, 0.9, playerPos.z);
        scene.add(heroGlow);

        const MOVE_SPEED = 2.0;
        const rotationSpeed = Math.PI / 2;
        let waypoints = [];
        let moving = false;
        let isTurning = false;

        function isWalkable(gx, gy) {
            if (gx < 0 || gy < 0 || gx >= size || gy >= size) return false;
            return map[gy][gx] === 0;
        }
        function canStep(fromGX, fromGY, toGX, toGY) {
            if (!isWalkable(toGX, toGY)) return false;
            const dx = toGX - fromGX, dy = toGY - fromGY;
            if (dx !== 0 && dy !== 0) {
                if (!isWalkable(fromGX + dx, fromGY)) return false;
                if (!isWalkable(fromGX, fromGY + dy)) return false;
            }
            return true;
        }
        function gridToWorld(gx, gy) { return { x: gx - Math.floor(size / 2), z: gy - Math.floor(size / 2) }; }
        function worldToGrid(wx, wz) { return { gx: Math.round(wx + Math.floor(size / 2)), gy: Math.round(wz + Math.floor(size / 2)) }; }

        function openDoor(doorObj) {
            if (!doorObj || doorObj.open) return;
            doorObj.open = true;
            doorObj.t = 0;
            doorObj._reverse = false;
            playSound(soundAltar);

            try {
                if (parent.UI) parent.UI._campReturnInfo = { gx: doorObj.gx, gy: doorObj.gy };
            } catch(e) {}

            setTimeout(function() {
                if (doorObj.section && doorObj.section.open) {
                    doorObj.section.open();
                }
            }, 350);
        }

        // ============================================================
        //  УПРАВЛЕНИЕ
        // ============================================================
        function animateTurn(targetYaw, duration) {
            if (isTurning) return;
            duration = duration || 400;
            const startYaw = playerYaw;
            const startTime = performance.now();
            isTurning = true;
            function turnLoop() {
                const elapsed = performance.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const smoothT = t * t * (3 - 2 * t);
                let delta = targetYaw - startYaw;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;
                playerYaw = startYaw + delta * smoothT;
                if (t < 1) requestAnimationFrame(turnLoop);
                else { playerYaw = startYaw + delta; isTurning = false; }
            }
            turnLoop();
        }

        function moveForward() {
            if (moving || isTurning) return;
            const dirX = -Math.sin(playerYaw);
            const dirZ = -Math.cos(playerYaw);
            const cur = worldToGrid(playerPos.x, playerPos.z);
            const nx = cur.gx + Math.round(dirX);
            const ny = cur.gy + Math.round(dirZ);
            if (!canStep(cur.gx, cur.gy, nx, ny)) return;
            const to = gridToWorld(nx, ny);
            waypoints = [{ x: to.x, z: to.z }];
            moving = true;
            startSteps();
        }
        function moveBackward() {
            if (moving || isTurning) return;
            const dirX = Math.sin(playerYaw);
            const dirZ = Math.cos(playerYaw);
            const cur = worldToGrid(playerPos.x, playerPos.z);
            const nx = cur.gx + Math.round(dirX);
            const ny = cur.gy + Math.round(dirZ);
            if (!canStep(cur.gx, cur.gy, nx, ny)) return;
            const to = gridToWorld(nx, ny);
            waypoints = [{ x: to.x, z: to.z }];
            moving = true;
            startSteps();
        }
        function turnLeft() { if (!moving && !isTurning) animateTurn(playerYaw + rotationSpeed); }
        function turnRight() { if (!moving && !isTurning) animateTurn(playerYaw - rotationSpeed); }

        document.getElementById('btn-forward').addEventListener('click', (e) => { e.preventDefault(); moveForward(); });
        document.getElementById('btn-back').addEventListener('click', (e) => { e.preventDefault(); moveBackward(); });
        document.getElementById('btn-left').addEventListener('click', (e) => { e.preventDefault(); turnLeft(); });
        document.getElementById('btn-right').addEventListener('click', (e) => { e.preventDefault(); turnRight(); });
        document.getElementById('btn-forward').addEventListener('touchstart', (e) => { e.preventDefault(); moveForward(); });
        document.getElementById('btn-back').addEventListener('touchstart', (e) => { e.preventDefault(); moveBackward(); });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); turnLeft(); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); turnRight(); });

        document.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case 'w': case 'arrowup': moveForward(); e.preventDefault(); break;
                case 's': case 'arrowdown': moveBackward(); e.preventDefault(); break;
                case 'a': case 'arrowleft': turnLeft(); e.preventDefault(); break;
                case 'd': case 'arrowright': turnRight(); e.preventDefault(); break;
            }
        });

        // ============================================================
        //  КЛИК ПО ДВЕРИ
        // ============================================================
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
            ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(ndc, camera);

            var doorMeshes = doorLeaves.map(function(d) { return d.mesh; });
            var hits = raycaster.intersectObjects(doorMeshes, false);
            if (hits.length > 0) {
                var ud = hits[0].object.userData;
                if (ud && ud.isDoor) {
                    var cur = worldToGrid(playerPos.x, playerPos.z);
                    var dist = Math.abs(cur.gx - ud.doorGX) + Math.abs(cur.gy - ud.doorGY);
                    if (dist <= 1) {
                        for (var i = 0; i < doorLeaves.length; i++) {
                            if (doorLeaves[i].gx === ud.doorGX && doorLeaves[i].gy === ud.doorGY) {
                                openDoor(doorLeaves[i]);
                                break;
                            }
                        }
                    } else {
                        moveForward();
                    }
                    return;
                }
            }
            moveForward();
        });

        // ============================================================
        //  МИНИКАРТА
        // ============================================================
        const minimapCell = 11;
        const minimapCanvas = document.getElementById('minimap-canvas');
        minimapCanvas.width = size * minimapCell;
        minimapCanvas.height = size * minimapCell;
        const mmCtx = minimapCanvas.getContext('2d');

        function drawMinimap() {
            mmCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    const v = map[row][col];
                    let color;
                    if (v === 1) color = 'rgba(42,26,10,0.85)';
                    else color = 'rgba(139,115,85,0.75)';
                    mmCtx.fillStyle = color;
                    mmCtx.fillRect(col * minimapCell, row * minimapCell, minimapCell, minimapCell);
                }
            }
            for (var i = 0; i < doorLeaves.length; i++) {
                var d = doorLeaves[i];
                mmCtx.fillStyle = d.open ? '#4caf50' : '#ffd700';
                mmCtx.beginPath();
                mmCtx.arc(d.gx * minimapCell + minimapCell/2, d.gy * minimapCell + minimapCell/2, minimapCell * 0.4, 0, Math.PI * 2);
                mmCtx.fill();
            }
            const pg = worldToGrid(playerPos.x, playerPos.z);
            mmCtx.fillStyle = '#ffd700';
            mmCtx.beginPath();
            mmCtx.arc(pg.gx * minimapCell + minimapCell/2, pg.gy * minimapCell + minimapCell/2, minimapCell * 1.2, 0, Math.PI * 2);
            mmCtx.fill();
            const cx = pg.gx * minimapCell + minimapCell/2;
            const cy = pg.gy * minimapCell + minimapCell/2;
            const len = minimapCell * 3;
            const dx = -Math.sin(playerYaw) * len;
            const dy = -Math.cos(playerYaw) * len;
            mmCtx.strokeStyle = '#ffd700';
            mmCtx.lineWidth = 2;
            mmCtx.beginPath();
            mmCtx.moveTo(cx, cy);
            mmCtx.lineTo(cx + dx, cy + dy);
            mmCtx.stroke();
        }

        // ============================================================
        //  КАМЕРА + ПОДПИСИ В SCREEN-SPACE
        // ============================================================
        const clock = new THREE.Clock();

        function updateCamera() {
            camera.position.x = playerPos.x;
            camera.position.z = playerPos.z;
            camera.position.y = 0.75;
            camera.rotation.set(0, playerYaw, 0);
        }

        function updateDoorLabels() {
            var forwardX = -Math.sin(playerYaw);
            var forwardZ = -Math.cos(playerYaw);

            for (var i = 0; i < doorLeaves.length; i++) {
                var d = doorLeaves[i];
                if (!d.labelEl) continue;
                if (!d.mesh.visible && d.open) {
                    d.labelEl.style.display = 'none';
                    continue;
                }

                var dx = d.mesh.position.x - playerPos.x;
                var dz = d.mesh.position.z - playerPos.z;
                var dist = Math.hypot(dx, dz);

                if (dist > 6) { d.labelEl.style.display = 'none'; continue; }

                if (dist > 0.001) {
                    var nx = dx / dist;
                    var nz = dz / dist;
                    var dot = nx * forwardX + nz * forwardZ;
                    if (dot < 0.75) { d.labelEl.style.display = 'none'; continue; }
                }

                var worldPos = new THREE.Vector3(d.mesh.position.x, d.mesh.position.y + 0.7, d.mesh.position.z);
                worldPos.project(camera);

                if (worldPos.z > 1) { d.labelEl.style.display = 'none'; continue; }

                var x = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
                var y = (-worldPos.y * 0.5 + 0.5) * window.innerHeight;

                if (x < -100 || x > window.innerWidth + 100 || y < -100 || y > window.innerHeight + 100) {
                    d.labelEl.style.display = 'none';
                    continue;
                }

                var opacity = 1;
                if (dist > 4) opacity = Math.max(0, 1 - (dist - 4) / 2);

                d.labelEl.style.display = 'block';
                d.labelEl.style.left = x + 'px';
                d.labelEl.style.top = y + 'px';
                d.labelEl.style.opacity = opacity;
            }
        }

        // ============================================================
        //  ЦИКЛ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.elapsedTime;

            if (moving && waypoints.length) {
                let budget = MOVE_SPEED * dt;
                while (budget > 0 && waypoints.length) {
                    const tgt = waypoints[0];
                    const dx = tgt.x - playerPos.x;
                    const dz = tgt.z - playerPos.z;
                    const dist = Math.hypot(dx, dz);
                    if (dist <= budget) {
                        playerPos.x = tgt.x;
                        playerPos.z = tgt.z;
                        budget -= dist;
                        waypoints.shift();
                    } else {
                        const nx = dx / dist, nz = dz / dist;
                        playerPos.x += nx * budget;
                        playerPos.z += nz * budget;
                        budget = 0;
                    }
                }
                if (!waypoints.length) {
                    moving = false;
                    stopSteps();
                }
            }

            for (var i = 0; i < doorLeaves.length; i++) {
                var d = doorLeaves[i];
                if (d._reverse) {
                    if (d.t < 1) {
                        d.t += dt / 0.45;
                        var k = Math.min(d.t, 1);
                        var e = k * k * (3 - 2 * k);
                        d.mesh.position.y = d.openY + (d.closedY - d.openY) * e;
                        if (k >= 1) {
                            d.mesh.position.y = d.closedY;
                            d._reverse = false;
                            d.open = false;
                        }
                    }
                } else if (d.open && d.t < 1) {
                    d.t += dt / 0.45;
                    var k2 = Math.min(d.t, 1);
                    var e2 = k2 * k2 * (3 - 2 * k2);
                    d.mesh.position.y = d.closedY + (d.openY - d.closedY) * e2;
                    if (k2 >= 1) d.mesh.visible = false;
                }
            }

            heroGlow.position.set(playerPos.x, 0.9, playerPos.z);
            heroGlow.intensity = 0.65 + Math.sin(t * 3) * 0.08;

            // Обновление светлячков
            for (var fi = 0; fi < fireflies.length; fi++) {
                var f = fireflies[fi];
                f.angle += dt * f.speed * 0.6;
                var r = f.radius + Math.sin(t * 1.3 + f.phase) * f.wobbleAmp;
                var yy = f.height + Math.sin(t * f.verticalSpeed + f.phase) * 0.15;

                f.sprite.position.x = f.baseX + Math.cos(f.angle) * r;
                f.sprite.position.z = f.baseZ + Math.sin(f.angle) * r;
                f.sprite.position.y = yy;

                var pulse = 0.55 + Math.sin(t * 3 + f.phase) * 0.4;
                f.sprite.material.opacity = Math.max(0.15, pulse);
            }

            updateCamera();
            renderer.render(scene, camera);
            drawMinimap();
            updateDoorLabels();
        }

        animate();

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
