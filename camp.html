<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Лагерь Шервуда</title>
    <link rel="stylesheet" href="css/mobile.css" media="(max-width: 600px)">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; background: transparent; touch-action: none; cursor: crosshair; }
        
        #vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.7) 100%); }
        #scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px); }

        #camp-title { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #c8a050; font: 18px "Times New Roman", serif; background: rgba(0,0,0,0.75); padding: 6px 20px; border: 2px solid #6b5a3a; border-radius: 4px; text-align: center; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }
        #camp-exit-btn { position: fixed; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); border: 2px solid #6b5a3a; border-radius: 4px; padding: 8px 16px; color: #c8a050; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Кнопка взаимодействия */
        #action-btn {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            width: 85px; height: 85px; cursor: pointer; pointer-events: auto;
            padding: 0; border: none; background: none; z-index: 45; display: none;
        }
        #action-btn:active { transform: translateX(-50%) scale(0.9); }
        #action-btn img {
            width: 85px; height: 85px; object-fit: contain; border-radius: 8px;
            border: 3px solid rgba(200, 160, 80, 0.8); background: rgba(0, 0, 0, 0.6);
            padding: 3px; transition: all 0.2s; display: block; box-sizing: border-box;
        }
        #action-btn img:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #ffd700); }

        #hero-life { position: absolute; bottom: 10px; left: 10px; width: 110px; height: 110px; z-index: 50; pointer-events: none; }
        #hero-life img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #life-fill { clip-path: inset(0 0 0 0); }
        #hero-life span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }
        
        #hero-mana { position: absolute; bottom: 10px; right: 10px; width: 110px; height: 110px; z-index: 50; pointer-events: none; }
        #hero-mana img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        #mana-fill { clip-path: inset(0 0 0 0); }
        #hero-mana span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 0 4px #000, 0 0 8px #000; }

        #joystick { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 140px; height: 140px; z-index: 55; pointer-events: none; display: none; }
        .arrow-btn { position: absolute; width: 60px; height: 60px; background: rgba(10, 8, 5, 0.85); border: 2px solid #6b5a3a; border-radius: 50%; color: #c8a050; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px #8b6b3a; box-shadow: 0 0 6px rgba(139, 107, 58, 0.3); }
        .arrow-btn:active { background: rgba(139, 107, 58, 0.6); transform: scale(0.9); }
        #btn-left  { top: 40px; left: 0; }
        #btn-right { top: 40px; left: 80px; }
        
        @media (max-width: 900px) {
            #joystick { display: block; }
            #hero-life, #hero-mana { width: 90px; height: 90px; bottom: 6px; }
            #hero-life { left: 6px; }
            #hero-mana { right: 6px; }
            #hero-life span, #hero-mana span { font-size: 13px; }
            #action-btn { width: 70px; height: 70px; bottom: 100px; }
            #action-btn img { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
    <div id="camp-title">🏕️ ЛАГЕРЬ ШЕРВУДА</div>
    <div id="camp-exit-btn" onclick="exitCamp();">←</div>

    <button id="action-btn">
        <img id="action-btn-img" src="assets/assets2/icons/take.png" alt="Взаимодействовать">
    </button>

    <div id="hero-life">
        <img src="assets/assets2/game_details/sphere_of_life.png" alt="">
        <img id="life-fill" src="assets/assets2/game_details/filling_life.png" alt="">
        <span id="hp-text">HP: 0</span>
    </div>
    <div id="hero-mana">
        <img src="assets/assets2/game_details/sphere_of_filth.png" alt="">
        <img id="mana-fill" src="assets/assets2/game_details/filling_with_filth.png" alt="">
        <span id="mana-text">Скверна: 0%</span>
    </div>

    <div id="joystick">
        <div class="arrow-btn" id="btn-left">◀</div>
        <div class="arrow-btn" id="btn-right">▶</div>
    </div>

    <div id="vignette"></div>
    <div id="scanlines"></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        var urlParams = new URLSearchParams(window.location.search);
        var returnGX = urlParams.get('returnGX');
        var returnGY = urlParams.get('returnGY');

        function exitCamp() {
            try { if (parent.UI && parent.UI.loadHome) parent.UI.loadHome(); } catch(e) {}
        }
        window.exitCamp = exitCamp;
        / ============================================================
        //  ДАННЫЕ ДЛЯ ДВЕРЕЙ (Разделы)
        // ============================================================
        var SECTIONS = [
            { key: 'profile',  name: 'Профиль',   icon: 'assets/assets2/icons/player_profile.png',  x: 8,  open: function() { try { parent.UI.profile(); } catch(e) {} } },
            { key: 'tavern',   name: 'Таверна',   icon: 'assets/assets2/icons/tavern.png',          x: 16, open: function() { try { parent.UI.tavern(); } catch(e) {} } },
            { key: 'portals',  name: 'Порталы',   icon: 'assets/assets2/icons/portal.png',          x: 24, open: function() { try { parent.UI.portals(); } catch(e) {} } },
            { key: 'dungeon',  name: 'Подземка',  icon: 'assets/assets2/icons/subway.png',          x: 32, open: function() { try { parent.UI.dungeon(); } catch(e) {} } },
            { key: 'thicket',  name: 'Шервудская чащоба', icon: 'assets/assets2/icons/quest.png',   x: 40, open: function() { try { parent.UI.thicket(); } catch(e) {} } },
            { key: 'market',   name: 'Рынок',     icon: 'assets/assets2/icons/sherwood_market.png', x: 48, open: function() { try { parent.UI.market(); } catch(e) {} } },
            { key: 'forge',    name: 'Кузница',   icon: 'assets/assets2/icons/forge.png',           x: 56, open: function() { try { parent.UI.forge(); } catch(e) {} } },
            { key: 'bestiary', name: 'Бестиарий', icon: 'assets/assets2/icons/bestiary.png',        x: 64, open: function() { try { parent.UI.bestiary(); } catch(e) {} } },
            { key: 'settings', name: 'Настройки', icon: 'assets/assets2/icons/settings.png',        x: 72, open: function() { try { parent.UI.settings(); } catch(e) {} } }
        ];

        // ============================================================
        //  СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x1a1208, 20, 50);

        const camPlatformer = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camPlatformer.position.set(0, 2.5, 6);
        camPlatformer.lookAt(0, 0.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        const dirLight = new THREE.DirectionalLight(0xffd0a0, 1.5);
        dirLight.position.set(5, 10, 5); scene.add(dirLight);
        const playerLight = new THREE.PointLight(0xffaa55, 2.0, 15);
        playerLight.position.set(0, 2, 2); scene.add(playerLight);

        const loader = new THREE.TextureLoader();
        const wallTexture  = loader.load('assets/assets2/Sherwood_Square/wall_area_1.png');
        const floorTexture = loader.load('assets/dungeon_tiles/dungeon1/tiles_5.png'); // НОВЫЙ ПОЛ
        const ceilTexture  = loader.load('assets/assets2/dungeon_details/swamp_ceiling_dungeon_2.png'); 

        // Настройка стены (без повторений сверху)
        wallTexture.wrapS = THREE.RepeatWrapping; 
        wallTexture.repeat.x = 8; 
        wallTexture.wrapT = THREE.ClampToEdgeWrapping; 
        wallTexture.repeat.y = 1; 
        wallTexture.offset.y = 0.2; 

        floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(8, 2);
        ceilTexture.wrapS = ceilTexture.wrapT = THREE.RepeatWrapping;
        ceilTexture.repeat.set(8, 2);

        const wallMat  = new THREE.MeshLambertMaterial({ map: wallTexture });
        const floorMat = new THREE.MeshLambertMaterial({ map: floorTexture });
        const ceilMat  = new THREE.MeshLambertMaterial({ map: ceilTexture });

        const platformerGroup = new THREE.Group();
        scene.add(platformerGroup);

        const LEVEL_W = 80; 
        const WALL_H = 6;   
        const CORRIDOR_DEPTH = 6; 

        const ground = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, 1, CORRIDOR_DEPTH), floorMat);
        ground.position.set(LEVEL_W / 2, -0.5, 0); 
        platformerGroup.add(ground);

        const backWall = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, WALL_H, 0.5), wallMat);
        backWall.position.set(LEVEL_W / 2, WALL_H / 2, -CORRIDOR_DEPTH / 2); 
        platformerGroup.add(backWall);

        const ceil = new THREE.Mesh(new THREE.BoxGeometry(LEVEL_W, 0.5, CORRIDOR_DEPTH), ceilMat);
        ceil.position.set(LEVEL_W / 2, WALL_H, 0); 
        platformerGroup.add(ceil);

        // ============================================================
        //  ДВЕРИ-РАЗДЕЛЫ (Опущены ниже - на высоту 1.8)
        // ============================================================
        var doorLeaves = [];
        for (var i = 0; i < SECTIONS.length; i++) {
            var sec = SECTIONS[i];
            var tex = loader.load(sec.icon);
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            
            var mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthTest: true, depthWrite: false, color: 0xffffff });
            var leaf = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), mat);
            
            // Опускаем двери: было 2.5, стало 1.8
            leaf.position.set(sec.x, 1.8, 0); 
            leaf.userData = { isDoor: true, section: sec, originalY: 1.8, openY: -4.5, t: 0, open: false };
            platformerGroup.add(leaf);
            
            doorLeaves.push(leaf);
        }

        // ============================================================
        //  СВЕТЛЯЧКИ ВОКРУГ ДВЕРЕЙ (Возвращены)
        // ============================================================
        var fireflies = [];
        var fireflyTex = (function() {
            var canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            var ctx = canvas.getContext('2d');
            var gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 240, 160, 1)');
            gradient.addColorStop(0.25, 'rgba(255, 220, 100, 0.85)');
            gradient.addColorStop(0.55, 'rgba(255, 180, 60, 0.35)');
            gradient.addColorStop(1, 'rgba(255, 180, 60, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.arc(32, 32, 32, 0, Math.PI * 2); ctx.fill();
            var t = new THREE.CanvasTexture(canvas);
            t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
            return t;
        })();

        for (var fd = 0; fd < doorLeaves.length; fd++) {
            var door = doorLeaves[fd];
            var baseX = door.position.x;
            var baseY = door.position.y; // Центр двери
            
            var count = 4 + Math.floor(Math.random() * 4); // 4-7 светлячков на дверь
            for (var k = 0; k < count; k++) {
                var spr = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: fireflyTex, transparent: true, depthTest: true, depthWrite: false, blending: THREE.AdditiveBlending
                }));
                var fsize = 0.12 + Math.random() * 0.08;
                spr.scale.set(fsize, fsize, 1);

                // Спавним вокруг двери
                var angle = Math.random() * Math.PI * 2;
                var radius = 1.5 + Math.random() * 1.5;
                var offsetY = (Math.random() - 0.5) * 3.0;
                
                spr.position.set(baseX + Math.cos(angle) * radius, baseY + offsetY, 0.5);
                scene.add(spr);

                fireflies.push({
                    sprite: spr, baseX: baseX, baseY: baseY,
                    angle: angle, radius: radius, offsetY: offsetY,
                    speed: 0.3 + Math.random() * 0.4,
                    verticalSpeed: 0.5 + Math.random() * 0.7,
                    phase: Math.random() * Math.PI * 2,
                    wobbleAmp: 0.2 + Math.random() * 0.3
                });
            }
        }

        // ============================================================
        //  БРАЗИЕРЫ (Вазоны с огнем - стоят на переднем плане z = 2.0)
        // ============================================================
        const braziers = [];
        function chromaKeyImageData(imgData) {
            var d = imgData.data;
            for (var i = 0; i < d.length; i += 4) {
                var r = d[i], g = d[i+1], b = d[i+2];
                if (g > 80 && g > r * 1.35 && g > b * 1.35) {
                    var greenness = (g - Math.max(r, b)) / g;
                    if (greenness > 0.25) { d[i+3] = 0; } else { d[i+3] = Math.floor(255 * (1 - greenness / 0.25)); }
                }
            }
        }

        for (var b = 0; b < 5; b++) {
            var bx = 4 + b * 18; 
            
            var fireLight = new THREE.PointLight(0xff7a2a, 0.85, 4.5, 2);
            fireLight.position.set(bx, 0.55, 1.5);
            scene.add(fireLight);

            var bCanvas = document.createElement('canvas');
            bCanvas.width = 128; bCanvas.height = 128;
            var bCtx = bCanvas.getContext('2d', { willReadFrequently: true });

            var bVideo = document.createElement('video');
            bVideo.src = 'assets/assets2/animation/stone_brazier_fire.webm';
            bVideo.autoplay = true; bVideo.loop = true; bVideo.muted = true; bVideo.playsInline = true; bVideo.preload = 'auto';
            bVideo.play().catch(function(){});

            var bTex = new THREE.CanvasTexture(bCanvas);
            bTex.minFilter = THREE.LinearFilter; bTex.magFilter = THREE.LinearFilter;

            var bSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: bTex, transparent: true, depthTest: true, depthWrite: false }));
            bSprite.scale.set(0.55, 0.55, 1);
            bSprite.position.set(bx, 0.3, 2.0); // Z=2.0 перед игроком
            scene.add(bSprite);

            braziers.push({ video: bVideo, canvas: bCanvas, ctx: bCtx, texture: bTex, sprite: bSprite, light: fireLight, phase: Math.random() * Math.PI * 2 });
        }

        function updateBrazierFrames() {
            for (var i = 0; i < braziers.length; i++) {
                var br = braziers[i];
                var v = br.video;
                if (!v || v.readyState < 2) continue;
                try {
                    br.ctx.drawImage(v, 0, 0, br.canvas.width, br.canvas.height);
                    var imgData = br.ctx.getImageData(0, 0, br.canvas.width, br.canvas.height);
                    chromaKeyImageData(imgData);
                    br.ctx.putImageData(imgData, 0, 0);
                    br.texture.needsUpdate = true;
                } catch (e) {}
            }
        }

        // ============================================================
        //  ПЕРСОНАЖ (Анимация как в платформере - z = 1.0)
        // ============================================================
        const player = {
            pos: new THREE.Vector3(3, 0, 1.0), // Игрок на Z=1.0
            vel: new THREE.Vector3(0, 0, 0),
            onGround: false,
            facing: 1,
            speed: 6.0,
            jumpPower: 10.0,
            gravity: 25.0,
            jumpPressed: false
        };

        const heroGroup = new THREE.Group();
        heroGroup.position.set(3, 0, 1.0);
        platformerGroup.add(heroGroup);

        const video = document.createElement('video');
        video.src = 'assets/assets2/animation/Untitled_Archer_Side_Scroller.webm';
        video.loop = true; video.muted = true; video.pause(); video.crossOrigin = 'anonymous';

        const hCanvas = document.createElement('canvas');
        hCanvas.width = 512; hCanvas.height = 512;
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });

        function chromaKeyHero(imgData) {
            var d = imgData.data;
            for (var i = 0; i < d.length; i += 4) {
                var r = d[i], g = d[i+1], b = d[i+2];
                if (g > 80 && g > r * 1.35 && g > b * 1.35) {
                    var greenness = (g - Math.max(r, b)) / g;
                    if (greenness > 0.25) { d[i+3] = 0; } else { d[i+3] = Math.floor(255 * (1 - greenness / 0.25)); }
                }
            }
        }
        function processHeroFrame(flip) {
            if (video.readyState < 2) return;
            try {
                hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
                hCtx.save();
                if (flip) { hCtx.scale(-1, 1); hCtx.translate(-hCanvas.width, 0); }
                hCtx.drawImage(video, 0, 0, hCanvas.width, hCanvas.height);
                hCtx.restore();
                var imgData = hCtx.getImageData(0, 0, hCanvas.width, hCanvas.height);
                chromaKeyHero(imgData);
                hCtx.putImageData(imgData, 0, 0);
                heroTex.needsUpdate = true;
            } catch(e) {}
        }
        const heroTex = new THREE.CanvasTexture(hCanvas);
        heroTex.minFilter = heroTex.magFilter = THREE.LinearFilter;

        const heroSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: heroTex, transparent: true, depthTest: false }));
        heroSprite.center.set(0.5, 0); 
        heroSprite.scale.set(2.2, 2.2, 1); 
        heroSprite.position.set(0, 0, 0); 
        heroGroup.add(heroSprite);

        const heroTexStatic = loader.load('assets/assets2/game_details/ezgif-frame-006.png');
        const staticSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: heroTexStatic, transparent: true, depthTest: false }));
        staticSprite.center.set(0.5, 0); 
        staticSprite.scale.set(2.2, 2.2, 1); 
        staticSprite.position.set(0, 0, 0);
        heroGroup.add(staticSprite);
        video.addEventListener('play', () => { staticSprite.visible = false; });

        // ПРОВЕРКА ВОЗВРАТА ИЗ РАЗДЕЛА (Восстановление позиции)
        try {
            if (parent && parent.Sherwood && parent.Sherwood._campReturnPos) {
                var rx = parent.Sherwood._campReturnPos.x;
                if (typeof rx === 'number' && !isNaN(rx)) {
                    player.pos.x = rx;
                    heroGroup.position.x = rx;
                }
                parent.Sherwood._campReturnPos = null;
            }
        } catch(e) {}

        // ============================================================
        //  УПРАВЛЕНИЕ
        // ============================================================
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyJ'].includes(e.code)) e.preventDefault();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        const touch = { left: false, right: false };
        function bindTouch(id, prop) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); touch[prop] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); touch[prop] = false; });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); touch[prop] = true; });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); touch[prop] = false; });
            el.addEventListener('mouseleave', () => { touch[prop] = false; });
        }
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');

        function updatePlayer(dt) {
            const p = player;
            let moveX = 0;
            if (keys['KeyA'] || keys['ArrowLeft'] || touch.left) moveX -= 1;
            if (keys['KeyD'] || keys['ArrowRight'] || touch.right) moveX += 1;

            p.vel.x = moveX * p.speed;
            if (moveX !== 0) {
                p.facing = moveX;
                if (video.paused) video.play().catch(()=>{});
                if (!stepsPlaying) startSteps();
            } else {
                if (!video.paused) video.pause();
                if (stepsPlaying) stopSteps();
            }

            p.vel.y -= p.gravity * dt;
            if (p.vel.y < -25) p.vel.y = -25;

            const newX = p.pos.x + p.vel.x * dt;
            p.pos.x = Math.max(2.5, Math.min(LEVEL_W - 2.5, newX));

            const newY = p.pos.y + p.vel.y * dt;
            if (newY <= 0) { p.pos.y = 0; p.vel.y = 0; p.onGround = true; }
            else { p.pos.y = newY; p.onGround = false; }
        }

        // ============================================================
        //  ЗВУКИ
        // ============================================================
        var soundSteps = new Audio('assets/assets2/tune/steps.wav');
        var soundAltar = new Audio('assets/assets2/tune/altar.wav');
        var campMusic = new Audio('assets/assets2/music/main_theme_2.ogg');
        campMusic.loop = true; campMusic.volume = 0.35;

        function playSound(a) { try { a.currentTime = 0; a.play().catch(function(){}); } catch(e) {} }
        var stepsPlaying = false;
        function startSteps() { if (stepsPlaying) return; stepsPlaying = true; try { soundSteps.currentTime = 0; soundSteps.play().catch(function(){}); } catch(e){} }
        function stopSteps() { stepsPlaying = false; try { soundSteps.pause(); soundSteps.currentTime = 0; } catch(e){} }

        setTimeout(function() { try { campMusic.play().catch(function(){}); } catch(e){} }, 300);
        window.addEventListener('click', function() { try { campMusic.play().catch(function(){}); } catch(e){} });

        // ============================================================
        //  СФЕРЫ HP/Мана
        // ============================================================
        function updateHeroSpheres() {
            if (!parent.Sherwood || !parent.Sherwood.getPlayer) return;
            var p = parent.Sherwood.getPlayer();
            if (!p) return;
            var hpPercent = p.stats.hp / p.stats.maxHp;
            var lifeFill = document.getElementById('life-fill');
            if (lifeFill) lifeFill.style.clipPath = 'inset(' + Math.max(0, (1 - hpPercent) * 100) + '% 0 0 0)';
            var hpText = document.getElementById('hp-text');
            if (hpText) hpText.textContent = 'HP: ' + Math.floor(p.stats.hp);

            var mana = p.stats.filth || 0;
            var maxMana = p.stats.maxFilth || 100;
            var manaPercent = mana / maxMana;
            var manaFill = document.getElementById('mana-fill');
            if (manaFill) manaFill.style.clipPath = 'inset(' + Math.max(0, (1 - manaPercent) * 100) + '% 0 0 0)';
            var manaText = document.getElementById('mana-text');
            if (manaText) manaText.textContent = 'Скверна: ' + Math.floor(mana) + '%';
        }
        setTimeout(updateHeroSpheres, 400);
        setInterval(updateHeroSpheres, 1000);

        // ============================================================
        //  ВЗАИМОДЕЙСТВИЕ С ДВЕРЬМИ
        // ============================================================
        var actionBtn = document.getElementById('action-btn');
        var actionBtnImg = document.getElementById('action-btn-img');
        var activeDoor = null;

        function checkDoorInteraction() {
            var closestDoor = null;
            var minDist = 4.5;

            for (var i = 0; i < doorLeaves.length; i++) {
                var door = doorLeaves[i];
                if (door.userData.open) continue;
                var dist = Math.abs(player.pos.x - door.position.x);
                if (dist < minDist) {
                    minDist = dist;
                    closestDoor = door;
                }
            }

            if (closestDoor) {
                activeDoor = closestDoor;
                actionBtn.style.display = 'block';
                actionBtnImg.src = 'assets/assets2/icons/take.png';
            } else {
                activeDoor = null;
                actionBtn.style.display = 'none';
            }
        }

        actionBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (activeDoor && !activeDoor.userData.open) {
                activeDoor.userData.open = true;
                activeDoor.userData.t = 0;
                playSound(soundAltar);
                
                // СОХРАНЯЕМ ПОЗИЦИЮ ИГРОКА ПЕРЕД ПЕРЕХОДОМ
                try {
                    if (parent && parent.Sherwood) {
                        parent.Sherwood._campReturnPos = { x: player.pos.x };
                    }
                } catch(e) {}

                var sectionToOpen = activeDoor.userData.section;
                setTimeout(function() {
                    if (sectionToOpen && sectionToOpen.open) {
                        sectionToOpen.open();
                    }
                }, 300);
            }
        });

        // ============================================================
        //  АНИМАЦИЯ
        // ============================================================
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min((performance.now() - lastTime) / 1000, 0.05);
            lastTime = performance.now();
            const t = performance.now() / 1000;

            if (video.readyState >= 2) processHeroFrame(player.facing < 0);

            updatePlayer(dt);
            camPlatformer.position.x = player.pos.x;
            camPlatformer.lookAt(camPlatformer.position.x, 1.0, 0);
            heroGroup.position.copy(player.pos);
            heroGroup.position.y = player.pos.y; 
            playerLight.position.set(player.pos.x, player.pos.y + 1, 2);

            // Логика анимации дверей
            for (var i = 0; i < doorLeaves.length; i++) {
                var d = doorLeaves[i];
                if (d.userData.open && d.userData.t < 1) {
                    d.userData.t += dt / 0.45;
                    var k2 = Math.min(d.userData.t, 1);
                    var e2 = k2 * k2 * (3 - 2 * k2);
                    d.position.y = d.userData.originalY + (d.userData.openY - d.userData.originalY) * e2;
                    if (k2 >= 1) d.visible = false;
                }
            }

            // Обновление бразиеров
            updateBrazierFrames();
            for (var bi = 0; bi < braziers.length; bi++) {
                var bb = braziers[bi];
                bb.light.intensity = 0.75 + Math.sin(t * 5.5 + bb.phase) * 0.18 + Math.sin(t * 13.7 + bb.phase) * 0.08;
            }

            checkDoorInteraction();
            renderer.render(scene, camPlatformer);
        }
        animate();

        addEventListener('resize', function() {
            var aspect = window.innerWidth / window.innerHeight;
            camPlatformer.aspect = aspect; camPlatformer.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
